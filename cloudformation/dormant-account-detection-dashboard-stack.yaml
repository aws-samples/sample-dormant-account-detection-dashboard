          ########################################################################################################
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0
          ########################################################################################################
          """
          PublishMetrics Lambda (Python)

          Final Step Functions state. Aggregates all collected metrics and publishes to CloudWatch.
          Also calculates dormancy scores using configurable weights from environment variables.

          Metrics published per account (Namespace: DormantAccountDetection):
            ApiCallCount, ActiveIAMUserCount, ActiveIAMRoleCount, ActiveSSOUserCount,
            TotalResourceCount, ResourceCreatedCount, MonthlyCostUSD, DormancyScore, DormancyRating
            CollectionFailed (1 when a per-account Map iteration failed in the State Machine,
                              0 on a successful run; for failed accounts only this metric is
                              published — raw signals and dormancy score are skipped to avoid
                              conflating collection failure with genuine dormancy)

          Alert metrics (Namespace: DormantAccountDetectionAlerts, no dimensions):
            CriticalDormancyAccountCount, HighDormancyAccountCount

          SFN metrics (Namespace: DormantAccountDetectionSfn):
            MetricCollectionSuccess, MetricCollectionFailure, ExecutionDurationSeconds,
            AccountsProcessed, AccountsFailed

          Dormancy Score formula — HYBRID SELF-BASELINING model (weights via
          config.dormancyScoreWeights or DORMANCY_WEIGHT_* env vars, defaults shown):

          ABSOLUTE human-presence signals (baseline-free, all-or-nothing):
            +35 ActiveSSOUserCount > 0   (any non-admin human SSO login in lookback window)
            +15 ActiveIAMUserCount > 0   (any IAM user credential activity in lookback window)

          SELF-RELATIVE trend signals (each account compared against ITS OWN history;
          points = weight * trend_ratio, where trend_ratio = mean(last N days) /
          mean(first N days) of the account's daily metric history, capped at 1.0;
          N = max(1, round(trendWindowFraction * lookbackDays)), default a quarter of the window):
            +20 * apiCallTrend           (ApiCallCount history)
            +10 * iamRoleTrend           (ActiveIAMRoleCount history)
            +10 * costTrend              (MonthlyCostUSD history)
            +10 * resourceCreatedTrend   (ResourceCreatedCount history)

          Stable or growing activity earns full trend points; declining activity earns
          proportionally fewer. Cold-start rule: a trend needs >= 2*N daily datapoints,
          otherwise the ratio is 1.0 (full points — missing history never creates a false
          positive). A zero leading-window mean also yields 1.0 (no baseline to decline
          from); the absolute human-presence signals flag such accounts instead.
          TotalResourceCount is NOT scored (standing inventory, not activity) — it remains
          a published metric for dashboard visibility only. No absolute thresholds exist
          in this model — there is nothing to tune per account.

          Rating bands (configurable via *_DORMANCY_MAX_SCORE env vars / config.dormancyRatingBands;
          defaults shown): CRITICAL(1)=score<=20, HIGH(2)<=40, MEDIUM(3)<=60, LOW(4)<=80, ACTIVE(5)>80

          New-account grace period (NEW_ACCOUNT_GRACE_PERIOD_DAYS env var /
          config.newAccountGracePeriodDays): accounts whose AWS Organizations JoinedTimestamp is
          within the grace window are EXCLUDED from dormancy scoring to avoid false alerts on
          freshly-onboarded accounts. Raw signals and CollectionFailed=0 are still published, but
          DormancyScore/DormancyRating are skipped and the account is NOT counted in the
          CRITICAL/HIGH alert totals. Applies to all newly-joined accounts regardless of
          JoinedMethod (CREATED or INVITED). Accounts with an unknown/unparseable JoinedTimestamp
          are always scored. A value of 0 disables the grace period (log-only — no extra metric).

          All log output is structured JSON for CloudWatch Logs Insights queries.
          """
          import json
          import logging
          import os
          import re
          import boto3
          from datetime import datetime, timezone, timedelta

          MAX_METRICS_PER_BATCH = 1000

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # Lambda always sets AWS_REGION — use it directly with no fallback.
          cw_client = boto3.client("cloudwatch", region_name=os.environ["AWS_REGION"])
          ssm_client = boto3.client("ssm", region_name=os.environ["AWS_REGION"])

          # Account-name registry for renamed accounts. Per-account metrics are dimensioned by
          # AccountId AND AccountName, so a rename starts a new series. To keep trend history and
          # prior ratings linked, each renamed account gets one SSM String parameter
          # <path>/<accountId> holding its names, oldest first. Only renamed accounts get a
          # parameter, so writes are rare.
          ACCOUNT_NAME_REGISTRY_PATH = "/DormantAccountDetection/AccountNames"
          MAX_ACCOUNT_NAMES = 10


          def log(level, event, message, **fields):
              """Emit a structured JSON log line via the logging module."""
              record = {
                  "event": event,
                  "message": message,
              }
              record.update(fields)
              getattr(logger, level.lower(), logger.info)(json.dumps(record))


          def get_weights():
              """Hybrid self-baselining weights (fallback when config dict not available)."""
              return {
                  "ssoPresence": int(os.environ.get("DORMANCY_WEIGHT_SSO_PRESENCE", "35")),
                  "iamUserPresence": int(os.environ.get("DORMANCY_WEIGHT_IAM_USER_PRESENCE", "15")),
                  "apiCallTrend": int(os.environ.get("DORMANCY_WEIGHT_API_CALL_TREND", "20")),
                  "iamRoleTrend": int(os.environ.get("DORMANCY_WEIGHT_IAM_ROLE_TREND", "10")),
                  "costTrend": int(os.environ.get("DORMANCY_WEIGHT_COST_TREND", "10")),
                  "resourceCreatedTrend": int(os.environ.get("DORMANCY_WEIGHT_RESOURCE_CREATED_TREND", "10")),
              }


          def get_trend_window_fraction():
              """Trend comparison window fraction (fallback when config dict not available)."""
              return float(os.environ.get("TREND_WINDOW_FRACTION", "0.25"))


          def get_rating_bands():
              """Read dormancy rating band upper bounds from environment variables
              (fallback when config dict not available). Keys map to the 1-5 rating cascade."""
              return {
                  "critical": int(os.environ.get("CRITICAL_DORMANCY_MAX_SCORE", "20")),
                  "high": int(os.environ.get("HIGH_DORMANCY_MAX_SCORE", "40")),
                  "medium": int(os.environ.get("MEDIUM_DORMANCY_MAX_SCORE", "60")),
                  "low": int(os.environ.get("LOW_DORMANCY_MAX_SCORE", "80")),
              }


          def is_within_grace_period(joined_timestamp_str, grace_period_days, now,
                                     account_id, account_name):
              """
              Return True when the account joined the AWS Organization within the last
              grace_period_days — i.e. it is a recently-onboarded account that should be
              EXCLUDED from dormancy scoring to avoid false dormancy alerting.

              joined_timestamp_str: ISO-8601 string from AWS Organizations JoinedTimestamp
                                    (captured by GetAccounts), or None/empty when unknown.
              grace_period_days:    configured grace window in days (caller guarantees > 0).
              now:                  timezone-aware reference "current" datetime.

              Behaviour:
                - Unknown / empty / unparseable JoinedTimestamp → return False so the account is
                  evaluated normally. We never silently suppress an account whose age cannot be
                  determined (a real dormant account must not be hidden by a missing timestamp).
                - Otherwise return (age_in_days < grace_period_days).
              """
              if not joined_timestamp_str:
                  log("WARNING", "grace_period_unknown_join_date",
                      "Account has no JoinedTimestamp — evaluating dormancy normally (not skipped)",
                      accountId=account_id, accountName=account_name)
                  return False
              try:
                  joined = datetime.fromisoformat(str(joined_timestamp_str).replace("Z", "+00:00"))
                  if joined.tzinfo is None:
                      joined = joined.replace(tzinfo=timezone.utc)
              except (ValueError, TypeError):
                  log("WARNING", "grace_period_unparseable_join_date",
                      "Could not parse JoinedTimestamp — evaluating dormancy normally (not skipped)",
                      accountId=account_id, accountName=account_name,
                      joinedTimestamp=str(joined_timestamp_str))
                  return False
              age_days = (now - joined).total_seconds() / 86400.0
              return age_days < grace_period_days


          # The four signals scored via SELF-RELATIVE trends. Maps the weight key to the
          # CloudWatch metric whose daily history the trend is computed from.
          TREND_SIGNAL_METRICS = {
              "apiCallTrend": "ApiCallCount",
              "iamRoleTrend": "ActiveIAMRoleCount",
              "costTrend": "MonthlyCostUSD",
              "resourceCreatedTrend": "ResourceCreatedCount",
          }

          # Partial collection failures. Collectors return failedSignals: the signals they could not
          # collect this run. Their raw metrics aren't published (so no false zero enters the trend
          # history), a missing presence signal skips scoring for the account, and a missing trend
          # signal scores neutral (1.0), so a collection failure can never lower a score.
          PRESENCE_SIGNALS = {"sso", "iamUsers"}
          TREND_SIGNAL_SOURCE = {
              "apiCallTrend": "apiCalls",
              "iamRoleTrend": "iamRoles",
              "costTrend": "cost",
              "resourceCreatedTrend": "resourceCreated",
          }
          IAM_SIGNALS = ("iamUsers", "iamRoles", "sso")
          CONFIG_SIGNALS = ("totalResources", "resourceCreated")


          def failed_signals_of(result, signals):
              """Signals a collector reported as not collected. A result with errors but no
              failedSignals field (an older collector) is treated as missing every signal it provides."""
              reported = (result or {}).get("failedSignals")
              if reported is None:
                  return set(signals) if (result or {}).get("errors") else set()
              return set(reported) & set(signals)


          def trend_window_size(lookback_days, trend_window_fraction):
              """Days in each of the leading and trailing trend comparison windows."""
              return max(1, round(lookback_days * trend_window_fraction))


          def trend_ratio(values, n):
              """
              Self-relative activity trend: mean(last n values) / mean(first n values), capped
              at 1.0. Each account is compared against ITS OWN history — no absolute thresholds.

              Returns 1.0 (neutral, full points) when:
                - history is shorter than 2*n datapoints (cold-start — a fresh deployment or a
                  newly onboarded account must never be false-positived by missing history), or
                - the leading-window mean is 0 (no baseline to decline from; a neutral ratio
                  contributes full weight, so the absolute human-presence signals add or withhold
                  their 50 points and nothing pulls a non-declining account below 50 - this model
                  detects decline, not sustained flat dormancy).
              """
              if len(values) < 2 * n:
                  return 1.0
              leading = sum(values[:n]) / n
              trailing = sum(values[-n:]) / n
              if leading <= 0:
                  return 1.0
              # Clamp to [0.0, 1.0]. Upper bound: stable/growing activity earns full weight.
              # Lower bound: a negative trailing mean (e.g. MonthlyCostUSD going negative on a
              # credit/refund) would otherwise yield a negative ratio and SUBTRACT points; the
              # scoring contract is a float in [0, 1] (see calculate_dormancy_score).
              return max(0.0, min(1.0, trailing / leading))


          def load_name_registry():
              """{accountId: [names]} from the SSM account-name registry (renamed accounts only)."""
              registry = {}
              paginator = ssm_client.get_paginator("get_parameters_by_path")
              for page in paginator.paginate(Path=ACCOUNT_NAME_REGISTRY_PATH, Recursive=False):
                  for param in page.get("Parameters", []):
                      acct_id = param["Name"].rsplit("/", 1)[-1]
                      try:
                          names = json.loads(param["Value"])
                      except (TypeError, ValueError):
                          continue
                      if isinstance(names, list):
                          registry[acct_id] = [str(n) for n in names]
              return registry


          def recent_names_by_account(metrics_namespace):
              """
              {accountId: {names}} for every CollectionFailed series. CollectionFailed is published
              for every scored, grace-period, and failed account on every run, so a rename shows up
              here the next run. ListMetrics only returns series with data in the past two weeks,
              which is why detected names are written to the registry.
              """
              seen = {}
              paginator = cw_client.get_paginator("list_metrics")
              for page in paginator.paginate(Namespace=metrics_namespace, MetricName="CollectionFailed"):
                  for metric in page.get("Metrics", []):
                      dims = {d["Name"]: d["Value"] for d in metric.get("Dimensions", [])}
                      if dims.get("AccountId") and dims.get("AccountName"):
                          seen.setdefault(dims["AccountId"], set()).add(dims["AccountName"])
              return seen


          def resolve_account_names(accounts, metrics_namespace):
              """
              Return {accountId: [names]}: every AccountName this account's metrics were published
              under, oldest first, current name last. History reads query all of them, so renaming
              an account no longer resets its trends or its prior rating. A failure to read or write
              the registry falls back to the current name only (the pre-registry behaviour).
              """
              try:
                  registry = load_name_registry()
              except Exception as e:
                  log("WARNING", "account_name_registry_read_failed",
                      "Could not read the account-name registry; history uses current names only",
                      error=str(e))
                  registry = {}
              try:
                  recent = recent_names_by_account(metrics_namespace)
              except Exception as e:
                  log("WARNING", "recent_account_names_failed",
                      "Could not list recent account names; renames this run may not be linked",
                      error=str(e))
                  recent = {}

              resolved = {}
              for acct in accounts:
                  acct_id = acct["accountId"]
                  current = acct["accountName"][:256]
                  known = registry.get(acct_id, [])
                  earlier = [n for n in known if n != current]
                  earlier += sorted(n for n in recent.get(acct_id, ()) if n != current and n not in earlier)
                  names = (earlier + [current])[-MAX_ACCOUNT_NAMES:]
                  resolved[acct_id] = names
                  if len(names) > 1 and names != known:
                      try:
                          ssm_client.put_parameter(
                              Name=f"{ACCOUNT_NAME_REGISTRY_PATH}/{acct_id}",
                              Value=json.dumps(names),
                              Type="String",
                              Overwrite=True,
                          )
                          log("INFO", "account_rename_recorded",
                              "Account names recorded so history stays linked after a rename",
                              accountId=acct_id, accountNames=names)
                      except Exception as e:
                          log("WARNING", "account_name_registry_write_failed",
                              "Could not record account names; history stays linked only while "
                              "the old series is less than two weeks old",
                              accountId=acct_id, error=str(e))
              return resolved


          def fetch_signal_histories(account_id, account_names, metrics_namespace, lookback_days):
              """
              Fetch the daily history of all four trend signals for one account in a SINGLE
              GetMetricData call: 4 MetricDataQueries per AccountName the account has had
              (see resolve_account_names), merged by timestamp so a rename keeps the history.

              Returns (histories, fetch_failed):
                histories    {weight_key: [daily values ascending]} — a missing/failed series
                             comes back as an empty list, which trend_ratio() treats as cold-start
                             (ratio 1.0, full points; safe default — an API failure must never
                             flag an account dormant).
                fetch_failed True when the GetMetricData call raised (a hard fetch failure), so the
                             caller can DISTINGUISH this from a genuine cold-start (both yield empty
                             histories and neutral 1.0 ratios) and publish an observability counter.
              """
              histories = {key: [] for key in TREND_SIGNAL_METRICS}
              fetch_failed = False
              # Accumulate (timestamp, value) pairs and sort by timestamp before scoring.
              # GetMetricData returns Values ordered per ScanBy, but — matching the defensive
              # posture of pull_metrics.py — we do NOT rely on that: an out-of-order response
              # would silently corrupt every trend ratio (and thus every DormancyScore). The
              # sort is a no-op when data is already ascending (the observed case) and cheap
              # (<= lookback_days points x 4 series per account).
              paired = {key: [] for key in TREND_SIGNAL_METRICS}
              try:
                  start_time = datetime.now(timezone.utc) - timedelta(days=lookback_days)
                  end_time = datetime.now(timezone.utc)
                  queries = []
                  id_to_key = {}
                  for j, name in enumerate(account_names):
                      for i, (key, metric_name) in enumerate(TREND_SIGNAL_METRICS.items()):
                          qid = "t%d_%d" % (i, j)
                          id_to_key[qid] = key
                          queries.append({
                              "Id": qid,
                              "MetricStat": {
                                  "Metric": {
                                      "Namespace": metrics_namespace,
                                      "MetricName": metric_name,
                                      "Dimensions": [
                                          {"Name": "AccountId", "Value": account_id},
                                          {"Name": "AccountName", "Value": name[:256]},
                                      ],
                                  },
                                  "Period": 86400,
                                  "Stat": "Maximum",
                              },
                              "ReturnData": True,
                          })
                  next_token = None
                  while True:
                      kwargs = {
                          "StartTime": start_time,
                          "EndTime": end_time,
                          "ScanBy": "TimestampAscending",
                          "MetricDataQueries": queries,
                      }
                      if next_token:
                          kwargs["NextToken"] = next_token
                      resp = cw_client.get_metric_data(**kwargs)
                      for result in resp.get("MetricDataResults", []):
                          key = id_to_key.get(result.get("Id"))
                          if key:
                              paired[key].extend(
                                  zip(result.get("Timestamps", []), result.get("Values", [])))
                      next_token = resp.get("NextToken")
                      if not next_token:
                          break
              except Exception as e:
                  fetch_failed = True
                  log("WARNING", "signal_history_fetch_failed",
                      "Failed to fetch trend signal histories — affected trends fall back to "
                      "neutral ratio 1.0 (full points, never a false positive); the dormancy_score "
                      "log below carries signalHistoryFetchFailed=true for this account",
                      accountId=account_id, accountName=account_names[-1], error=str(e))
              # Merge the series of every account name by timestamp (Maximum, matching the
              # per-series Stat), then sort chronologically and drop the timestamps. Runs on both
              # the success and partial-failure paths; empty series stay empty (cold-start -> 1.0).
              for key, pairs in paired.items():
                  merged = {}
                  for ts, value in pairs:
                      merged[ts] = max(value, merged.get(ts, value))
                  histories[key] = [merged[ts] for ts in sorted(merged)]
              return histories, fetch_failed


          def calculate_dormancy_score(presence, trend_ratios, weights):
              """
              HYBRID SELF-BASELINING scoring (0-100, higher = more active).

              presence:     {"ssoPresence": bool, "iamUserPresence": bool} — absolute,
                            baseline-free human-presence flags, awarded all-or-nothing.
              trend_ratios: {"apiCallTrend"|"iamRoleTrend"|"costTrend"|"resourceCreatedTrend":
                            float in [0, 1]} — self-relative trend ratios from trend_ratio().
                            Points awarded proportionally: weight * ratio.

              TotalResourceCount is intentionally not scored (standing inventory, not activity).

              Returns (score, breakdown) — breakdown carries each component's input and awarded
              points for the structured dormancy_score log entry (explainability).
              """
              breakdown = {}
              for key in ("ssoPresence", "iamUserPresence"):
                  awarded = weights[key] if presence.get(key) else 0
                  breakdown[key] = {"value": bool(presence.get(key)), "points": awarded}
              for key in TREND_SIGNAL_METRICS:
                  ratio = trend_ratios.get(key, 1.0)
                  breakdown[key] = {"ratio": round(ratio, 3), "points": round(weights[key] * ratio, 1)}
              score = round(sum(component["points"] for component in breakdown.values()))
              return score, breakdown


          def get_dormancy_rating(score, bands):
              """
              Bucket a 0-100 DormancyScore into a 1-5 rating using configurable band
              upper bounds (inclusive). Higher score = more active.
              bands keys: "critical", "high", "medium", "low" — must be strictly increasing.
              """
              if score <= bands["critical"]: return 1  # CRITICAL
              if score <= bands["high"]:     return 2  # HIGH
              if score <= bands["medium"]:   return 3  # MEDIUM
              if score <= bands["low"]:      return 4  # LOW
              return 5                                 # ACTIVE


          RATING_LABEL = {1: "CRITICAL", 2: "HIGH", 3: "MEDIUM", 4: "LOW", 5: "ACTIVE"}

          # Ratings that are worth telling an operator about. Ratings invert: 1 = CRITICAL is the
          # most dormant, so "more dormant" means a strictly LOWER rating.
          ALERT_RATINGS = (1, 2)

          # GetMetricData allows up to 500 MetricDataQueries per request; 400 leaves headroom.
          # Same batch size the DormantAccounts widget Lambda uses.
          GET_METRIC_DATA_BATCH = 400


          def fetch_prior_ratings(accounts, account_names, metrics_namespace, before, window_days):
              """
              Read each account's PRIOR DormancyRating - the most recent datapoint before `before`
              (this run's collection timestamp) - in batched GetMetricData calls of up to 400
              queries. Each account is queried under every name in account_names, so a renamed
              account keeps its prior rating.

              Period=60 rather than 86400 is load-bearing, not incidental. The comparison has to see
              the most recent ACTUAL datapoint: on a day with two runs (a deploy plus a manual
              verification run) a daily bucket would
              collapse both into one aggregate and the second run could not read the first run's
              rating as its prior. GetMetricData returns only buckets that HAVE data, so 100
              accounts x a few daily datapoints is ~300 datapoints in a single request - about 0.3%
              of the 100,800-datapoint response limit, NOT one bucket per minute of the window.
              CloudWatch retains 60-second data for 15 days, comfortably longer than this window.

              MUST be called BEFORE this run publishes its own DormancyRating datapoints, otherwise
              this run's values could be read back as the prior ones and no crossing would ever be
              detected.

              Returns (prior, fetch_failed):
                prior        {accountId: rating}. Accounts with no datapoint in the window are
                             ABSENT, which select_newly_flagged() reads as "no prior" and suppresses.
                fetch_failed True when the call raised. The caller RAISES on this rather than
                             quietly sending nothing, because a swallowed failure loses the run's
                             crossings PERMANENTLY: the next run would read this run's already
                             in-band rating as its prior and find nothing new.
              """
              paired = {}
              start = before - timedelta(days=window_days)
              series = [(acct["accountId"], name)
                        for acct in accounts
                        for name in account_names.get(acct["accountId"], [acct["accountName"][:256]])]
              try:
                  for i in range(0, len(series), GET_METRIC_DATA_BATCH):
                      batch = series[i:i + GET_METRIC_DATA_BATCH]
                      index = {}
                      queries = []
                      for n, (acct_id, name) in enumerate(batch):
                          qid = "p%d" % n
                          index[qid] = acct_id
                          queries.append({
                              "Id": qid,
                              "MetricStat": {
                                  "Metric": {
                                      "Namespace": metrics_namespace,
                                      "MetricName": "DormancyRating",
                                      "Dimensions": [
                                          {"Name": "AccountId", "Value": acct_id},
                                          {"Name": "AccountName", "Value": name[:256]},
                                      ],
                                  },
                                  "Period": 60,
                                  "Stat": "Minimum",
                              },
                              "ReturnData": True,
                          })
                      next_token = None
                      while True:
                          kwargs = {
                              "StartTime": start,
                              "EndTime": before,
                              "ScanBy": "TimestampDescending",
                              "MetricDataQueries": queries,
                          }
                          if next_token:
                              kwargs["NextToken"] = next_token
                          resp = cw_client.get_metric_data(**kwargs)
                          for result in resp.get("MetricDataResults", []):
                              acct_id = index.get(result.get("Id"))
                              if acct_id is None:
                                  continue
                              paired.setdefault(acct_id, []).extend(
                                  zip(result.get("Timestamps", []), result.get("Values", [])))
                          next_token = resp.get("NextToken")
                          if not next_token:
                              break
              except Exception as e:
                  log("ERROR", "prior_rating_fetch_failed",
                      "Failed to read prior DormancyRating history - cannot tell a new crossing "
                      "from a steady state, so this run's notification is unsafe to compute",
                      error=str(e), accountCount=len(accounts), windowDays=window_days)
                  return {}, True
              # Reduce to the single most recent datapoint STRICTLY BEFORE `before`, per account.
              #
              # Two deliberate choices here:
              #   - Timestamps are compared explicitly rather than trusting ScanBy ordering across
              #     pages (the same defensive posture as fetch_signal_histories). An out-of-order
              #     response would pick the wrong prior rating and either invent or swallow a
              #     crossing.
              #   - The `ts < before` filter is enforced in code rather than relying on
              #     GetMetricData's EndTime boundary being exclusive. This matters on the RETRY
              #     path: the state machine retries this task on States.TaskFailed (MaxAttempts 2),
              #     so when the notification block below raises, attempt 2 re-runs the whole
              #     function AFTER attempt 1 already published this run's DormancyRating datapoints
              #     at exactly `before`. Without this filter, attempt 2 could read its own values
              #     back as the "prior" ones, see no change, and silently drop the very crossing the
              #     raise existed to protect. With it, attempt 2 reads the true priors and sends the
              #     notification that attempt 1 could not.
              prior = {}
              for acct_id, pairs in paired.items():
                  earlier = [tv for tv in pairs if tv[0] < before]
                  if earlier:
                      prior[acct_id] = max(earlier, key=lambda tv: tv[0])[1]
              return prior, False


          def select_newly_flagged(current, prior):
              """
              Split this run's flagged accounts into the newly-crossed set and the rest.

              `current` is this run's flagged accounts (rating in ALERT_RATINGS), each
              {accountId, accountName, rating, score}. `prior` is {accountId: rating}.

              An account is NEWLY flagged when it HAS a prior rating AND this run's rating is
              strictly MORE dormant than that prior. The design's section-5 edge cases fall out of
              that one rule:

                - rule 1, no prior at all (first-ever run, or an account that just left the
                  new-account grace period): absent from `prior` -> not newly flagged -> suppressed.
                  Without this, a first deployment emails every account that is already dormant.
                - rule 2, a skipped or failed run: `prior` is read over a WINDOW, so the most recent
                  datapoint in that window is used; only a wholly empty window suppresses.
                - rule 3, grace-period and hard-collection-failure accounts publish no
                  DormancyRating at all, so they are excluded on both sides by construction.
                - rule 4, oscillation (HIGH -> MEDIUM -> HIGH) re-notifies on each genuine crossing.
                  v1 deliberately does not dedupe; hysteresis is a known future knob.
                - rule 5, two runs in one day compare against each other, because
                  fetch_prior_ratings reads per-minute datapoints rather than a daily bucket.

              This uses a strict WORSENING test (current < prior) rather than the design's literal
              "the prior rating was not in THIS band" wording. The literal form also fires on an
              IMPROVEMENT from CRITICAL to HIGH - prior 1 is not HIGH and current 2 is - which would
              email the operator, under a "NEWLY FLAGGED" heading, that an account they were already
              told about got BETTER. Worsening-only keeps every genuine escalation including
              HIGH -> CRITICAL, and drops only de-escalations.

              Accounts with no prior also land in `already`, which is why that section is context
              ("these are also currently flagged") and never itself triggers a send.
              """
              newly, already = [], []
              for acct in current:
                  prior_rating = prior.get(acct["accountId"])
                  if prior_rating is not None and acct["rating"] < round(prior_rating):
                      newly.append(dict(acct, priorRating=round(prior_rating)))
                  else:
                      already.append(acct)
              return newly, already


          def build_notification(newly, already, lookback_days, region, dashboard_name, now):
              """
              Render the combined change-based notification. ONE message per
              run covering both bands, so each account line carries its own rating and the message
              has no single severity; the subject is prefixed with the most severe NEW crossing.
              Ordering within each section is most dormant first, matching the table widget.
              """
              counts = {}
              for acct in newly:
                  label = RATING_LABEL[acct["rating"]]
                  counts[label] = counts.get(label, 0) + 1
              top_label = RATING_LABEL[min(acct["rating"] for acct in newly)]
              breakdown = ", ".join("%d %s" % (counts[label], label)
                                    for label in ("CRITICAL", "HIGH") if counts.get(label))
              subject = "[%s] Dormant accounts - %d new (%s); %d outstanding" % (
                  top_label, len(newly), breakdown, len(newly) + len(already))

              lines = []
              lines.append("Dormant Account Detection")
              lines.append("=" * 60)
              lines.append("Time:             %s" % now.strftime("%Y-%m-%d %H:%M:%S UTC"))
              lines.append("Region:           %s" % region)
              lines.append("Lookback window:  %d days" % lookback_days)
              lines.append("")
              lines.append("NEWLY FLAGGED THIS RUN (%d)" % len(newly))
              lines.append("")
              for acct in sorted(newly, key=lambda a: a["score"]):
                  lines.append("  * %s  (%s)" % (acct["accountName"], acct["accountId"]))
                  lines.append("      Rating: %-9s Dormancy score: %d/100   Previous rating: %s"
                               % (RATING_LABEL[acct["rating"]], round(acct["score"]),
                                  RATING_LABEL.get(acct["priorRating"], "unknown")))
              lines.append("")
              if already:
                  lines.append("ALREADY FLAGGED - UNCHANGED (%d)" % len(already))
                  lines.append("")
                  for acct in sorted(already, key=lambda a: a["score"]):
                      lines.append("  * %s  (%s)" % (acct["accountName"], acct["accountId"]))
                      lines.append("      Rating: %-9s Dormancy score: %d/100"
                                   % (RATING_LABEL[acct["rating"]], round(acct["score"])))
                  lines.append("")
              if dashboard_name:
                  lines.append("Dashboard: https://%s.console.aws.amazon.com/cloudwatch/home"
                               "?region=%s#dashboards/dashboard/%s"
                               % (region, region, dashboard_name))
                  lines.append("")
              lines.append("- DormantAccountDetection automated notification")
              return subject, "\n".join(lines)


          def publish_notification(newly, already, topic_arns, lookback_days, region,
                                   dashboard_name, now):
              """
              Publish ONE combined notification to the topic matching the most severe NEW crossing.
              Both topics carry the same operator email subscription, so one
              publish delivers exactly one email; publishing to both would deliver two.

              Raises on failure, deliberately. This path no longer rides the CloudWatch alarm
              framework, so it has given up the alarm's "stays in ALARM until the condition clears"
              durability that the function's DLQ suppression used to lean on. Raising turns a
              silently dropped email into a visible state-machine failure.
              """
              top_rating = min(acct["rating"] for acct in newly)
              topic_arn = topic_arns.get(top_rating, "")
              if not topic_arn:
                  log("WARNING", "notification_topic_missing",
                      "No SNS topic ARN configured for the resolved severity - notification skipped",
                      topRating=top_rating, topRatingLabel=RATING_LABEL[top_rating])
                  return
              subject, message = build_notification(
                  newly, already, lookback_days, region, dashboard_name, now)
              # Subject truncated to SNS's 100-character limit.
              boto3.client("sns", region_name=os.environ["AWS_REGION"]).publish(
                  TopicArn=topic_arn, Subject=subject[:100], Message=message)
              log("INFO", "notification_published",
                  "Change-based dormancy notification published",
                  topicArn=topic_arn,
                  topRatingLabel=RATING_LABEL[top_rating],
                  newlyFlaggedCount=len(newly),
                  alreadyFlaggedCount=len(already),
                  newlyFlagged=[{"accountId": a["accountId"],
                                 "rating": RATING_LABEL[a["rating"]],
                                 "priorRating": RATING_LABEL.get(a["priorRating"], "unknown")}
                                for a in newly])


          def make_account_datum(metric_name, value, account_id, account_name, unit, timestamp):
              return {
                  "MetricName": metric_name,
                  "Value": float(value),
                  "Unit": unit,
                  "Timestamp": timestamp,
                  "Dimensions": [
                      {"Name": "AccountId", "Value": account_id},
                      {"Name": "AccountName", "Value": account_name[:256]},
                  ],
              }


          def make_sfn_datum(metric_name, value, unit, timestamp):
              return {
                  "MetricName": metric_name,
                  "Value": float(value),
                  "Unit": unit,
                  "Timestamp": timestamp,
                  "Dimensions": [{"Name": "StateMachine", "Value": "AccountMetricCollection"}],
              }


          def make_alert_datum(metric_name, value, timestamp):
              return {
                  "MetricName": metric_name,
                  "Value": float(value),
                  "Unit": "Count",
                  "Timestamp": timestamp,
                  "Dimensions": [],
              }


          def publish_metric_data(namespace, metric_data):
              if not metric_data:
                  return
              for i in range(0, len(metric_data), MAX_METRICS_PER_BATCH):
                  cw_client.put_metric_data(
                      Namespace=namespace,
                      MetricData=metric_data[i:i + MAX_METRICS_PER_BATCH],
                  )


          # Input validation (threat T8, mitigation M16). Account IDs arrive in the invocation payload,
          # so entries without a 12-digit accountId are dropped before they are used in metric
          # dimensions or account-name registry parameter names.
          ACCOUNT_ID_PATTERN = re.compile(r"[0-9]{12}")


          def valid_accounts(accounts):
              valid = [a for a in (accounts or [])
                       if isinstance(a, dict) and isinstance(a.get("accountId"), str)
                       and ACCOUNT_ID_PATTERN.fullmatch(a["accountId"])]
              if len(valid) != len(accounts or []):
                  log("WARNING", "invalid_account_ids_dropped",
                      "Dropped input entries without a valid 12-digit accountId",
                      droppedCount=len(accounts or []) - len(valid))
              return valid


          def handler(event, context):
              accounts = valid_accounts(event.get("accounts", []))
              cost_metrics = event.get("costMetrics", {})
              config_metrics = event.get("configMetrics", {})
              iam_metrics = event.get("iamMetrics", [])
              api_call_metrics = event.get("apiCallMetrics", [])
              config = event.get("config", {})
              collection_timestamp_str = event.get("collectionTimestamp", datetime.now(timezone.utc).isoformat())
              execution_start_str = event.get("executionStartTime")

              now = datetime.now(timezone.utc)
              collection_timestamp = datetime.fromisoformat(collection_timestamp_str.replace("Z", "+00:00"))
              if collection_timestamp.tzinfo is None:
                  collection_timestamp = collection_timestamp.replace(tzinfo=timezone.utc)

              execution_start = now
              if execution_start_str:
                  try:
                      execution_start = datetime.fromisoformat(execution_start_str.replace("Z", "+00:00"))
                      if execution_start.tzinfo is None:
                          execution_start = execution_start.replace(tzinfo=timezone.utc)
                  except (ValueError, TypeError):
                      pass

              metrics_namespace = config.get("metricsNamespace") or os.environ.get("METRICS_NAMESPACE", "DormantAccountDetection")
              sfn_namespace = config.get("sfnMetricsNamespace") or os.environ.get("SFN_METRICS_NAMESPACE", "DormantAccountDetectionSfn")
              alert_namespace = config.get("sfnAlertNamespace") or os.environ.get("SFN_ALERT_NAMESPACE", "DormantAccountDetectionAlerts")
              weights = (config.get("dormancyScoreWeights") or {}) if config.get("dormancyScoreWeights") else get_weights()
              # Read dormancy rating band boundaries from config dict (set by GetAccounts) or fall back to env vars.
              rating_bands = (config.get("dormancyRatingBands") or {}) if config.get("dormancyRatingBands") else get_rating_bands()
              lookback_days = int(config.get("lookbackDays") or os.environ.get("LOOKBACK_DAYS", "90"))
              # Self-relative trend window: N days for each of the leading/trailing comparison means.
              trend_fraction = float(config.get("trendWindowFraction") or get_trend_window_fraction())
              trend_n = trend_window_size(lookback_days, trend_fraction)
              # New-account grace period — read from config dict (set by GetAccounts) with env var
              # fallback. NOTE: do NOT use `or` here — 0 is a valid, meaningful value (it disables
              # the grace period) and `0 or env` would incorrectly fall through to the env var default.
              grace_period_days = config.get("newAccountGracePeriodDays")
              if grace_period_days is None:
                  grace_period_days = os.environ.get("NEW_ACCOUNT_GRACE_PERIOD_DAYS", "30")
              grace_period_days = int(grace_period_days)

              log("INFO", "publish_start", "Starting metrics publish",
                  accountCount=len(accounts), metricsNamespace=metrics_namespace)

              # Build lookup dicts
              cost_map = {m["accountId"]: m for m in (cost_metrics.get("metrics") or [])}
              config_map = {m["accountId"]: m for m in (config_metrics.get("metrics") or [])}
              iam_map = {m["accountId"]: m for m in (iam_metrics or [])}
              api_call_map = {m["accountId"]: m for m in (api_call_metrics or [])}

              # Detect lambda-level errors
              lambda_errors = (cost_metrics.get("errors") or []) + (config_metrics.get("errors") or [])
              lambda_failed_signals = (failed_signals_of(cost_metrics, ("cost",))
                                       | failed_signals_of(config_metrics, CONFIG_SIGNALS))
              if lambda_errors:
                  log("ERROR", "lambda_level_errors",
                      "Lambda-level collection errors detected",
                      errors=lambda_errors)

              # ── Change-based dormancy notification setup ───────────────────────────────
              # Notifications are enabled purely by the presence of the topic ARNs. Both are set to
              # "" by the template when CreateAlarms is false, so the feature follows
              # EnableDormancyAlarms + NotificationEmail without needing its own flag.
              topic_arns = {
                  1: os.environ.get("CRITICAL_TOPIC_ARN", ""),
                  2: os.environ.get("HIGH_TOPIC_ARN", ""),
              }
              notifications_enabled = bool(topic_arns[1] and topic_arns[2])
              prior_window_days = int(os.environ.get("PRIOR_RATING_WINDOW_DAYS", "3"))
              # Read the PREVIOUS ratings now, BEFORE this run publishes its own DormancyRating
              # datapoints below - otherwise this run's values would be read back as the prior ones
              # and no crossing could ever be detected.
              # Every AccountName each account has had (current last), so trend history and prior
              # ratings survive a rename. Read BEFORE this run publishes, like the prior ratings.
              account_names = resolve_account_names(accounts, metrics_namespace)

              prior_ratings = {}
              prior_fetch_failed = False
              if notifications_enabled and accounts:
                  prior_ratings, prior_fetch_failed = fetch_prior_ratings(
                      accounts, account_names, metrics_namespace, collection_timestamp, prior_window_days)
                  log("INFO", "prior_ratings_read",
                      "Read prior DormancyRating for newly-flagged comparison",
                      accountsWithPriorRating=len(prior_ratings),
                      accountCount=len(accounts),
                      windowDays=prior_window_days,
                      fetchFailed=prior_fetch_failed)

              published_count = 0
              failed_count = len(accounts) if lambda_errors else 0
              all_metric_data = []
              critical_dormancy_count = 0
              high_dormancy_count = 0
              # This run's CRITICAL/HIGH accounts, carried to the notification block below.
              flagged = []
              # Count of accounts excluded from dormancy scoring by the new-account grace period.
              # Tracked for logging only — no CloudWatch metric is published for skipped accounts.
              skipped_count = 0

              for account in accounts:
                  account_id = account["accountId"]
                  account_name = account["accountName"]
                  cost = cost_map.get(account_id, {})
                  cfg = config_map.get(account_id, {})
                  iam = iam_map.get(account_id, {})
                  ac = api_call_map.get(account_id, {})

                  # State-Machine-level failure shape: when a per-account Map iteration fails,
                  # the Catch+Pass states emit {failed: true, errors: [...]} so this Lambda can
                  # see the failure and treat the account as "collection failed" rather than
                  # publishing zero-valued signals that would look like dormancy.
                  iam_failed = bool(iam.get("failed"))
                  api_failed = bool(ac.get("failed"))
                  account_failed = iam_failed or api_failed

                  failed_signals = (failed_signals_of(iam, IAM_SIGNALS) | failed_signals_of(ac, ("apiCalls",))
                                    | lambda_failed_signals)
                  has_per_account_errors = bool((iam.get("errors") or []) + (ac.get("errors") or []) or failed_signals)

                  if not lambda_errors:
                      if account_failed or has_per_account_errors:
                          failed_count += 1
                          log("WARNING", "per_account_collection_failed",
                              "Per-account collection failed or incomplete",
                              accountId=account_id, accountName=account_name,
                              iamFailed=iam_failed,
                              apiCallFailed=api_failed,
                              iamErrors=iam.get("errors") or [],
                              apiCallErrors=ac.get("errors") or [],
                              failedSignals=sorted(failed_signals))
                      else:
                          published_count += 1

                  # Hard-failure accounts (a per-account Map iteration threw and was caught by
                  # the State Machine): publish ONLY the CollectionFailed=1 datapoint and skip
                  # raw signal/dormancy metrics. Skipping prevents two false signals:
                  #   - zero-valued signals being interpreted as dormancy by alarms/dashboard
                  #   - DormancyScore=0 making a collection failure indistinguishable from a
                  #     truly dormant account
                  ts = collection_timestamp
                  if account_failed:
                      all_metric_data.append(make_account_datum(
                          "CollectionFailed", 1, account_id, account_name, "Count", ts))
                      continue

                  api_call_count = ac.get("apiCallCount", 0)
                  active_iam_user_count = iam.get("activeIAMUserCount", 0)
                  active_iam_role_count = iam.get("activeIAMRoleCount", 0)
                  active_sso_user_count = iam.get("activeSSOUserCount", 0)
                  # activeAdminSSOUserCount: present when AdminSSOPrefixes is configured (default 0).
                  # Admin/maintenance SSO roles are tracked separately and excluded from dormancy scoring.
                  active_admin_sso_user_count = iam.get("activeAdminSSOUserCount", 0)
                  total_resource_count = cfg.get("totalResourceCount", 0)
                  resource_created_count = cfg.get("resourceCreatedCount", 0)
                  monthly_cost_usd = cost.get("monthlyCostUSD", 0.0)

                  # CollectionFailed per-account datapoint. This MUST agree with what the
                  # AccountsFailed SFN metric (and the CollectionFailureAlarm/notification) counts
                  # as a failure — otherwise an account can trigger a failure notification while
                  # the "CollectionFailed per Account" widget still shows it as successful.
                  #
                  # Soft/partial errors: a collector Lambda caught an internal exception and
                  # returned normally with a populated `errors` array (so no Map "failed" flag was
                  # set and account_failed is False). These accounts are already counted in
                  # AccountsFailed via has_per_account_errors, so publish CollectionFailed=1 here
                  # too. Unlike hard failures, we still publish the raw signals that WERE collected
                  # (partial data is useful and any sub-signal that failed defaulted to 0 already).
                  # Fully successful runs publish CollectionFailed=0 so the dashboard line for the
                  # account stays continuous and alarms can rely on the metric being present per run.
                  collection_failed_value = 1 if (has_per_account_errors or lambda_errors) else 0
                  all_metric_data.append(make_account_datum(
                      "CollectionFailed", collection_failed_value, account_id, account_name, "Count", ts))

                  # Raw signals; a signal the collector couldn't collect this run is left as a gap.
                  raw_signals = [
                      ("apiCalls", "ApiCallCount", api_call_count, "Count"),
                      ("iamUsers", "ActiveIAMUserCount", active_iam_user_count, "Count"),
                      ("iamRoles", "ActiveIAMRoleCount", active_iam_role_count, "Count"),
                      ("sso", "ActiveSSOUserCount", active_sso_user_count, "Count"),
                      ("totalResources", "TotalResourceCount", total_resource_count, "Count"),
                      ("resourceCreated", "ResourceCreatedCount", resource_created_count, "Count"),
                      ("cost", "MonthlyCostUSD", monthly_cost_usd, "None"),
                  ]
                  for signal, metric_name, value, unit in raw_signals:
                      if signal not in failed_signals:
                          all_metric_data.append(make_account_datum(metric_name, value, account_id, account_name, unit, ts))
                  # Publish ActiveAdminSSOUserCount only when admin prefixes are configured.
                  # When AdminSSOPrefixes is empty, active_admin_sso_user_count is always 0
                  # so we only write the metric when it carries meaningful signal.
                  admin_sso_prefixes_raw = config.get("adminSSOPrefixes") or os.environ.get("ADMIN_SSO_PREFIXES", "")
                  if admin_sso_prefixes_raw.strip() and "sso" not in failed_signals:
                      all_metric_data.append(make_account_datum("ActiveAdminSSOUserCount", active_admin_sso_user_count, account_id, account_name, "Count", ts))

                  # New-account grace period: skip dormancy SCORING (not raw signals) for accounts
                  # whose AWS Organizations join date is within the grace window. The raw signal
                  # metrics and CollectionFailed=0 were already published above, so the dashboard
                  # raw-signal widgets stay populated; here we suppress DormancyScore/DormancyRating
                  # and exclude the account from the CRITICAL/HIGH alert totals to avoid false
                  # dormancy alerts on freshly-onboarded accounts. grace_period_days == 0 disables
                  # the feature; an unknown JoinedTimestamp evaluates normally (handled in the helper).
                  if grace_period_days > 0 and is_within_grace_period(
                          account.get("joinedTimestamp"), grace_period_days, now,
                          account_id, account_name):
                      skipped_count += 1
                      log("INFO", "dormancy_scoring_skipped_new_account",
                          "Account within new-account grace period — dormancy scoring skipped",
                          accountId=account_id, accountName=account_name,
                          joinedTimestamp=account.get("joinedTimestamp"),
                          gracePeriodDays=grace_period_days)
                      continue

                  # A missing presence signal (SSO or IAM user sign-ins) would read as no human activity,
                  # which can drop the account by up to 35 points and send a false dormancy email. Skip
                  # scoring this run instead; CollectionFailed=1 and the AccountsFailed alarm report it.
                  if failed_signals & PRESENCE_SIGNALS:
                      log("WARNING", "dormancy_scoring_skipped_incomplete",
                          "Presence signal not collected this run - dormancy scoring skipped",
                          accountId=account_id, accountName=account_name,
                          failedSignals=sorted(failed_signals))
                      continue

                  # Hybrid self-baselining dormancy score:
                  #   - absolute human-presence flags from this run's collected values
                  #   - self-relative trend ratios from the account's own daily metric history
                  #     (single batched GetMetricData call for all four trend signals, across every
                  #     name the account has had)
                  presence = {
                      "ssoPresence": active_sso_user_count > 0,
                      "iamUserPresence": active_iam_user_count > 0,
                  }
                  histories, signal_fetch_failed = fetch_signal_histories(
                      account_id, account_names.get(account_id, [account_name[:256]]),
                      metrics_namespace, lookback_days)
                  # On a hard fetch failure, force every trend to the neutral 1.0 ratio regardless of
                  # any partial page that accumulated before the error — so a fetch failure can never
                  # lower a score (let alone flag an account), making the never-flag-on-failure
                  # contract hold unconditionally. Genuine cold-start uses the same neutral default
                  # inside trend_ratio().
                  trend_ratios = {
                      key: (1.0 if signal_fetch_failed or TREND_SIGNAL_SOURCE[key] in failed_signals
                            else trend_ratio(histories[key], trend_n))
                      for key in TREND_SIGNAL_METRICS
                  }
                  dormancy_score, score_breakdown = calculate_dormancy_score(
                      presence, trend_ratios, weights)
                  dormancy_rating = get_dormancy_rating(dormancy_score, rating_bands)

                  log("INFO", "dormancy_score",
                      "Dormancy score calculated (hybrid self-baselining model)",
                      accountId=account_id, accountName=account_name,
                      dormancyScore=dormancy_score,
                      dormancyRating=dormancy_rating,
                      dormancyRatingLabel=RATING_LABEL[dormancy_rating],
                      scoreBreakdown=score_breakdown,
                      # Distinguishes a hard GetMetricData failure (trends defaulted to neutral 1.0
                      # for lack of data) from a genuine cold-start. Log-only signal: no per-account
                      # metric is published (dropped per the metric-cost decision).
                      signalHistoryFetchFailed=signal_fetch_failed,
                      # Trend signals scored neutral because they weren't collected this run.
                      neutralTrendSignals=sorted(key for key, signal in TREND_SIGNAL_SOURCE.items()
                                                 if signal in failed_signals),
                      trendWindowDays=trend_n,
                      apiCallCount=api_call_count,
                      activeIAMUserCount=active_iam_user_count,
                      activeIAMRoleCount=active_iam_role_count,
                      activeSSOUserCount=active_sso_user_count,
                      totalResourceCount=total_resource_count,
                      resourceCreatedCount=resource_created_count,
                      monthlyCostUSD=round(monthly_cost_usd, 4))

                  all_metric_data.append(make_account_datum("DormancyScore", dormancy_score, account_id, account_name, "None", ts))
                  all_metric_data.append(make_account_datum("DormancyRating", dormancy_rating, account_id, account_name, "None", ts))

                  if dormancy_rating == 1: critical_dormancy_count += 1
                  elif dormancy_rating == 2: high_dormancy_count += 1

                  if dormancy_rating in ALERT_RATINGS:
                      flagged.append({
                          "accountId": account_id,
                          "accountName": account_name,
                          "rating": dormancy_rating,
                          "score": dormancy_score,
                      })

              # New-account grace period summary (log-only; no metric is published for skips).
              if skipped_count:
                  log("INFO", "dormancy_skip_summary",
                      "New-account grace period excluded one or more accounts from dormancy scoring",
                      skippedCount=skipped_count,
                      gracePeriodDays=grace_period_days,
                      accountCount=len(accounts))

              # Publish account metrics
              try:
                  publish_metric_data(metrics_namespace, all_metric_data)
                  log("INFO", "account_metrics_published",
                      "Account metrics published to CloudWatch",
                      datapointCount=len(all_metric_data), accountCount=len(accounts))
              except Exception as e:
                  log("ERROR", "account_metrics_publish_failed",
                      "Failed to publish account metrics", error=str(e))
                  failed_count = len(accounts)
                  published_count = 0

              # Publish alert metrics (dimensionless)
              try:
                  alert_data = [
                      make_alert_datum("CriticalDormancyAccountCount", critical_dormancy_count, collection_timestamp),
                      make_alert_datum("HighDormancyAccountCount", high_dormancy_count, collection_timestamp),
                  ]
                  publish_metric_data(alert_namespace, alert_data)
                  log("INFO", "alert_metrics_published",
                      "Alert metrics published",
                      criticalDormancyCount=critical_dormancy_count,
                      highDormancyCount=high_dormancy_count)
              except Exception as e:
                  log("ERROR", "alert_metrics_publish_failed",
                      "Failed to publish alert metrics", error=str(e))

              # Publish SFN execution metrics
              duration_seconds = (now - execution_start).total_seconds()
              has_error = failed_count > 0
              try:
                  sfn_data = [
                      make_sfn_datum("ExecutionDurationSeconds", duration_seconds, "Seconds", now),
                      make_sfn_datum("AccountsProcessed", published_count, "Count", now),
                      make_sfn_datum("AccountsFailed", failed_count, "Count", now),
                      make_sfn_datum("MetricCollectionSuccess", 0 if has_error else 1, "Count", now),
                      make_sfn_datum("MetricCollectionFailure", 1 if has_error else 0, "Count", now),
                  ]
                  publish_metric_data(sfn_namespace, sfn_data)
                  log("INFO", "sfn_metrics_published",
                      "Step Functions execution metrics published",
                      durationSeconds=round(duration_seconds, 1),
                      accountsProcessed=published_count,
                      accountsFailed=failed_count,
                      accountsSkipped=skipped_count,
                      status="FAILURE" if has_error else "SUCCESS")
              except Exception as e:
                  log("ERROR", "sfn_metrics_publish_failed",
                      "Failed to publish SFN metrics", error=str(e))

              # ── Change-based dormancy notification ─────────────────────────────────────
              # Sent from here rather than as a CloudWatch alarm action because an alarm invokes its
              # action only on a state TRANSITION. Once the "N accounts are dormant" count alarm is
              # in ALARM it stays there, so an account crossing into CRITICAL/HIGH while the alarm
              # was already latched produced no notification at all. This path notifies on CHANGE
              # instead of on STATE. The count alarms remain as the standing "how many are dormant
              # right now" signal for the console and the dashboard widgets.
              #
              # Deliberately placed AFTER every metric publish above: publish_notification raises on
              # failure, and putting it last means a raise cannot cost the run its own telemetry.
              if notifications_enabled:
                  if prior_fetch_failed and flagged:
                      # Fail loudly rather than silently sending nothing. Suppressing here would
                      # lose these crossings for good, because the next run would read this run's
                      # already in-band ratings as its prior and find nothing new.
                      raise RuntimeError(
                          "Prior DormancyRating history unavailable (%d account(s) currently "
                          "CRITICAL/HIGH) - cannot determine which accounts newly crossed, so no "
                          "notification was sent" % len(flagged))
                  newly, already = select_newly_flagged(flagged, prior_ratings)
                  if newly:
                      publish_notification(newly, already, topic_arns, lookback_days,
                                           os.environ.get("AWS_REGION", ""),
                                           os.environ.get("DASHBOARD_NAME", ""), now)
                  elif flagged and not prior_ratings:
                      # First run against a namespace with no rating history: by design nothing is
                      # "new", so this is a log line and never an email. Without this rule a fresh
                      # deployment would mail every already-dormant account at once.
                      log("INFO", "notification_baseline_established",
                          "No prior DormancyRating history - baseline recorded, no notification sent",
                          flaggedCount=len(flagged))
                  else:
                      log("INFO", "notification_not_needed",
                          "No account newly crossed into CRITICAL/HIGH this run",
                          flaggedCount=len(flagged), alreadyFlaggedCount=len(already))
              else:
                  log("INFO", "notifications_disabled",
                      "Dormancy notifications disabled (no SNS topic ARNs configured)",
                      flaggedCount=len(flagged))

              if failed_count == 0:
                  status = "SUCCESS"
              elif failed_count == len(accounts):
                  status = "FAILURE"
              else:
                  status = "PARTIAL_FAILURE"

              return {
                  "publishedCount": published_count,
                  "failedCount": failed_count,
                  "collectionTimestamp": collection_timestamp_str,
                  "status": status,
              }
      Environment:
        Variables:
          METRICS_NAMESPACE: !Ref MetricsNamespace
          SFN_METRICS_NAMESPACE: !Ref SfnMetricsNamespace
          SFN_ALERT_NAMESPACE: !Ref SfnAlertNamespace
          DASHBOARD_NAME: !Ref DashboardName
          # Hybrid self-baselining score weights — read from config dict (set by GetAccounts)
          # with env var fallback.
          DORMANCY_WEIGHT_SSO_PRESENCE: !Sub "${DormancyWeightSSOPresence}"
          DORMANCY_WEIGHT_IAM_USER_PRESENCE: !Sub "${DormancyWeightIAMUserPresence}"
          DORMANCY_WEIGHT_API_CALL_TREND: !Sub "${DormancyWeightApiCallTrend}"
          DORMANCY_WEIGHT_IAM_ROLE_TREND: !Sub "${DormancyWeightIAMRoleTrend}"
          DORMANCY_WEIGHT_COST_TREND: !Sub "${DormancyWeightCostTrend}"
          DORMANCY_WEIGHT_RESOURCE_CREATED_TREND: !Sub "${DormancyWeightResourceCreatedTrend}"
          # Lookback & trend parameters — read from config dict (set by GetAccounts) with env var fallback
          LOOKBACK_DAYS: !Sub "${LookbackDays}"
          # New-account grace period (days) — read from config dict (set by GetAccounts) with env var fallback.
          # PublishMetrics skips dormancy scoring for accounts whose JoinedTimestamp is within this window. 0 disables.
          NEW_ACCOUNT_GRACE_PERIOD_DAYS: !Sub "${NewAccountGracePeriodDays}"
          # Self-relative trend comparison window fraction — read from config dict with env var fallback
          TREND_WINDOW_FRACTION: !Sub "${TrendWindowFraction}"
          # Dormancy rating band upper bounds — read from config dict with env var fallback
          CRITICAL_DORMANCY_MAX_SCORE: !Sub "${CriticalDormancyMaxScore}"
          HIGH_DORMANCY_MAX_SCORE: !Sub "${HighDormancyMaxScore}"
          MEDIUM_DORMANCY_MAX_SCORE: !Sub "${MediumDormancyMaxScore}"
          LOW_DORMANCY_MAX_SCORE: !Sub "${LowDormancyMaxScore}"
          # ADMIN_SSO_PREFIXES: allows PublishMetrics to conditionally publish ActiveAdminSSOUserCount metric
          ADMIN_SSO_PREFIXES: !Ref AdminSSOPrefixes
          # Change-based dormancy notification. Both ARNs resolve to "" when CreateAlarms is false
          # (there are no topics to name), and the Lambda treats empty ARNs as "notifications
          # disabled" — so the feature follows EnableDormancyAlarms + NotificationEmail without
          # needing a flag of its own. No circular dependency is introduced: the topics do not
          # depend on this function, its role, or its policy.
          CRITICAL_TOPIC_ARN: !If [CreateAlarms, !Ref CriticalDormancyTopic, ""]
          HIGH_TOPIC_ARN: !If [CreateAlarms, !Ref HighDormancyTopic, ""]
          # Lookback window for each account's PREVIOUS rating in the newly-crossed comparison.
          PRIOR_RATING_WINDOW_DAYS: !Sub "${PriorRatingWindowDays}"
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  # ── Step Functions Execution Role ──────────────────────────────────────────
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >
              Explicit role name required for consistency with the solution naming scheme.
              The state machine RoleArn property references this role via !GetAtt — a fixed
              name ensures the ARN is predictable for auditing and change tracking.
      cdk_nag:
        rules_to_suppress:
          - id: "AwsSolutions-IAM4"
            reason: >
              All permissions are fully custom customer managed policies. No AWS managed
              policies are attached. cdk-nag IAM4 fires incorrectly on raw CloudFormation
              YAML without CDK constructs.
          - id: "AwsSolutions-IAM5"
            reason: >
              CloudWatch Logs delivery actions required for Step Functions execution logging
              do not support resource-level permissions per AWS Service Authorization Reference.
              Lambda function ARNs are explicitly listed. See StepFunctionsManagedPolicy
              cfn_nag W13 for detailed justification.
    Properties:
      RoleName: DormantAccountDetection-StepFunctions-Role
      Description: Execution role for the DormantAccountDetection Step Functions state machine.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
            # aws:SourceAccount prevents confused deputy attacks from other accounts' Step Functions
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref StepFunctionsManagedPolicy
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  # ── Step Functions State Machine ───────────────────────────────────────────
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn: [StepFunctionsRole, LogGroupStepFunctions]
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: "AwsSolutions-SF2"
            reason: >
              X-Ray tracing is intentionally disabled (TracingConfiguration: Enabled: false).
              This is a scheduled batch monitoring solution (daily 2:00 AM UTC) with built-in
              Retry/Catch error handling at every state. X-Ray adds cost with no operational
              benefit for non-latency-sensitive background jobs. Full execution visibility is
              provided via CloudWatch Logs at Level: ALL and custom Step Functions metrics.
    Properties:
      StateMachineName: DormantAccountDetection-MetricCollection
      EncryptionConfiguration: !If
        - SfnUseCmk
        - Type: CUSTOMER_MANAGED_KMS_KEY
          KmsKeyId: !If
            - CreateLogGroupKmsKey
            - !GetAtt LogGroupKmsKey.Arn
            - !Ref LogGroupKmsKeyArn
          KmsDataKeyReusePeriodSeconds: !Ref StateMachineKmsDataKeyReusePeriodSeconds
        - Type: AWS_OWNED_KEY
      TracingConfiguration:
        Enabled: false  # X-Ray disabled: scheduled batch job with SFN Retry/Catch; no latency-sensitive paths requiring distributed tracing. Suppressed: AwsSolutions-SF2
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt LogGroupStepFunctions.Arn
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Collects account activity metrics (API calls via CloudWatch AWS/Usage, IAM activity, Config resources, cost) and publishes to CloudWatch. Both Map branches run at MaxConcurrency=${MapConcurrency}.",
          "TimeoutSeconds": 10800,
          "StartAt": "GetAccounts",
          "States": {
            "GetAccounts": {
              "Type": "Task",
              "Comment": "Resolve target accounts. Lambda reads config from env vars — input can be {}.",
              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${GetAccountsFn.Arn}",
                "Payload": {}
              },
              "ResultSelector": {
                "accounts.$": "$.Payload.accounts",
                "config.$": "$.Payload.config",
                "collectionTimestamp.$": "$.Payload.collectionTimestamp"
              },
              "ResultPath": "$",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                  "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                },
                {
                  "ErrorEquals": ["States.TaskFailed","Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "GetAccountsFailed"
                }
              ],
              "Next": "WrapForParallel"
            },
            "WrapForParallel": {
              "Type": "Pass",
              "Comment": "Propagate accounts/config/collectionTimestamp into parallel branches",
              "Parameters": {
                "accounts.$": "$.accounts",
                "config.$": "$.config",
                "collectionTimestamp.$": "$.collectionTimestamp"
              },
              "Next": "ParallelMetricCollection"
            },
            "ParallelMetricCollection": {
              "Type": "Parallel",
              "Comment": "Run Cost, Config, IAM, and ApiCallMetrics collection concurrently",
              "Next": "PublishMetrics",
              "Branches": [
                {
                  "StartAt": "PrepareCostInput",
                  "States": {
                    "PrepareCostInput": {
                      "Type": "Pass",
                      "Parameters": {
                        "accounts.$": "$.accounts",
                        "config.$": "$.config",
                        "collectionTimestamp.$": "$.collectionTimestamp"
                      },
                      "Next": "CollectCostMetrics"
                    },
                    "CollectCostMetrics": {
                      "Type": "Task",
                      "Comment": "Fetch monthly cost for all accounts (single Cost Explorer call).",
                      "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${CollectCostFn.Arn}",
                        "Payload": {
                          "accounts.$": "$.accounts",
                          "config.$": "$.config",
                          "collectionTimestamp.$": "$.collectionTimestamp"
                        }
                      },
                      "ResultSelector": {
                        "metrics.$": "$.Payload.metrics",
                        "collectionTimestamp.$": "$.Payload.collectionTimestamp",
                        "errors.$": "$.Payload.errors",
                        "failedSignals.$": "$.Payload.failedSignals"
                      },
                      "Retry": [
                        {
                          "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                          "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                        },
                        {
                          "ErrorEquals": ["States.TaskFailed","Lambda.ServiceException","Lambda.TooManyRequestsException"],
                          "IntervalSeconds": 15, "MaxAttempts": 3, "BackoffRate": 2
                        }
                      ],
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "PrepareConfigInput",
                  "States": {
                    "PrepareConfigInput": {
                      "Type": "Pass",
                      "Parameters": {
                        "accounts.$": "$.accounts",
                        "config.$": "$.config",
                        "collectionTimestamp.$": "$.collectionTimestamp"
                      },
                      "Next": "CollectConfigMetrics"
                    },
                    "CollectConfigMetrics": {
                      "Type": "Task",
                      "Comment": "Query Config Aggregator for resource counts (single SQL query for all accounts).",
                      "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${CollectConfigFn.Arn}",
                        "Payload": {
                          "accounts.$": "$.accounts",
                          "config.$": "$.config",
                          "collectionTimestamp.$": "$.collectionTimestamp"
                        }
                      },
                      "ResultSelector": {
                        "metrics.$": "$.Payload.metrics",
                        "collectionTimestamp.$": "$.Payload.collectionTimestamp",
                        "errors.$": "$.Payload.errors",
                        "failedSignals.$": "$.Payload.failedSignals"
                      },
                      "Retry": [
                        {
                          "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                          "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                        },
                        {
                          "ErrorEquals": ["States.TaskFailed","Lambda.ServiceException","Lambda.TooManyRequestsException"],
                          "IntervalSeconds": 15, "MaxAttempts": 3, "BackoffRate": 2
                        }
                      ],
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "IAMMap",
                  "States": {
                    "IAMMap": {
                      "Type": "Map",
                      "Comment": "Collect IAM metrics for each target account.",
                      "ItemsPath": "$.accounts",
                      "ItemSelector": {
                        "account.$": "$$.Map.Item.Value",
                        "config.$": "$.config",
                        "collectionTimestamp.$": "$.collectionTimestamp"
                      },
                      "MaxConcurrency": ${MapConcurrency},
                      "ToleratedFailurePercentage": 100,
                      "ResultPath": "$.iamResults",
                      "ItemProcessor": {
                        "ProcessorConfig": { "Mode": "INLINE" },
                        "StartAt": "CollectIAMPerAccount",
                        "States": {
                          "CollectIAMPerAccount": {
                            "Type": "Task",
                            "Comment": "Collect active IAM user, role, and SSO user counts for one account.",
                            "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                            "Parameters": {
                              "FunctionName": "${CollectIAMFn.Arn}",
                              "Payload": {
                                "account.$": "$.account",
                                "config.$": "$.config",
                                "collectionTimestamp.$": "$.collectionTimestamp"
                              }
                            },
                            "ResultSelector": {
                              "accountId.$": "$.Payload.accountId",
                              "accountName.$": "$.Payload.accountName",
                              "activeIAMUserCount.$": "$.Payload.activeIAMUserCount",
                              "activeIAMRoleCount.$": "$.Payload.activeIAMRoleCount",
                              "activeSSOUserCount.$": "$.Payload.activeSSOUserCount",
                              "activeAdminSSOUserCount.$": "$.Payload.activeAdminSSOUserCount",
                              "collectionTimestamp.$": "$.Payload.collectionTimestamp",
                              "errors.$": "$.Payload.errors",
                              "failedSignals.$": "$.Payload.failedSignals"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                                "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                              },
                              {
                                "ErrorEquals": ["Lambda.ServiceException","Lambda.TooManyRequestsException"],
                                "IntervalSeconds": 10, "MaxAttempts": 2, "BackoffRate": 2
                              }
                            ],
                            "Catch": [
                              {
                                "ErrorEquals": ["States.ALL"],
                                "ResultPath": "$.error",
                                "Next": "EmitIAMFailureShape"
                              }
                            ],
                            "End": true
                          },
                          "EmitIAMFailureShape": {
                            "Type": "Pass",
                            "Comment": "Shape an iteration failure into the same dict shape PublishMetrics expects, with failed=true and the error cause. Keeps the Map state running for other accounts and surfaces failures via AccountsFailed metric and CollectionFailed per-account datapoint.",
                            "Parameters": {
                              "accountId.$": "$.account.accountId",
                              "accountName.$": "$.account.accountName",
                              "activeIAMUserCount": 0,
                              "activeIAMRoleCount": 0,
                              "activeSSOUserCount": 0,
                              "activeAdminSSOUserCount": 0,
                              "collectionTimestamp.$": "$.collectionTimestamp",
                              "errors.$": "States.Array(States.JsonToString($.error))",
                              "failed": true
                            },
                            "End": true
                          }
                        }
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "ApiCallMetricsMap",
                  "States": {
                    "ApiCallMetricsMap": {
                      "Type": "Map",
                      "Comment": "Collect API call count metrics for each target account via CloudWatch AWS/Usage.",
                      "ItemsPath": "$.accounts",
                      "ItemSelector": {
                        "account.$": "$$.Map.Item.Value",
                        "config.$": "$.config",
                        "collectionTimestamp.$": "$.collectionTimestamp"
                      },
                      "MaxConcurrency": ${MapConcurrency},
                      "ToleratedFailurePercentage": 100,
                      "ResultPath": "$.apiCallResults",
                      "ItemProcessor": {
                        "ProcessorConfig": { "Mode": "INLINE" },
                        "StartAt": "CollectApiCallMetricsPerAccount",
                        "States": {
                          "CollectApiCallMetricsPerAccount": {
                            "Type": "Task",
                            "Comment": "Count API calls for one account (90-day lookback) via CloudWatch AWS/Usage GetMetricData.",
                            "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                            "Parameters": {
                              "FunctionName": "${CollectApiCallMetricsFn.Arn}",
                              "Payload": {
                                "account.$": "$.account",
                                "config.$": "$.config",
                                "collectionTimestamp.$": "$.collectionTimestamp"
                              }
                            },
                            "ResultSelector": {
                              "accountId.$": "$.Payload.accountId",
                              "accountName.$": "$.Payload.accountName",
                              "apiCallCount.$": "$.Payload.apiCallCount",
                              "collectionTimestamp.$": "$.Payload.collectionTimestamp",
                              "errors.$": "$.Payload.errors",
                              "failedSignals.$": "$.Payload.failedSignals"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                                "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                              },
                              {
                                "ErrorEquals": ["Lambda.ServiceException","Lambda.TooManyRequestsException"],
                                "IntervalSeconds": 10, "MaxAttempts": 2, "BackoffRate": 2
                              }
                            ],
                            "Catch": [
                              {
                                "ErrorEquals": ["States.ALL"],
                                "ResultPath": "$.error",
                                "Next": "EmitApiCallFailureShape"
                              }
                            ],
                            "End": true
                          },
                          "EmitApiCallFailureShape": {
                            "Type": "Pass",
                            "Comment": "Shape an iteration failure into the same dict shape PublishMetrics expects, with failed=true and the error cause.",
                            "Parameters": {
                              "accountId.$": "$.account.accountId",
                              "accountName.$": "$.account.accountName",
                              "apiCallCount": 0,
                              "collectionTimestamp.$": "$.collectionTimestamp",
                              "errors.$": "States.Array(States.JsonToString($.error))",
                              "failed": true
                            },
                            "End": true
                          }
                        }
                      },
                      "End": true
                    }
                  }
                }
              ]
            },
            "PublishMetrics": {
              "Type": "Task",
              "Comment": "Aggregate all collected metrics and publish to CloudWatch.",
              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PublishMetricsFn.Arn}",
                "Payload": {
                  "accounts.$": "$[2].accounts",
                  "config.$": "$[2].config",
                  "collectionTimestamp.$": "$[2].collectionTimestamp",
                  "costMetrics.$": "$[0]",
                  "configMetrics.$": "$[1]",
                  "iamMetrics.$": "$[2].iamResults",
                  "apiCallMetrics.$": "$[3].apiCallResults",
                  "stepFunctionExecutionArn.$": "$$.Execution.Id",
                  "executionStartTime.$": "$$.Execution.StartTime"
                }
              },
              "ResultSelector": {
                "publishedCount.$": "$.Payload.publishedCount",
                "failedCount.$": "$.Payload.failedCount",
                "status.$": "$.Payload.status",
                "collectionTimestamp.$": "$.Payload.collectionTimestamp"
              },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ClientExecutionTimeoutException","Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                  "IntervalSeconds": 2, "MaxAttempts": 6, "BackoffRate": 2
                },
                {
                  "ErrorEquals": ["States.TaskFailed","Lambda.ServiceException"],
                  "IntervalSeconds": 10, "MaxAttempts": 2, "BackoffRate": 2
                }
              ],
              "End": true
            },
            "GetAccountsFailed": {
              "Type": "Fail",
              "Error": "GetAccountsFailed",
              "Cause": "Failed to resolve target accounts from AWS Organizations"
            }
          }
        }
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  # ── EventBridge Role ───────────────────────────────────────────────────────
  EventBridgeRole:
    Type: AWS::IAM::Role
    DependsOn: StateMachine
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >
              Explicit role name required for consistency with the solution naming scheme.
              A fixed name ensures the ARN is predictable for auditing and change tracking.
      cdk_nag:
        rules_to_suppress:
          - id: "AwsSolutions-IAM4"
            reason: >
              All permissions are fully custom customer managed policies. No AWS managed
              policies are attached. cdk-nag IAM4 fires incorrectly on raw CloudFormation
              YAML without CDK constructs.
          - id: "AwsSolutions-IAM5"
            reason: >
              states:StartExecution is scoped to the specific state machine ARN via !Ref StateMachine.
              This is NOT a wildcard — cdk-nag cannot resolve !Ref in raw CloudFormation YAML
              outside a CDK context, causing a false positive finding.
    Properties:
      RoleName: DormantAccountDetection-EventBridge-Role
      Description: Allows EventBridge to start the DormantAccountDetection Step Functions execution.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EventBridgeManagedPolicy
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  # ── EventBridge Scheduled Rule ─────────────────────────────────────────────
  DailyTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: DormantAccountDetection-DailyTrigger
      Description: Triggers DormantAccountDetection metric collection daily at 2:00 AM UTC.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: StateMachineTarget
          Arn: !Ref StateMachine
          RoleArn: !GetAtt EventBridgeRole.Arn
          Input: '{"source":"scheduled"}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 7200
            MaximumRetryAttempts: 2

  # ── KMS Key for SNS Topic Encryption ──────────────────────────────────────────
  SnsKmsKey:
    Type: AWS::KMS::Key
    Condition: CreateSnsKmsKey
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: "AwsSolutions-KMS5"
            reason: >
              FALSE POSITIVE: EnableKeyRotation is explicitly set to true and
              RotationPeriodInDays is configured via the KmsKeyRotationPeriodDays parameter.
              cdk-nag cannot resolve nested !And CloudFormation conditions (CreateSnsKmsKey)
              when scanning raw YAML outside a CDK app context. Key rotation IS enabled.
    Properties:
      Description: >
        AWS KMS customer managed key for encrypting DormantAccountDetection Amazon SNS topics.
        Grants the SNS service principal permission to encrypt and decrypt topic messages.
      EnableKeyRotation: true
      RotationPeriodInDays: !Ref KmsKeyRotationPeriodDays
      MultiRegion: false
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Key administrators statement (MF-6). Delegates key management to IAM in this
          # account, so only principals whose IAM policies allow these actions can manage
          # the key. Management only: no cryptographic operations. kms:Put* (PutKeyPolicy)
          # is kept so the policy stays updatable and passes the AWS KMS lockout safety check.
          # Action list follows the AWS KMS default key administrators statement:
          # https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
          - Sid: AllowKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:RotateKeyOnDemand
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
          # Key users statement (MF-6). Delegates cryptographic use to IAM in this account,
          # limited to callers from this account. The solution's roles get use rights only
          # through their customer managed IAM policies, each scoped to this key's ARN.
          - Sid: AllowKeyUsage
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
          # Allow SNS to use the key for topic encryption/decryption.
          # aws:SourceAccount condition prevents cross-account confused deputy attacks.
          - Sid: AllowSnsEncryption
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
              - kms:Encrypt
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          # Allow CloudWatch Alarms to generate/decrypt the data key when publishing
          # alarm notifications to the KMS-encrypted SNS topics. Without this statement
          # the alarm action fails with "CloudWatch Alarms does not have authorization
          # to access the SNS topic encryption key." (the SNS service principal alone is
          # insufficient — CloudWatch performs the encrypt operation under its own principal).
          # aws:SourceAccount prevents cross-account confused-deputy use of the key.
          - Sid: AllowCloudWatchAlarmsEncryption
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  SnsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateSnsKmsKey
    Properties:
      AliasName: alias/DormantAccountDetection-SnsKey
      TargetKeyId: !Ref SnsKmsKey

  # ── SNS Topics & Subscriptions ─────────────────────────────────────────────
  CriticalDormancyTopic:
    Type: AWS::SNS::Topic
    Condition: CreateAlarms
    Properties:
      TopicName: DormantAccountDetection-CriticalDormancyAlert
      DisplayName: "Dormant Account Detection — CRITICAL Dormancy Alert"
      KmsMasterKeyId: !If
        - SnsUseCmk
        - !If
          - CreateSnsKmsKey
          - !GetAtt SnsKmsKey.Arn
          - !Ref SnsKmsKeyArn
        - alias/aws/sns
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  # Enforce SSL-only publishing on CriticalDormancyTopic (AwsSolutions-SNS3)
  CriticalDormancyTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateAlarms
    Properties:
      Topics:
        - !Ref CriticalDormancyTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountPublish
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sns:Publish
            Resource: !Ref CriticalDormancyTopic
          - Sid: AllowCloudWatchAlarmPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CriticalDormancyTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyNonSslPublish
            Effect: Deny
            Principal: "*"
            Action: sns:Publish
            Resource: !Ref CriticalDormancyTopic
            Condition:
              Bool:
                aws:SecureTransport: "false"

  CriticalDormancyEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateAlarms
    Properties:
      TopicArn: !Ref CriticalDormancyTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  HighDormancyTopic:
    Type: AWS::SNS::Topic
    Condition: CreateAlarms
    Properties:
      TopicName: DormantAccountDetection-HighDormancyAlert
      DisplayName: "Dormant Account Detection — HIGH Dormancy Alert"
      KmsMasterKeyId: !If
        - SnsUseCmk
        - !If
          - CreateSnsKmsKey
          - !GetAtt SnsKmsKey.Arn
          - !Ref SnsKmsKeyArn
        - alias/aws/sns
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  # Enforce SSL-only publishing on HighDormancyTopic (AwsSolutions-SNS3)
  HighDormancyTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateAlarms
    Properties:
      Topics:
        - !Ref HighDormancyTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountPublish
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sns:Publish
            Resource: !Ref HighDormancyTopic
          - Sid: AllowCloudWatchAlarmPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref HighDormancyTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyNonSslPublish
            Effect: Deny
            Principal: "*"
            Action: sns:Publish
            Resource: !Ref HighDormancyTopic
            Condition:
              Bool:
                aws:SecureTransport: "false"

  HighDormancyEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateAlarms
    Properties:
      TopicArn: !Ref HighDormancyTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ── CloudWatch Alarms ──────────────────────────────────────────────────────
  CriticalDormancyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateAlarms
    Properties:
      AlarmName: DormantAccountDetection-CriticalDormancyAccounts
      AlarmDescription: !Sub "One or more monitored accounts have a CRITICAL dormancy score (score <= ${CriticalDormancyMaxScore}). These accounts show no measurable activity in ${LookbackDays} days and are strong dormancy candidates."
      # Intentionally ACTIONLESS. Notification now lives in the PublishMetrics Lambda, which
      # notifies on CHANGE (the accounts that newly crossed into a band this run) instead of
      # on STATE. An alarm invokes its action only on a state TRANSITION, so while this alarm
      # sat latched in ALARM a newly-dormant account was never announced at all - the defect
      # this design replaced. The alarm is KEPT, without an action, because it is still the
      # correct standing "how many accounts are dormant right now" signal: it drives the
      # console alarm state and the "Critical Dormancy Alarm Status" dashboard widget, which
      # annotates this alarm's ARN. ActionsEnabled stays true so attaching an action later
      # needs no other change.
      ActionsEnabled: true
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Threshold: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: m1
          Label: Critical Dormancy Accounts
          MetricStat:
            Metric:
              Namespace: !Ref SfnAlertNamespace
              MetricName: CriticalDormancyAccountCount
            Period: 86400
            Stat: Maximum
          ReturnData: true
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  HighDormancyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateAlarms
    Properties:
      AlarmName: DormantAccountDetection-HighDormancyAccounts
      AlarmDescription: !Sub >-
        One or more monitored accounts have a HIGH dormancy score
        (> ${CriticalDormancyMaxScore} and <= ${HighDormancyMaxScore}).
        These accounts show minimal activity and are likely dormant.
      # Intentionally ACTIONLESS. Notification now lives in the PublishMetrics Lambda, which
      # notifies on CHANGE (the accounts that newly crossed into a band this run) instead of
      # on STATE. An alarm invokes its action only on a state TRANSITION, so while this alarm
      # sat latched in ALARM a newly-dormant account was never announced at all - the defect
      # this design replaced. The alarm is KEPT, without an action, because it is still the
      # correct standing "how many accounts are dormant right now" signal: it drives the
      # console alarm state and the "High Dormancy Alarm Status" dashboard widget, which
      # annotates this alarm's ARN. ActionsEnabled stays true so attaching an action later
      # needs no other change.
      ActionsEnabled: true
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Threshold: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: m1
          Label: High Dormancy Accounts
          MetricStat:
            Metric:
              Namespace: !Ref SfnAlertNamespace
              MetricName: HighDormancyAccountCount
            Period: 86400
            Stat: Maximum
          ReturnData: true
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  # ── Visibility alarms (event-driven, schedule-agnostic) ────────────────────
  # The two failure alarms use Period=60s with TreatMissingData=notBreaching: they go
  # to ALARM in the minute a failure datapoint lands and back to OK in the next minute,
  # because no datapoint arrives between runs. An alarm action fires only on a
  # transition, so returning to OK is what lets a failure that repeats on every run, or a
  # new failure in another account, notify again on the next run. The heartbeat alarm
  # covers the opposite case: no run completing at all.

  CollectionFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateCollectionFailureAlarm
    Properties:
      AlarmName: DormantAccountDetection-AccountsFailed
      AlarmDescription: >
        One or more accounts failed during the last metric collection run.
        Triggered immediately when AccountsFailed >= 1 is published by PublishMetrics.
        Common causes: missing cross-account IAM role in target account, AssumeRole
        denied, KMS key policy issue, transient AWS API failure beyond the SFN retry
        budget. Investigate the failed accounts in the Step Functions execution and
        the CollectIAM/CollectApiCallMetrics Lambda logs.
      ActionsEnabled: true
      AlarmActions:
        - !Ref CriticalDormancyTopic
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: m1
          Label: Accounts Failed
          MetricStat:
            Metric:
              Namespace: !Ref SfnMetricsNamespace
              MetricName: AccountsFailed
              Dimensions:
                - Name: StateMachine
                  Value: AccountMetricCollection
            Period: 60
            Stat: Maximum
          ReturnData: true
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  StateMachineFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateStateMachineFailureAlarm
    Properties:
      AlarmName: DormantAccountDetection-StateMachineFailed
      AlarmDescription: >
        The DormantAccountDetection-MetricCollection State Machine ended in
        FAILED, TIMED_OUT, or ABORTED status. Catches uncaught errors that prevent
        PublishMetrics from running — Lambda crash, KMS/IAM misconfiguration, malformed
        Map state, manual abort, or state machine timeout. Schedule-agnostic: this
        alarm fires on the AWS/States ExecutionsFailed/TimedOut/Aborted metrics which
        are emitted by Step Functions itself, independent of execution cadence.
      ActionsEnabled: true
      AlarmActions:
        - !Ref CriticalDormancyTopic
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: failed
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsFailed
              Dimensions:
                - Name: StateMachineArn
                  Value: !Ref StateMachine
            Period: 60
            Stat: Sum
        - Id: timedout
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsTimedOut
              Dimensions:
                - Name: StateMachineArn
                  Value: !Ref StateMachine
            Period: 60
            Stat: Sum
        - Id: aborted
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsAborted
              Dimensions:
                - Name: StateMachineArn
                  Value: !Ref StateMachine
            Period: 60
            Stat: Sum
        - Id: terminal
          Expression: "failed + timedout + aborted"
          Label: Any terminal failure
          ReturnData: true
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  # ── Dormant Accounts Custom Widget (Lambda-backed dashboard table) ─────────
  # A CloudWatch custom widget renders an HTML table of every monitored account whose
  # most recent DormancyScore is at or below the HIGH dormancy threshold
  # (score <= HighDormancyMaxScore), classifying each row as CRITICAL
  # (score <= CriticalDormancyMaxScore) or HIGH. It replaces the previous aggregate
  # "Critical/High Dormancy Account Count" bar widgets, which showed only counts, with a
  # sortable, at-a-glance list of the actual account names and IDs — the readable view for
  # identifying which accounts are dormant across the CRITICAL and HIGH bands.
  #
  # These resources are ALWAYS created (independent of CreateAlarms) so the table is available
  # in metrics-only mode as well. The widget classifies dormancy directly from the per-account
  # DormancyScore metric (published with AccountId/AccountName dimensions by PublishMetrics);
  # it does not query alarm state, so it works whether or not alarms/SNS are configured.
  #
  # SECURITY NOTE: CloudWatch invokes custom-widget Lambdas using the credentials of the IAM
  # principal VIEWING the dashboard (JavaScript is stripped from the returned HTML to prevent
  # privilege escalation). Dashboard viewers must therefore hold lambda:InvokeFunction on this
  # function's ARN (see the DormantAccountsWidgetFunctionArn output). No service resource-based
  # policy is added, which would otherwise broaden invoke access beyond the intended viewers.

  HeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateHeartbeatAlarm
    Properties:
      AlarmName: DormantAccountDetection-CollectionHeartbeat
      AlarmDescription: !Sub >
        No DormantAccountDetection collection run has completed in the last
        ${HeartbeatWindowHours} hours. PublishMetrics publishes ExecutionDurationSeconds at the
        end of every run, so a missing datapoint means the schedule did not run (for example the
        EventBridge rule was disabled) or every run failed before PublishMetrics. Check the
        DormantAccountDetection-DailyTrigger rule and recent state machine executions.
      ActionsEnabled: true
      AlarmActions:
        - !Ref CriticalDormancyTopic
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: !Ref HeartbeatWindowHours
      DatapointsToAlarm: !Ref HeartbeatWindowHours
      Threshold: 1
      # Missing hours count as breaching: the alarm fires only when every hour in the window
      # had no completed run.
      TreatMissingData: breaching
      Metrics:
        - Id: runs
          Label: Completed runs
          MetricStat:
            Metric:
              Namespace: !Ref SfnMetricsNamespace
              MetricName: ExecutionDurationSeconds
              Dimensions:
                - Name: StateMachine
                  Value: AccountMetricCollection
            Period: 3600
            Stat: SampleCount
          ReturnData: true
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  LogGroupDormantAccountsWidget:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/DormantAccountDetection-customWidget-DormantAccounts
      RetentionInDays: !Ref LogGroupRetentionDays
      KmsKeyId: !If
        - LogGroupUseCmk
        - !If
          - CreateLogGroupKmsKey
          - !GetAtt LogGroupKmsKey.Arn
          - !Ref LogGroupKmsKeyArn
        - !Ref AWS::NoValue
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  DormantAccountsWidgetManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: >
              cloudwatch:ListMetrics and cloudwatch:GetMetricData require Resource:* — these
              read-only CloudWatch actions do not support resource-level permissions per the AWS
              Service Authorization Reference. No mutating or cross-account actions are granted.
    Properties:
      ManagedPolicyName: DormantAccountDetection-CustomWidget-Policy
      Description: Allows the Dormant Accounts custom-widget Lambda to read per-account DormancyScore metrics and write CloudWatch Logs. Read-only, no cross-account access.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadDormancyMetrics
            Effect: Allow
            Action:
              - cloudwatch:ListMetrics
              - cloudwatch:GetMetricData
            Resource: "*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-customWidget-DormantAccounts"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-customWidget-DormantAccounts:*"

  DormantAccountsWidgetRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >
              Explicit role name for consistency with the solution naming scheme and to keep the
              Lambda execution role ARN predictable for auditing.
      cdk_nag:
        rules_to_suppress:
          - id: "AwsSolutions-IAM4"
            reason: >
              All permissions are fully custom customer managed policies. No AWS managed policies
              are attached. cdk-nag IAM4 fires incorrectly on raw CloudFormation YAML without CDK.
          - id: "AwsSolutions-IAM5"
            reason: >
              cloudwatch:ListMetrics/GetMetricData require Resource:* (no resource-level support
              per AWS Service Authorization Reference). Logs actions are scoped to this function's
              own log group ARN. See DormantAccountsWidgetManagedPolicy cfn_nag W13.
    Properties:
      RoleName: DormantAccountDetection-CustomWidget-Role
      Description: Execution role for the Dormant Accounts custom-widget Lambda. Reads per-account DormancyScore metrics only. No cross-account AssumeRole, no mutating actions.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref DormantAccountsWidgetManagedPolicy
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }
        - { Key: FunctionScope, Value: CustomWidget }

  DormantAccountsWidgetFn:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_117"
            comment: >
              Lambda calls only the public CloudWatch API endpoint. VPC placement would require
              NAT Gateways or VPC Interface Endpoints adding cost with no security benefit.
          - id: "CKV_AWS_173"
            comment: >
              All environment variables contain non-sensitive operational configuration only:
              metric namespace name, dormancy score thresholds, and a lookback window. No secrets,
              credentials, API keys, or PII are stored in environment variables.
          - id: "CKV_AWS_50"
            comment: >
              X-Ray tracing is intentionally disabled. This is an on-demand, read-only dashboard
              rendering function invoked synchronously by CloudWatch custom widgets. X-Ray adds
              cost with no operational benefit. Health is monitored via CloudWatch Logs.
          # Exception: CKV_AWS_116 (LAM-004 / dead-letter queue)
          # Rule: Lambda functions should configure a dead-letter queue (DLQ) to capture
          #       asynchronous invocation failures.
          # Rationale: CloudWatch custom widgets invoke this function SYNCHRONOUSLY
          #       (RequestResponse). A DLQ only captures failures from ASYNCHRONOUS (Event)
          #       invocations and is therefore not applicable to this invocation path. A failed
          #       render simply shows an error in the widget on the next dashboard refresh; no
          #       state is mutated and no data is lost.
          - id: "CKV_AWS_116"
            comment: >
              Dead-letter queue not applicable. Custom widgets invoke this function synchronously
              (RequestResponse); DLQs only apply to asynchronous invocations. The function is
              read-only and mutates no state.
      cdk_nag:
        rules_to_suppress:
          - id: "AwsSolutions-L2"
            reason: >
              X-Ray tracing is intentionally disabled (TracingConfig: Mode: PassThrough). This is
              an on-demand, read-only widget-rendering function invoked synchronously by CloudWatch
              custom widgets. X-Ray adds cost with no operational benefit. Health is monitored via
              CloudWatch Logs.
    DependsOn: [LogGroupDormantAccountsWidget]
    Properties:
      FunctionName: DormantAccountDetection-customWidget-DormantAccounts
      Description: >
        CloudWatch custom-widget backend. Renders an HTML table of accounts whose latest
        DormancyScore is at or below the HIGH dormancy threshold (CRITICAL + HIGH), sorted
        most-dormant first, for the Dormant Account Detection dashboard.
      Runtime: python3.14
      Handler: index.handler
      MemorySize: !Ref LambdaMemoryMB
      Timeout: 60
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      Role: !GetAtt DormantAccountsWidgetRole.Arn
      TracingConfig:
        Mode: PassThrough  # X-Ray intentionally disabled: on-demand read-only render path. Suppressed: CKV_AWS_50/AwsSolutions-L2
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: /aws/lambda/DormantAccountDetection-customWidget-DormantAccounts
      Code:
        ZipFile: |
          ########################################################################################################
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0
          ########################################################################################################
          """
          Dormant Accounts custom-widget Lambda (Python)

          Invoked SYNCHRONOUSLY by a CloudWatch dashboard custom widget. Returns an HTML table
          listing every monitored account whose most recent DormancyScore (within a configurable
          lookback window) is at or below the HIGH dormancy threshold. Each row is classified as
          CRITICAL (score <= CriticalDormancyMaxScore) or HIGH (score <= HighDormancyMaxScore),
          sorted most-dormant first.

          The per-account DormancyScore metric is published with AccountId and AccountName
          dimensions by PublishMetrics. Accounts inside the new-account grace period have no
          DormancyScore published and are therefore naturally excluded.

          Supports the CloudWatch 'describe' parameter (returns markdown documentation).
          All log output is structured JSON for CloudWatch Logs Insights queries.
          """
          import json
          import logging
          import os
          import html
          import boto3
          from datetime import datetime, timezone, timedelta

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # GetMetricData allows up to 500 MetricDataQueries per request; 400 leaves headroom.
          GET_METRIC_DATA_BATCH = 400

          DOCS = """## Dormant Accounts (CRITICAL & HIGH)
          Lists every monitored account whose most recent **DormancyScore** is at or below the
          HIGH dormancy threshold (`score <= HighDormancyMaxScore`), newest datapoint within the
          configured lookback window. Rows are classified CRITICAL or HIGH and sorted most-dormant
          first. Data source: the per-account `DormancyScore` CloudWatch metric.

          ``` yaml
          echo: <p>Dormant accounts table (CRITICAL & HIGH)</p>
          ```
          """


          def log(level, event, message, **fields):
              """Emit a structured JSON log line via the logging module."""
              record = {"event": event, "message": message}
              record.update(fields)
              getattr(logger, level.lower(), logger.info)(json.dumps(record))


          def _fmt(v):
              """Render a score as an integer when whole, else one decimal place."""
              return str(int(round(v))) if abs(v - round(v)) < 1e-9 else ("%.1f" % v)


          def account_matches(account_name, account_id, filter_str):
              """Case-insensitive account filter for the table, forwarded from the dashboard
              "Account name filter" variable. Supports comma- and ' OR '-separated terms
              (OR semantics), each matched as a substring against the account name and ID.
              Single-token and OR filters behave the same here as in the native chart widgets,
              which use CloudWatch's search grammar; AND/NOT/parentheses apply to the charts only.
              An empty filter matches everything (caller only invokes this when non-empty)."""
              terms = [t.strip().lower()
                       for chunk in filter_str.split(",")
                       for t in chunk.split(" OR ")
                       if t.strip()]
              if not terms:
                  return True
              hay = (account_name + " " + account_id).lower()
              return any(t in hay for t in terms)


          def list_score_accounts(cw, namespace):
              """
              Enumerate every (accountId, accountName) pair that has a DormancyScore metric. A
              renamed account has one pair per name; latest_values() keeps the newest series.
              """
              accounts = []
              seen = set()
              paginator = cw.get_paginator("list_metrics")
              for page in paginator.paginate(Namespace=namespace, MetricName="DormancyScore"):
                  for m in page.get("Metrics", []):
                      dims = {d["Name"]: d["Value"] for d in m.get("Dimensions", [])}
                      acct_id = dims.get("AccountId")
                      pair = (acct_id, dims.get("AccountName", acct_id))
                      if acct_id and pair not in seen:
                          seen.add(pair)
                          accounts.append({"accountId": pair[0], "accountName": pair[1]})
              return accounts


          def latest_values(cw, namespace, metric_name, accounts, start, end):
              """
              Return {accountId: (value, accountName)} for metric_name across the given
              (accountId, accountName) pairs over [start, end]. When an account has several names
              (it was renamed), the pair with the newest daily bucket wins, so the table shows the
              current name and score.

              With Period=86400 each query yields one aggregate per day; ScanBy=TimestampDescending
              puts the most recent daily bucket that has data first, so vals[0] is that bucket's Stat
              aggregate - not necessarily the chronologically latest datapoint inside it. Stat=Minimum
              therefore returns the MOST DORMANT reading of that most recent day, because the dormancy
              score scale inverts (a lower score means more dormant), and over-reporting dormancy is
              the safe direction for a surface an operator acts on. When the collection schedule runs
              once per day (the default cron(0 2 * * ? *)) each bucket holds a single datapoint and
              Minimum equals that datapoint exactly; the statistic only matters on days with more
              than one collection run.

              Any other surface that resolves "the latest DormancyScore/DormancyRating" for an
              account MUST use this same statistic, or the dashboard table and the operator
              notification can disagree about the same account while both claim to show the latest
              value.
              """
              results = {}
              newest = {}
              for i in range(0, len(accounts), GET_METRIC_DATA_BATCH):
                  batch = accounts[i:i + GET_METRIC_DATA_BATCH]
                  index = {}
                  queries = []
                  for n, acct in enumerate(batch):
                      qid = "q%d" % n
                      index[qid] = acct
                      queries.append({
                          "Id": qid,
                          "MetricStat": {
                              "Metric": {
                                  "Namespace": namespace,
                                  "MetricName": metric_name,
                                  "Dimensions": [
                                      {"Name": "AccountId", "Value": acct["accountId"]},
                                      {"Name": "AccountName", "Value": acct["accountName"][:256]},
                                  ],
                              },
                              "Period": 86400,
                              "Stat": "Minimum",
                          },
                          "ReturnData": True,
                      })

                  next_token = None
                  while True:
                      kwargs = {
                          "StartTime": start,
                          "EndTime": end,
                          "ScanBy": "TimestampDescending",
                          "MetricDataQueries": queries,
                      }
                      if next_token:
                          kwargs["NextToken"] = next_token
                      resp = cw.get_metric_data(**kwargs)
                      for r in resp.get("MetricDataResults", []):
                          acct = index.get(r.get("Id"))
                          vals = r.get("Values", [])
                          stamps = r.get("Timestamps", [])
                          if acct is None or not vals or not stamps:
                              continue
                          acct_id = acct["accountId"]
                          # First page of a query holds its newest bucket (TimestampDescending);
                          # later pages for the same pair are older and ignored.
                          key = (acct_id, acct["accountName"])
                          if key in newest:
                              continue
                          newest[key] = stamps[0]
                          current = results.get(acct_id)
                          if current is None or stamps[0] > current[2] or (
                                  stamps[0] == current[2] and vals[0] < current[0]):
                              results[acct_id] = (vals[0], acct["accountName"], stamps[0])
                      next_token = resp.get("NextToken")
                      if not next_token:
                          break
              return {acct_id: (v[0], v[1]) for acct_id, v in results.items()}


          # Scoped CSS for the widget: a full-width, fixed-layout table plus a pure-CSS
          # severity filter. The filter uses the radio ":checked ~ sibling" technique — no
          # JavaScript (CloudWatch strips it) and no Lambda re-invocation on filter changes.
          # The radio inputs are rendered as siblings BEFORE the table so the general-sibling
          # combinator (~) can hide non-matching rows. Filter state resets on dashboard refresh.
          STYLE = (
              "<style>"
              ".daw-wrap{width:100%;box-sizing:border-box;font-size:12px;}"
              ".daw-summary{margin:0 0 8px 0;}"
              ".daw-filter{margin:0 0 8px 0;}"
              ".daw-filter label{display:inline-block;padding:2px 12px;margin-right:6px;"
              "border:1px solid #d5dbdb;border-radius:12px;cursor:pointer;"
              "font-weight:bold;font-size:11px;}"
              "input.daw-r{position:absolute;left:-9999px;}"
              "table.daw{width:100%;table-layout:fixed;border-collapse:collapse;}"
              "table.daw th,table.daw td{padding:4px 8px;overflow:hidden;"
              "text-overflow:ellipsis;white-space:nowrap;}"
              "#daw-all:checked~.daw-filter label[for=daw-all]"
              "{background:#0972d3;color:#fff;border-color:#0972d3;}"
              "#daw-crit:checked~.daw-filter label[for=daw-crit]"
              "{background:#d13212;color:#fff;border-color:#d13212;}"
              "#daw-high:checked~.daw-filter label[for=daw-high]"
              "{background:#ff7f0e;color:#fff;border-color:#ff7f0e;}"
              "#daw-crit:checked~table.daw .daw-row-high{display:none;}"
              "#daw-high:checked~table.daw .daw-row-critical{display:none;}"
              "</style>"
          )


          def render_html(rows, critical_max, high_max, window_days, account_filter=""):
              crit = sum(1 for r in rows if r["severity"] == "CRITICAL")
              high = sum(1 for r in rows if r["severity"] == "HIGH")
              filter_note = (
                  " Filtered by <code>%s</code>." % html.escape(account_filter)
                  if account_filter else ""
              )
              summary = (
                  "<p class=\"daw-summary\">"
                  "<strong>%d</strong> account(s) at or below the HIGH dormancy threshold "
                  "(score &le; %s) &mdash; "
                  "<span style=\"color:#d13212;font-weight:bold\">%d CRITICAL</span>, "
                  "<span style=\"color:#ff7f0e;font-weight:bold\">%d HIGH</span>. "
                  "Latest score within the last %d day(s); most dormant first.%s</p>"
                  % (len(rows), _fmt(high_max), crit, high, window_days, filter_note)
              )
              if not rows:
                  return (
                      "<div class=\"daw-wrap\">" + summary +
                      "<p style=\"color:#1d8102\">No accounts are currently at or below the "
                      "HIGH dormancy threshold (score &le; %s).</p></div>" % _fmt(high_max)
                  )

              parts = ["<div class=\"daw-wrap\">", STYLE]
              # Radio group (only one selected at a time). Must precede the filter labels and
              # the table so the CSS "~" combinator can target them.
              parts.append(
                  "<input class=\"daw-r\" type=\"radio\" name=\"daw-sev\" id=\"daw-all\" checked>"
                  "<input class=\"daw-r\" type=\"radio\" name=\"daw-sev\" id=\"daw-crit\">"
                  "<input class=\"daw-r\" type=\"radio\" name=\"daw-sev\" id=\"daw-high\">"
              )
              parts.append(summary)
              parts.append(
                  "<div class=\"daw-filter\">"
                  "<label for=\"daw-all\">All (%d)</label>"
                  "<label for=\"daw-crit\">Critical (%d)</label>"
                  "<label for=\"daw-high\">High (%d)</label>"
                  "</div>" % (len(rows), crit, high)
              )
              parts.append("<table class=\"daw\">")
              # Fixed column proportions so the table fills the widget width:
              # Severity 14% | Account Name 40% | Account ID 28% | Dormancy Score 18%.
              parts.append(
                  "<colgroup><col style=\"width:14%\"><col style=\"width:40%\">"
                  "<col style=\"width:28%\"><col style=\"width:18%\"></colgroup>"
              )
              parts.append(
                  "<thead><tr><th>Severity</th><th>Account Name</th>"
                  "<th>Account ID</th><th style=\"text-align:right\">Dormancy Score</th>"
                  "</tr></thead>"
              )
              parts.append("<tbody>")
              for r in rows:
                  is_crit = r["severity"] == "CRITICAL"
                  row_cls = "daw-row-critical" if is_crit else "daw-row-high"
                  color = "#d13212" if is_crit else "#ff7f0e"
                  badge = (
                      "<span style=\"background:%s;color:#fff;padding:1px 6px;"
                      "border-radius:3px;font-size:11px;font-weight:bold\">%s</span>"
                      % (color, r["severity"])
                  )
                  name = html.escape(r["accountName"])
                  parts.append(
                      "<tr class=\"%s\"><td>%s</td><td title=\"%s\">%s</td>"
                      "<td><code>%s</code></td>"
                      "<td style=\"text-align:right\">%s</td></tr>"
                      % (row_cls, badge, name, name, html.escape(r["accountId"]), _fmt(r["score"]))
                  )
              parts.append("</tbody></table></div>")
              return "".join(parts)


          def handler(event, context):
              event = event or {}
              # CloudWatch requests widget documentation by passing the 'describe' key.
              if "describe" in event:
                  return DOCS

              namespace = os.environ["METRICS_NAMESPACE"]
              critical_max = float(os.environ.get("CRITICAL_MAX_SCORE", "20"))
              high_max = float(os.environ.get("HIGH_MAX_SCORE", "40"))
              window_days = int(os.environ.get("METRIC_WINDOW_DAYS", "14"))

              # Account filter forwarded from the dashboard "Account name filter" variable via the
              # custom widget "params" object (blank = no filter = all accounts). CloudWatch passes
              # widget params at the top level of the event and also mirrors them under
              # widgetContext.params, so read both for robustness.
              account_filter = (
                  event.get("accountFilter")
                  or (event.get("widgetContext", {}) or {}).get("params", {}).get("accountFilter")
                  or ""
              ).strip()
              # The dashboard variable's default is a single space (which shows all accounts,
              # since a whitespace-only search term is a no-op). If the filter box is left truly
              # empty, CloudWatch skips substitution and the literal placeholder token reaches us
              # unchanged. In both cases treat it as "no filter" so the table shows every account
              # rather than filtering on (or displaying) the raw placeholder string.
              if account_filter == "__ACCTFILTER__":
                  account_filter = ""

              cw = boto3.client("cloudwatch")
              end = datetime.now(timezone.utc)
              start = end - timedelta(days=window_days)

              series = list_score_accounts(cw, namespace)
              latest = latest_values(cw, namespace, "DormancyScore", series, start, end)
              # One entry per account, under its current (newest) name.
              accounts = [{"accountId": acct_id, "accountName": name}
                          for acct_id, (_, name) in latest.items()]
              total_accounts = len({s["accountId"] for s in series})
              if account_filter:
                  accounts = [a for a in accounts
                              if account_matches(a["accountName"], a["accountId"], account_filter)]

              rows = []
              for a in accounts:
                  score = latest[a["accountId"]][0]
                  if score > high_max:
                      continue
                  rows.append({
                      "accountId": a["accountId"],
                      "accountName": a["accountName"],
                      "score": score,
                      "severity": "CRITICAL" if score <= critical_max else "HIGH",
                  })
              # Most dormant first (lowest score).
              rows.sort(key=lambda r: r["score"])

              log("INFO", "rendered", "Dormant accounts widget rendered",
                  totalAccounts=total_accounts, matchedAccounts=len(accounts),
                  dormantCount=len(rows), accountFilter=account_filter,
                  criticalMax=critical_max, highMax=high_max, windowDays=window_days)

              return render_html(rows, critical_max, high_max, window_days, account_filter)
      Environment:
        Variables:
          METRICS_NAMESPACE: !Ref MetricsNamespace
          CRITICAL_MAX_SCORE: !Sub "${CriticalDormancyMaxScore}"
          HIGH_MAX_SCORE: !Sub "${HighDormancyMaxScore}"
          METRIC_WINDOW_DAYS: !Sub "${DormantAccountsWidgetMetricWindowDays}"
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

