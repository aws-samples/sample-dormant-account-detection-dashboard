      Handler: index.handler
      MemorySize: !Ref LambdaMemoryMB
      Timeout: 300
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      Role: !GetAtt PublishMetricsRole.Arn
      TracingConfig:
        Mode: PassThrough  # X-Ray intentionally disabled: scheduled batch job with SFN Retry/Catch error handling. Suppressed: CKV_AWS_50/AwsSolutions-L2
      LoggingConfig:
