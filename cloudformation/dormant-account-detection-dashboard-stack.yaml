            comment: >
              False positive: The pagination parameter assigned in the Cost Explorer loop is a
              standard AWS API token returned from the previous get_cost_and_usage response.
              It is a runtime API response value, not a hardcoded secret or credential.
              The check triggers on the dictionary key name matching secret keyword patterns.
              Also suppressed with pragma allowlist secret on the source line.
