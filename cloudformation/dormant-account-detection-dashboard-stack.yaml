    DependsOn: [LogGroupCollectApiCallMetrics]
    Properties:
      FunctionName: DormantAccountDetection-CollectApiCallMetrics
      Description: >
        Counts API calls per account over LookbackDays with one CloudWatch
        GetMetricData call per Region on the AWS/Usage namespace.
        No CloudTrail pagination or backoff required.
      Runtime: python3.14
      Handler: index.handler
      MemorySize: !Ref LambdaMemoryMB
      Timeout: 300
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      Role: !GetAtt CollectApiCallMetricsRole.Arn
      TracingConfig:
        Mode: PassThrough  # X-Ray intentionally disabled: scheduled batch job with SFN Retry/Catch error handling. Suppressed: CKV_AWS_50/AwsSolutions-L2
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: /aws/lambda/DormantAccountDetection-CollectApiCallMetrics
      Code:
        ZipFile: |
          ########################################################################################################
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0
          ########################################################################################################
          """
          CollectApiCallMetrics Lambda (Python)

          Counts total API calls in a target account over the lookback window using the
          CloudWatch AWS/Usage namespace (pre-aggregated CallCount metrics). Every CallCount
          series is listed with ListMetrics and summed with batched GetMetricData calls, so
          there is no cap on the number of series per Region.

          Multi-Region support: the AWS/Usage CallCount metric is regional — API calls made
          in a Region are only visible in that Region's CloudWatch endpoint, so this Lambda sums
          counts across Regions:
            - TARGET_REGIONS empty ("[]", the default): every Region enabled in the Dashboard
              account. Regions the member account can't use (not enabled, or denied by an SCP)
              are skipped and logged, not counted as failures.
            - TARGET_REGIONS set: that list plus the home Region (AWS_REGION), deduplicated.

          WHY CloudWatch AWS/Usage instead of CloudTrail LookupEvents:
            - LookupEvents: 2 req/sec rate limit → throttling on active accounts
            - AWS/Usage CallCount: no CloudTrail throttling; one ListMetrics pass plus one
              GetMetricData call per 500 series per Region

          All log output is structured JSON for CloudWatch Logs Insights queries.
          """
          import json
          import logging
          import os
          import re
          import boto3
          from datetime import datetime, timezone, timedelta
          from botocore.config import Config as BotoConfig

          # Adaptive client-side rate limiting with more attempts, so API throttling is retried
          # instead of being recorded as a partial collection failure.
          RETRY_CONFIG = BotoConfig(retries={"max_attempts": 10, "mode": "adaptive"})

          LOOKBACK_DAYS = 90

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)


          def log(level, event, message, **fields):
              """Emit a structured JSON log line via the logging module."""
              record = {
                  "event": event,
                  "message": message,
              }
              record.update(fields)
              getattr(logger, level.lower(), logger.info)(json.dumps(record))


          def assume_role(role_arn, session_name, external_id=""):
              sts = boto3.client("sts")
              kwargs = {"RoleArn": role_arn, "RoleSessionName": session_name[:64]}
              if external_id:
                  kwargs["ExternalId"] = external_id
              resp = sts.assume_role(**kwargs)
              creds = resp["Credentials"]
              return {
                  "aws_access_key_id": creds["AccessKeyId"],
                  "aws_secret_access_key": creds["SecretAccessKey"],
                  "aws_session_token": creds["SessionToken"],
              }


          # Error codes CloudWatch returns for a Region the member account can't use: the Region
          # isn't enabled for the account (opt-in Regions) or the session token isn't valid there.
          # An SCP Region-deny guardrail returns AccessDenied with "service control policy" in the
          # message. In all-Regions mode these Regions are skipped instead of reported as failures.
          REGION_UNAVAILABLE_CODES = {
              "UnrecognizedClientException", "InvalidClientTokenId", "AuthFailure", "OptInRequired",
          }
          _ENABLED_REGIONS = None


          def enabled_regions():
              """Regions enabled in this (Dashboard) account, cached for the Lambda container."""
              global _ENABLED_REGIONS
              if _ENABLED_REGIONS is None:
                  ec2 = boto3.client("ec2", region_name=os.environ["AWS_REGION"])
                  resp = ec2.describe_regions(AllRegions=False)
                  _ENABLED_REGIONS = sorted(r["RegionName"] for r in resp.get("Regions", []))
              return _ENABLED_REGIONS


          def resolve_target_regions():
              """
              Return (regions, all_regions_mode).
                - TARGET_REGIONS empty: home Region first, then every Region enabled in the
                  Dashboard account (all_regions_mode=True).
                - TARGET_REGIONS set: that list plus the home Region, deduplicated.
              If the enabled Regions can't be listed, fall back to the home Region and log it.
              """
              home = os.environ["AWS_REGION"]
              raw = os.environ.get("TARGET_REGIONS", "[]")
              try:
                  listed = json.loads(raw) if raw else []
              except (json.JSONDecodeError, TypeError):
                  listed = []
              if listed:
                  return list(dict.fromkeys(list(listed) + [home])), False
              try:
                  return list(dict.fromkeys([home] + enabled_regions())), True
              except Exception as e:
                  log("WARNING", "describe_regions_failed",
                      "Could not list enabled Regions; collecting from the home Region only",
                      error=str(e))
                  return [home], False


          def region_unavailable(err):
              """True when err means the member account can't use this Region at all."""
              error = getattr(err, "response", {}).get("Error", {})
              code = error.get("Code", "")
              if code in REGION_UNAVAILABLE_CODES:
                  return True
              return code.startswith("AccessDenied") and "service control policy" in str(err)


          # Dimension set of the per-API AWS/Usage CallCount series (the same schema the earlier
          # SEARCH expression matched).
          CALLCOUNT_DIMENSIONS = {"Class", "Resource", "Service", "Type"}
          # GetMetricData accepts at most 500 MetricDataQuery entries per request.
          METRIC_QUERY_BATCH = 500


          def list_api_callcount_metrics(cw_client):
              """
              Every AWS/Usage CallCount metric with Type=API in this Region, from paginated
              ListMetrics. A SEARCH expression returns at most 500 series, which undercounted
              accounts that call many APIs; ListMetrics has no such cap. Both list only series
              with data in the past two weeks.
              """
              metrics = []
              paginator = cw_client.get_paginator("list_metrics")
              for page in paginator.paginate(Namespace="AWS/Usage", MetricName="CallCount",
                                             Dimensions=[{"Name": "Type", "Value": "API"}]):
                  for metric in page.get("Metrics", []):
                      names = {d["Name"] for d in metric.get("Dimensions", [])}
                      if names == CALLCOUNT_DIMENSIONS:
                          metrics.append(metric)
              return metrics


          def get_api_call_count_for_region(cw_client, start_time, end_time, lookback_days):
              """
              Count all API calls across all services in the account for a single Region endpoint:
              list every CallCount series, then sum them with batched GetMetricData calls.

              The period is set to the full lookback window (lookback_days * 86400 seconds) so
              that CloudWatch returns a SINGLE aggregated data point per series covering the
              entire window rather than one data point per day. Using daily buckets (86400 s)
              and summing them in Python produces a rolling-window artefact: each day the oldest
              bucket drops out and the newest is added, causing the published value to fluctuate
              on the dashboard even when the underlying API activity is stable.

              Returns (count, series_count).
              """
              lookback_seconds = lookback_days * 86400
              metrics = list_api_callcount_metrics(cw_client)
              region_count = 0
              for i in range(0, len(metrics), METRIC_QUERY_BATCH):
                  batch = metrics[i:i + METRIC_QUERY_BATCH]
                  queries = [{
                      "Id": "c%d" % n,
                      "MetricStat": {"Metric": metric, "Period": lookback_seconds, "Stat": "Sum"},
                      "ReturnData": True,
                  } for n, metric in enumerate(batch)]
                  next_token = None
                  while True:
                      kwargs = {
                          "StartTime": start_time,
                          "EndTime": end_time,
                          "ScanBy": "TimestampAscending",
                          "MetricDataQueries": queries,
                      }
                      if next_token:
                          kwargs["NextToken"] = next_token
                      resp = cw_client.get_metric_data(**kwargs)
                      for result in resp.get("MetricDataResults", []):
                          region_count += sum(result.get("Values", []))
                      next_token = resp.get("NextToken")
                      if not next_token:
                          break
              return round(region_count), len(metrics)


          # Input validation (threat T8, mitigation M16). accountId arrives in the invocation payload,
          # so its format is checked before it is used in a role ARN or session name. The role name and
          # ExternalId come only from this function's environment (set by CloudFormation), never from the
          # payload, so a direct invocation can't point AssumeRole at a different role.
          ACCOUNT_ID_PATTERN = re.compile(r"[0-9]{12}")


          def require_account_id(value):
              if not isinstance(value, str) or not ACCOUNT_ID_PATTERN.fullmatch(value):
                  raise ValueError("Invalid accountId in input: expected a 12-digit AWS account ID")
              return value


          def handler(event, context):
              config = event.get("config", {})
              account = event["account"]
              account_id = require_account_id(account.get("accountId"))
              account_name = account["accountName"]
              errors = []

              # Read lookback from config dict (set by GetAccounts) or fall back to env var / default.
              lookback_days = int(config.get("lookbackDays") or os.environ.get("LOOKBACK_DAYS", "90"))
              cross_account_role_name = os.environ["CROSS_ACCOUNT_ROLE_NAME"]

              target_regions, all_regions_mode = resolve_target_regions()

              log("INFO", "collection_start", "Starting API call count collection",
                  accountId=account_id, accountName=account_name,
                  regionCount=len(target_regions), regions=target_regions,
                  allRegionsMode=all_regions_mode, lookbackDays=lookback_days)

              start_time = datetime.now(timezone.utc) - timedelta(days=lookback_days)
              end_time = datetime.now(timezone.utc)

              role_arn = f"arn:aws:iam::{account_id}:role/{cross_account_role_name}"
              external_id = os.environ.get("EXTERNAL_ID", "")
              creds = assume_role(role_arn, f"AC-{account_id}", external_id)

              api_call_count = 0
              skipped_regions = []
              for region in target_regions:
                  try:
                      cw_client = boto3.client("cloudwatch", region_name=region, config=RETRY_CONFIG, **creds)
                      region_count, series_count = get_api_call_count_for_region(
                          cw_client, start_time, end_time, lookback_days)
                      log("INFO", "region_count", "API call count for region",
                          accountId=account_id, accountName=account_name,
                          region=region, count=region_count, seriesCount=series_count)
                      api_call_count += region_count
                  except Exception as e:
                      if all_regions_mode and region_unavailable(e):
                          skipped_regions.append(region)
                          continue
                      msg = f"API call count collection failed for {account_id} in region {region}: {e}"
                      log("ERROR", "region_collection_failed",
                          "API call count collection failed for region",
                          accountId=account_id, accountName=account_name,
                          region=region, error=str(e))
                      errors.append(msg)

              log("INFO", "collection_complete", "API call count collection complete",
                  accountId=account_id, accountName=account_name,
                  totalApiCallCount=api_call_count,
                  regionsQueried=len(target_regions) - len(skipped_regions),
                  regionsSkipped=skipped_regions,
                  errorCount=len(errors))

              return {
                  "accountId": account_id,
                  "accountName": account_name,
                  "apiCallCount": api_call_count,
                  "collectionTimestamp": event.get("collectionTimestamp"),
                  "errors": errors,
                  # Any Region that failed (not skipped as unavailable) leaves the total undercounted.
                  "failedSignals": ["apiCalls"] if errors else [],
              }
      Environment:
        Variables:
          CROSS_ACCOUNT_ROLE_NAME: !Ref CrossAccountRoleName
          # TARGET_REGIONS: JSON array of Regions to query for AWS/Usage CallCount.
          # Empty ("[]") means every Region enabled in this account; a list always gets the home Region.
          TARGET_REGIONS: !Ref TargetRegions
          # LOOKBACK_DAYS: passed so the handler can read it from config or env var fallback
          LOOKBACK_DAYS: !Sub "${LookbackDays}"
          EXTERNAL_ID: !Ref ExternalId
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

