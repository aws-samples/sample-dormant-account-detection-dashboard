`).\n> **Active IAM Roles:** Non-SSO IAM roles with `RoleLastUsed.LastUsedDate` within the past ${LookbackDays} days. Source: IAM `GetAccountAuthorizationDetails`.\n> **Active SSO Permission Sets:** `AWSReservedSSO_*` roles with `RoleLastUsed.LastUsedDate` within ${LookbackDays} days — proxy for human access via IAM Identity Center."}},{"type":"metric","width":8,"height":8,"x":0,"y":27,"properties":{"view":"timeSeries","title":"Active IAM Users per Account — ${LookbackDays}-Day Lookback","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"ActiveIAMUserCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{}}},{"type":"metric","width":8,"height":8,"x":8,"y":27,"properties":{"view":"timeSeries","title":"Active IAM Roles per Account — ${LookbackDays}-Day Lookback","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"ActiveIAMRoleCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{}}},{"type":"metric","width":8,"height":8,"x":16,"y":27,"properties":{"view":"timeSeries","title":"Active SSO Roles per Account — ${LookbackDays}-Day Lookback","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"ActiveSSOUserCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{}}},{"type":"text","width":24,"height":1,"x":0,"y":35,"properties":{"markdown":"## 🗂️ Resource Inventory\n> **Total Resource Count:** All AWS resources currently tracked by the Config Aggregator (`${ConfigAggregatorName}`) — no date filter, counts every resource regardless of when it was created.\n> **Resources Created (${LookbackDays}-Day Lookback):** Resources whose `configurationItemCaptureTime` falls within the past ${LookbackDays} days — i.e. resources first discovered/created in that window. Source: Config Aggregator `SelectAggregateResourceConfig`."}},{"type":"metric","width":12,"height":8,"x":0,"y":36,"properties":{"view":"timeSeries","title":"Total Resource Count per Account (all Config-tracked resources)","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"TotalResourceCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{}}},{"type":"metric","width":12,"height":8,"x":12,"y":36,"properties":{"view":"timeSeries","title":"Resources Created per Account — ${LookbackDays}-Day Lookback (Config first-discovery)","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"ResourceCreatedCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{}}},{"type":"text","width":24,"height":1,"x":0,"y":44,"properties":{"markdown":"## 💰 Monthly Cost (USD) — Previous Calendar Month\n> Source: AWS Cost Explorer `GetCostAndUsage` API (Blended Cost, grouped by LINKED_ACCOUNT).\n> Cost data is fetched once per day from the Management (Payer) account."}},{"type":"metric","width":24,"height":8,"x":0,"y":45,"properties":{"view":"timeSeries","title":"Monthly Cost per Account (USD) — Previous Calendar Month","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"MonthlyCostUSD\"', 'Maximum', 86400)","period":86400}]],"yAxis":{"left":{"label":"USD","showUnits":false}}}},{"type":"metric","width":24,"height":3,"x":0,"y":54,"properties":{"view":"singleValue","title":"Latest Collection Snapshot — Accounts Processed / Collection Failures / Last Execution D