        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: /aws/lambda/DormantAccountDetection-CollectConfig
      Code:
        ZipFile: |
          ########################################################################################################
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0
          ########################################################################################################
          """
          CollectConfigMetrics Lambda (Python)

          Queries the AWS Config aggregator in the Config Aggregator account for resource inventory
          metrics across all target accounts using SelectAggregateResourceConfig SQL.

          Metrics collected per account:
            - TotalResourceCount: COUNT(*) GROUP BY accountId, filtered by target regions
            - ResourceCreatedCount (90d): COUNT(*) WHERE configurationItemCaptureTime >= <date>

          Region scoping rules:
            - Global resources (IAM, CloudFront, Route53, etc.) use awsRegion = "global" in
              the Config Aggregator. They are ALWAYS included regardless of TARGET_REGIONS.
            - If TARGET_REGIONS is empty ("[]", the default), the queries have no Region filter:
              resources in every Region, including "global", are counted.
            - If TARGET_REGIONS is provided, the list plus the home Region and "global" are used
              (deduplicated) so that home-Region and global resources are always counted.
            - Deduplication ensures no region (including "global") is counted more than once.

          The region scope is injected as a SQL WHERE awsRegion IN (...) clause, delegating
          filtering to the Config Aggregator SQL engine. This returns a single COUNT(*) per
          account — no per-region post-aggregation needed in Python.

          NOTE: AWS Config Advanced Query does NOT support AS column aliases.
                The COUNT(*) result key is literally "COUNT(*)" in the JSON response.
                Example: {"COUNT(*)":2407,"accountId":"123456789012"}

          All log output is structured JSON for CloudWatch Logs Insights queries.
          """
          import json
          import logging
          import os
          import re
          import boto3
          from datetime import datetime, timezone, timedelta
          from botocore.config import Config as BotoConfig

          # Adaptive client-side rate limiting with more attempts, so API throttling is retried
          # instead of being recorded as a partial collection failure.
          RETRY_CONFIG = BotoConfig(retries={"max_attempts": 10, "mode": "adaptive"})

          LOOKBACK_DAYS = 90
          # AWS Config Advanced Query uses the literal string "global" for the awsRegion
          # dimension of global resources (IAM, CloudFront, Route53 hosted zones, etc.).
          GLOBAL_REGION = "global"

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)


          def log(level, event, message, **fields):
              """Emit a structured JSON log line via the logging module."""
              record = {
                  "event": event,
                  "message": message,
              }
              record.update(fields)
              getattr(logger, level.lower(), logger.info)(json.dumps(record))


          def assume_role(role_arn, session_name, external_id=""):
              sts = boto3.client("sts")
              kwargs = {"RoleArn": role_arn, "RoleSessionName": session_name[:64]}
              if external_id:
                  kwargs["ExternalId"] = external_id
              resp = sts.assume_role(**kwargs)
              creds = resp["Credentials"]
              return {
                  "aws_access_key_id": creds["AccessKeyId"],
                  "aws_secret_access_key": creds["SecretAccessKey"],
                  "aws_session_token": creds["SessionToken"],
              }


          def execute_aggregate_query(config_client, aggregator_name, sql):
              """
              Execute a SelectAggregateResourceConfig query and return Map[accountId -> count].
              The COUNT(*) result key is the literal string "COUNT(*)" — not a named alias.
              """
              result_map = {}
              next_token = None
              log("INFO", "query_start", "Executing Config Aggregator query",
                  aggregatorName=aggregator_name, sql=sql)

              while True:
                  kwargs = {
                      "ConfigurationAggregatorName": aggregator_name,
                      "Expression": sql,
                      "Limit": 100,
                  }
                  if next_token:
                      kwargs["NextToken"] = next_token

                  resp = config_client.select_aggregate_resource_config(**kwargs)

                  for result_json in resp.get("Results", []):
                      try:
                          parsed = json.loads(result_json)
                          count = parsed.get("COUNT(*)")
                          account_id = parsed.get("accountId")
                          if account_id and count is not None:
                              result_map[account_id] = result_map.get(account_id, 0) + int(count)
                          else:
                              log("WARNING", "unexpected_result_format",
                                  "Unexpected Config query result format",
                                  rawResult=result_json)
                      except (json.JSONDecodeError, KeyError) as e:
                          log("ERROR", "result_parse_failed",
                              "Failed to parse Config query result",
                              rawResult=result_json, error=str(e))

                  next_token = resp.get("NextToken")
                  if not next_token:
                      break

              return result_map


          def build_regions_to_query():
              """
              Build the deduplicated list of awsRegion values to include in Config SQL queries.

              Rules:
                - The Lambda home region (AWS_REGION) is ALWAYS included — regional resources
                  deployed in the same region as the stack are never excluded.
                - GLOBAL_REGION ("global") is ALWAYS included — IAM, CloudFront, Route53, and
                  other global resources use awsRegion="global" in the Config Aggregator and must
                  never be excluded regardless of the TARGET_REGIONS setting.
                - If TARGET_REGIONS is empty ("[]" or unset): return None, meaning no Region
                  filter (every Region and "global" resources are counted).
                - If TARGET_REGIONS is provided: the list is used as-is, then home region and
                  "global" are appended and deduplicated. This means passing ["global"] still
                  returns regional resources from the home region — nothing is accidentally dropped.
                - Deduplication preserves insertion order so no region is counted more than once.

              Returns:
                  list[str] | None: Ordered, deduplicated list of region strings for the IN clause,
                  or None for no Region filter.
              """
              target_regions_raw = os.environ.get("TARGET_REGIONS", "[]")
              try:
                  target_regions = json.loads(target_regions_raw) if target_regions_raw else []
              except (json.JSONDecodeError, TypeError):
                  target_regions = []

              home_region = os.environ["AWS_REGION"]

              if not target_regions:
                  # Default: no Region filter, so every Region and global resources are counted.
                  return None
              invalid = [r for r in target_regions if not isinstance(r, str) or not REGION_PATTERN.fullmatch(r)]
              if invalid:
                  log("WARNING", "invalid_target_regions_dropped",
                      "Dropped TARGET_REGIONS entries that are not Region names", droppedCount=len(invalid))
                  target_regions = [r for r in target_regions if r not in invalid]
              # Provided list + home region + global (all always included)
              candidate_regions = list(target_regions) + [home_region, GLOBAL_REGION]

              # Deduplicate while preserving insertion order (dict.fromkeys preserves order in Python 3.7+)
              return list(dict.fromkeys(candidate_regions))


          # Input validation (threat T8, mitigation M16). Account IDs arrive in the invocation payload,
          # so entries without a 12-digit accountId are dropped before use. Account IDs, role names,
          # ExternalId, and the aggregator name used for AssumeRole come only from this function's
          # environment (set by CloudFormation), never from the payload.
          ACCOUNT_ID_PATTERN = re.compile(r"[0-9]{12}")


          def valid_accounts(accounts):
              valid = [a for a in (accounts or [])
                       if isinstance(a, dict) and isinstance(a.get("accountId"), str)
                       and ACCOUNT_ID_PATTERN.fullmatch(a["accountId"])]
              if len(valid) != len(accounts or []):
                  log("WARNING", "invalid_account_ids_dropped",
                      "Dropped input entries without a valid 12-digit accountId",
                      droppedCount=len(accounts or []) - len(valid))
              return valid


          # Region names are interpolated into the Config SQL, so only well-formed names are kept.
          REGION_PATTERN = re.compile(r"[a-z]{2}(-[a-z]+)+-[0-9]+|global")


          def handler(event, context):
              config = event.get("config", {})
              accounts = valid_accounts(event.get("accounts", []))
              errors = []
              failed_signals = []

              config_aggregator_account_id = os.environ["CONFIG_AGGREGATOR_ACCOUNT_ID"]
              config_aggregator_role_name = (
                  os.environ.get("CONFIG_AGGREGATOR_ROLE_NAME")
                  or os.environ["CROSS_ACCOUNT_ROLE_NAME"]
              )
              aggregator_name = os.environ["CONFIG_AGGREGATOR_NAME"]

              # Build the effective region list for SQL filtering.
              # global resources are always included regardless of TARGET_REGIONS.
              regions_to_query = build_regions_to_query()
              region_filter = (None if regions_to_query is None else
                               "awsRegion IN (" + ", ".join(f"'{r}'" for r in regions_to_query) + ")")

              log("INFO", "collection_start", "Starting Config Aggregator metrics collection",
                  aggregatorName=aggregator_name, accountCount=len(accounts),
                  regionsToQuery=regions_to_query or "all", regionFilter=region_filter or "none")

              role_arn = f"arn:aws:iam::{config_aggregator_account_id}:role/{config_aggregator_role_name}"
              external_id = os.environ.get("EXTERNAL_ID", "")
              creds = assume_role(role_arn, "DormantAccountDetection-CollectConfig", external_id)
              config_client = boto3.client("config", config=RETRY_CONFIG, **creds)

              target_account_ids = {a["accountId"] for a in accounts}
              metrics_map = {a["accountId"]: {"accountId": a["accountId"], "totalResourceCount": 0, "resourceCreatedCount": 0}
                             for a in accounts}

              # Query 1: TotalResourceCount per account (no date filter, region-scoped)
              # global resources are included via the "global" entry in regions_to_query.
              try:
                  where = f"WHERE {region_filter} " if region_filter else ""
                  sql = f"SELECT accountId, COUNT(*) {where}GROUP BY accountId"
                  total_map = execute_aggregate_query(config_client, aggregator_name, sql)
                  for account_id, count in total_map.items():
                      if account_id in target_account_ids:
                          metrics_map[account_id]["totalResourceCount"] = count
                  log("INFO", "total_resource_count_complete",
                      "TotalResourceCount query complete",
                      accountsReturned=len(total_map),
                      accountsMatched=sum(1 for a in total_map if a in target_account_ids))
              except Exception as e:
                  failed_signals.append("totalResources")
                  msg = f"Config TotalResourceCount query failed: {e}"
                  log("ERROR", "total_resource_count_failed",
                      "TotalResourceCount query failed", error=str(e))
                  errors.append(msg)

              # Read lookback from config dict (set by GetAccounts) or fall back to env var / default.
              lookback_days = int(config.get("lookbackDays") or os.environ.get("LOOKBACK_DAYS", "90"))

              # Query 2: ResourceCreatedCount per account (date filter + region scope)
              # global resources (e.g. IAM roles, policies) created in the lookback window are included.
              try:
                  cutoff = (datetime.now(timezone.utc) - timedelta(days=lookback_days)).strftime("%Y-%m-%d")
                  conditions = [f"configurationItemCaptureTime >= '{cutoff}T00:00:00.000Z'"]
                  if region_filter:
                      conditions.insert(0, region_filter)
                  sql = f"SELECT accountId, COUNT(*) WHERE {' AND '.join(conditions)} GROUP BY accountId"
                  created_map = execute_aggregate_query(config_client, aggregator_name, sql)
                  for account_id, count in created_map.items():
                      if account_id in target_account_ids:
                          metrics_map[account_id]["resourceCreatedCount"] = count
                  log("INFO", "resource_created_count_complete",
                      "ResourceCreatedCount query complete",
                      lookbackDays=lookback_days,
                      accountsReturned=len(created_map),
                      accountsMatched=sum(1 for a in created_map if a in target_account_ids))
              except Exception as e:
                  failed_signals.append("resourceCreated")
                  msg = f"Config ResourceCreatedCount query failed: {e}"
                  log("ERROR", "resource_created_count_failed",
                      "ResourceCreatedCount query failed", error=str(e))
                  errors.append(msg)

              log("INFO", "collection_complete", "Config Aggregator metrics collection complete",
                  accountCount=len(metrics_map), errorCount=len(errors))

              return {
                  "metrics": list(metrics_map.values()),
                  "collectionTimestamp": event.get("collectionTimestamp"),
                  "errors": errors,
                  "failedSignals": failed_signals,
              }
      Environment:
        Variables:
          CONFIG_AGGREGATOR_ACCOUNT_ID: !Ref ConfigAggregatorAccountId
          CONFIG_AGGREGATOR_NAME: !Ref ConfigAggregatorName
          CROSS_ACCOUNT_ROLE_NAME: !Ref CrossAccountRoleName
          # CONFIG_AGGREGATOR_ROLE_NAME overrides CROSS_ACCOUNT_ROLE_NAME for the Config Aggregator account assume-role.
          # Set to a different value than CrossAccountRoleName only when the Config Aggregator account is the
          # same as the Management account or a target account (naming conflict prevention).
          CONFIG_AGGREGATOR_ROLE_NAME: !Ref ConfigAggregatorRoleName
          # TARGET_REGIONS: JSON array of Regions to scope Config Aggregator SQL queries.
          # Empty ("[]") → no Region filter: every Region plus global resources.
          # Non-empty → provided list + home Region + "global" (deduplicated).
          TARGET_REGIONS: !Ref TargetRegions
          # LOOKBACK_DAYS: passed so the handler can read it from config or env var fallback
          LOOKBACK_DAYS: !Sub "${LookbackDays}"
          EXTERNAL_ID: !Ref ExternalId
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

