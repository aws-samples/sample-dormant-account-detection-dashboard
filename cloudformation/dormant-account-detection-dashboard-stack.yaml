ht":1,"x":0,"y":2,"properties":{"markdown":"## 🚨 Dormancy Scoring\n> Each account receives a **Dormancy Score (0-100)** based on 6 weighted signals: 2 absolute human-presence flags plus 4 self-relative activity trends computed against the account's own ${LookbackDays}-day history (each account is its own baseline — no absolute thresholds).\n> **Higher score = more active.** Accounts with score ≤ ${CriticalDormancyMaxScore} are CRITICAL dormancy candidates. **New-account grace period:** accounts whose AWS Organizations join date is within the last ${NewAccountGracePeriodDays} days are excluded from dormancy scoring (no DormancyScore/DormancyRating and no CRITICAL/HIGH alerts) to avoid false alerts on freshly-onboarded accounts — raw activity signals are still collected and shown. Set NewAccountGracePeriodDays=0 to disable.\n\n| Score Range | Rating | Meaning |\n|-------------|--------|---------|\n| > ${LowDormancyMaxScore} | **ACTIVE (5)** | High activity — clearly active |\n| > ${MediumDormancyMaxScore} and ≤ ${LowDormancyMaxScore} | **LOW (4)** | Moderate activity — likely not dormant |\n| > ${HighDormancyMaxScore} and ≤ ${MediumDormancyMaxScore} | **MEDIUM (3)** | Some activity — needs review |\n| > ${CriticalDormancyMaxScore} and ≤ ${HighDormancyMaxScore} | **HIGH (2)** | Minimal activity — likely dormant |\n| ≤ ${CriticalDormancyMaxScore} | **CRITICAL (1)** | No measurable activity — strong dormancy candidate |\n\n**Score formula (hybrid self-baselining, configurable via `CloudFormation`):** Human presence (absolute, all-or-nothing): +${DormancyWeightSSOPresence} ActiveSSOUserCount>0, +${DormancyWeightIAMUserPresence} ActiveIAMUserCount>0. Activity trends (self-relative, points = weight × trend ratio): +${DormancyWeightApiCallTrend}×ApiCallCount trend, +${DormancyWeightIAMRoleTrend}×ActiveIAMRoleCount trend, +${DormancyWeightCostTrend}×MonthlyCostUSD trend, +${DormancyWeightResourceCreatedTrend}×ResourceCreatedCount trend. Trend ratio = mean(last N days) / mean(