              {"start":"-P30D","periodOverride":"inherit","variables":[{"type":"pattern","pattern":"__ACCTFILTER__","inputType":"input","id":"acctFilter","label":"Account name (space=all)","defaultValue":" ","visible":true}],"widgets":[{"type":"text","width":24,"height":2,"x":0,"y":0,"properties":{"markdown":"# 🔍 Dormant Account Detection Dashboard\n**Metric Namespace:** `${MetricsNamespace}` | **SFN Namespace:** `${SfnMetricsNamespace}`\n**Schedule:** Daily at 2:00 AM UTC | **Activity Lookback:** ${LookbackDays} days | **Cost:** Previous calendar month\n\n| Metric | Source | Description |\n|--------|--------|-------------|\n| `ApiCallCount` | CloudWatch `AWS/Usage` namespace (`CallCount`, pre-aggregated by AWS) | Total management API calls made in the account in the **past ${LookbackDays} days**. Single `GetMetricData` call — no CloudTrail pagination required. |\n| `ActiveIAMUserCount` | IAM Credential Report (`password_last_used` + `access_key_last_used`) | IAM users with at least one password sign-in or access key usage in the **past ${LookbackDays} days**. |\n| `ActiveIAMRoleCount` | IAM `GetAccountAuthorizationDetails` (`RoleLastUsed.LastUsedDate`) | IAM roles (excluding `AWSReservedSSO_*`) with a `LastUsedDate` within the **past ${LookbackDays} days**. |\n| `ActiveSSOUserCount` | IAM `GetAccountAuthorizationDetails` (`AWSReservedSSO_*` role `RoleLastUsed`) | IAM Identity Center permission sets actively assumed by humans in the **past ${LookbackDays} days**. Proxy metric — counts distinct `AWSReservedSSO_*` roles with recent use. |\n| `TotalResourceCount` | Config Aggregator (`SelectAggregateResourceConfig`, no date filter) | All AWS resources currently tracked by Config in the account — `COUNT(*)` with no WHERE clause. |\n| `ResourceCreatedCount` | Config Aggregator (`configurationItemCaptureTime ≥ ${LookbackDays} days ago`) | Resources first discovered/created in the **past ${LookbackDays} days** — when Config recorded the resource for the first time. |\n| `MonthlyCostUSD` | Cost Explorer `GetCostAndUsage` (Blended Cost, grouped by `LINKED_ACCOUNT`) | Total blended cost for the **previous full calendar month** in USD. Used in dormancy scoring as a **self-relative cost trend signal** — the ${LookbackDays}-day history of this metric is analysed at scoring time; score points = ${DormancyWeightCostTrend} × trend ratio (mean of last N days / mean of first N days of the account's own cost history, capped at 1.0, N = ${TrendWindowFraction}×${LookbackDays} days). |\n\n> ⚠️ **Zero values** across all metrics may indicate a **dormant account**."}},{"type":"text","width":24,"height":1,"x":0,"y":53,"properties":{"markdown":"## ⚙️ Metric Collection Health"}},{"type":"metric","width":8,"height":6,"x":0,"y":57,"properties":{"view":"bar","title":"30-Day Collection: Success vs Failure","region":"${AWS::Region}","metrics":[["${SfnMetricsNamespace}","MetricCollectionSuccess","StateMachine","AccountMetricCollection",{"color":"#2ca02c","label":"Success","period":2592000,"stat":"Sum"}],["${SfnMetricsNamespace}","MetricCollectionFailure","StateMachine","AccountMetricCollection",{"color":"#d62728","label":"Failure","period":2592000,"stat":"Sum"}]],"yAxis":{}}},{"type":"metric","width":8,"height":6,"x":8,"y":57,"properties":{"view":"timeSeries","title":"Execution Duration (seconds)","region":"${AWS::Region}","metrics":[["${SfnMetricsNamespace}","ExecutionDurationSeconds","StateMachine","AccountMetricCollection",{"color":"#1f77b4","label":"Avg Duration","period":86400}],["${SfnMetricsNamespace}","ExecutionDurationSeconds","StateMachine","AccountMetricCollection",{"color":"#ff7f0e","label":"Max Duration","period":86400,"stat":"Maximum"}]],"yAxis":{}}},{"type":"metric","width":8,"height":6,"x":16,"y":57,"properties":{"view":"timeSeries","title":"Accounts Processed vs Failed","region":"${AWS::Region}","metrics":[["${SfnMetricsNamespace}","AccountsProcessed","StateMachine","AccountMetricCollection",{"color":"#2ca02c","label":"Processed","period":86400,"stat":"Maximum"}],["${SfnMetricsNamespace}","AccountsFailed","StateMachine","AccountMetricCollection",{"color":"#d62728","label":"Failed","period":86400,"stat":"Maximum"}]],"yAxis":{}}},{"type":"metric","width":24,"height":6,"x":0,"y":63,"properties":{"view":"timeSeries","stacked":false,"title":"CollectionFailed per Account (0=success, 1=failed) — gaps mean no run produced data","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"CollectionFailed\"', 'Maximum', 86400)","period":86400}]],"yAxis":{"left":{"min":0,"max":1,"label":"Status","showUnits":false}}}},{"type":"text","width":24,"height":1,"x":0,"y":2,"properties":{"markdown":"## 🚨 Dormancy Scoring\n> Each account receives a **Dormancy Score (0-100)** based on 6 weighted signals: 2 absolute human-presence flags plus 4 self-relative activity trends computed against the account's own ${LookbackDays}-day history (each account is its own baseline — no absolute thresholds).\n> **Higher score = more active.** Accounts with score ≤ ${CriticalDormancyMaxScore} are CRITICAL dormancy candidates. **New-account grace period:** accounts whose AWS Organizations join date is within the last ${NewAccountGracePeriodDays} days are excluded from dormancy scoring (no DormancyScore/DormancyRating and no CRITICAL/HIGH alerts) to avoid false alerts on freshly-onboarded accounts — raw activity signals are still collected and shown. Set NewAccountGracePeriodDays=0 to disable.\n\n| Score Range | Rating | Meaning |\n|-------------|--------|---------|\n| > ${LowDormancyMaxScore} | **ACTIVE (5)** | High activity — clearly active |\n| > ${MediumDormancyMaxScore} and ≤ ${LowDormancyMaxScore} | **LOW (4)** | Moderate activity — likely not dormant |\n| > ${HighDormancyMaxScore} and ≤ ${MediumDormancyMaxScore} | **MEDIUM (3)** | Some activity — needs review |\n| > ${CriticalDormancyMaxScore} and ≤ ${HighDormancyMaxScore} | **HIGH (2)** | Minimal activity — likely dormant |\n| ≤ ${CriticalDormancyMaxScore} | **CRITICAL (1)** | No measurable activity — strong dormancy candidate |\n\n**Score formula (hybrid self-baselining, configurable via `CloudFormation`):** Human presence (absolute, all-or-nothing): +${DormancyWeightSSOPresence} ActiveSSOUserCount>0, +${DormancyWeightIAMUserPresence} ActiveIAMUserCount>0. Activity trends (self-relative, points = weight × trend ratio): +${DormancyWeightApiCallTrend}×ApiCallCount trend, +${DormancyWeightIAMRoleTrend}×ActiveIAMRoleCount trend, +${DormancyWeightCostTrend}×MonthlyCostUSD trend, +${DormancyWeightResourceCreatedTrend}×ResourceCreatedCount trend. Trend ratio = mean(last N days) / mean(first N days) of the account's **own** metric history, capped at 1.0, with N = ${TrendWindowFraction}×${LookbackDays} days — stable or growing activity earns full points, declining activity earns proportionally fewer; accounts with under 2×N days of history get full trend points (cold-start safe). TotalResourceCount is not scored (standing inventory, not activity). Lookback: ${LookbackDays} days"}},{"type":"metric","width":12,"height":8,"x":0,"y":3,"properties":{"view":"timeSeries","title":"Dormancy Score per Account (0=fully dormant, 100=fully active)","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"DormancyScore\"', 'Maximum', 86400)","period":86400}]],"yAxis":{"left":{"min":0,"max":100,"label":"Score","showUnits":false}}}},{"type":"metric","width":12,"height":8,"x":12,"y":3,"properties":{"view":"timeSeries","title":"Dormancy Rating per Account (1=CRITICAL, 5=ACTIVE)","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"DormancyRating\"', 'Maximum', 86400)","period":86400}]],"yAxis":{"left":{"min":1,"max":5,"label":"Rating","showUnits":false}}}},{"type":"custom","width":24,"height":6,"x":0,"y":11,"properties":{"endpoint":"${DormantAccountsWidgetFn.Arn}","params":{"accountFilter":"__ACCTFILTER__"},"title":"Dormant Accounts — CRITICAL & HIGH (score ≤ ${HighDormancyMaxScore})","updateOn":{"refresh":true,"resize":true,"timeRange":true}}},{"type":"text","width":24,"height":1,"x":0,"y":17,"properties":{"markdown":"## 📡 API Call Activity — ${LookbackDays}-Day Lookback\n> **Source:** CloudWatch `AWS/Usage` namespace — `CallCount` metric, pre-aggregated by AWS for every API operation in the account.\n> A single `GetMetricData` SEARCH+SUM call returns the total across all services. No CloudTrail pagination — free, fast, and throttle-proof."}},{"type":"metric","width":24,"height":8,"x":0,"y":18,"properties":{"view":"timeSeries","title":"API Call Count per Account — ${LookbackDays}-Day Lookback","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"ApiCallCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{},"liveData":false}},{"type":"text","width":24,"height":1,"x":0,"y":26,"properties":{"markdown":"## 👤 IAM Activity — ${LookbackDays}-Day Lookback\n> **Active IAM Users:** IAM users with at least one password sign-in or access key usage in the past ${LookbackDays} days. Source: IAM Credential Report (`password_last_used`, `access_key_last_used`).\n> **Active IAM Roles:** Non-SSO IAM roles with `RoleLastUsed.LastUsedDate` within the past ${LookbackDays} days. Source: IAM `GetAccountAuthorizationDetails`.\n> **Active SSO Permission Sets:** `AWSReservedSSO_*` roles with `RoleLastUsed.LastUsedDate` within ${LookbackDays} days — proxy for human access via IAM Identity Center."}},{"type":"metric","width":8,"height":8,"x":0,"y":27,"properties":{"view":"timeSeries","title":"Active IAM Users per Account — ${LookbackDays}-Day Lookback","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"ActiveIAMUserCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{}}},{"type":"metric","width":8,"height":8,"x":8,"y":27,"properties":{"view":"timeSeries","title":"Active IAM Roles per Account — ${LookbackDays}-Day Lookback","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"ActiveIAMRoleCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{}}},{"type":"metric","width":8,"height":8,"x":16,"y":27,"properties":{"view":"timeSeries","title":"Active SSO Roles per Account — ${LookbackDays}-Day Lookback","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"ActiveSSOUserCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{}}},{"type":"text","width":24,"height":1,"x":0,"y":35,"properties":{"markdown":"## 🗂️ Resource Inventory\n> **Total Resource Count:** All AWS resources currently tracked by the Config Aggregator (`${ConfigAggregatorName}`) — no date filter, counts every resource regardless of when it was created.\n> **Resources Created (${LookbackDays}-Day Lookback):** Resources whose `configurationItemCaptureTime` falls within the past ${LookbackDays} days — i.e. resources first discovered/created in that window. Source: Config Aggregator `SelectAggregateResourceConfig`."}},{"type":"metric","width":12,"height":8,"x":0,"y":36,"properties":{"view":"timeSeries","title":"Total Resource Count per Account (all Config-tracked resources)","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"TotalResourceCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{}}},{"type":"metric","width":12,"height":8,"x":12,"y":36,"properties":{"view":"timeSeries","title":"Resources Created per Account — ${LookbackDays}-Day Lookback (Config first-discovery)","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"ResourceCreatedCount\"', 'Maximum', 86400)","period":86400}]],"yAxis":{}}},{"type":"text","width":24,"height":1,"x":0,"y":44,"properties":{"markdown":"## 💰 Monthly Cost (USD) — Previous Calendar Month\n> Source: AWS Cost Explorer `GetCostAndUsage` API (Blended Cost, grouped by LINKED_ACCOUNT).\n> Cost data is fetched once per day from the Management (Payer) account."}},{"type":"metric","width":24,"height":8,"x":0,"y":45,"properties":{"view":"timeSeries","title":"Monthly Cost per Account (USD) — Previous Calendar Month","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"MonthlyCostUSD\"', 'Maximum', 86400)","period":86400}]],"yAxis":{"left":{"label":"USD","showUnits":false}}}},{"type":"metric","width":24,"height":3,"x":0,"y":54,"properties":{"view":"singleValue","title":"Latest Collection Snapshot — Accounts Processed / Collection Failures / Last Execution Duration (last run)","region":"${AWS::Region}","sparkline":false,"setPeriodToTimeRange":false,"metrics":[["${SfnMetricsNamespace}","AccountsProcessed","StateMachine","AccountMetricCollection",{"label":"Total Accounts Processed","period":86400,"stat":"Maximum"}],["${SfnMetricsNamespace}","AccountsFailed","StateMachine","AccountMetricCollection",{"label":"Collection Failures","period":86400,"stat":"Maximum"}],["${SfnMetricsNamespace}","ExecutionDurationSeconds","StateMachine","AccountMetricCollection",{"label":"Last Execution Duration (s)","period":86400,"stat":"Maximum"}]]}}]}

Outputs:

  GetAccountsRoleArn:
    Description: ARN of the GetAccounts function-specific IAM role.
    Value: !GetAtt GetAccountsRole.Arn
    Export:
      Name: DormantAccountDetection-GetAccountsRoleArn

  CollectApiCallMetricsRoleArn:
    Description: ARN of the CollectApiCallMetrics function-specific IAM role.
    Value: !GetAtt CollectApiCallMetricsRole.Arn
    Export:
      Name: DormantAccountDetection-CollectApiCallMetricsRoleArn

  CollectIAMRoleArn:
    Description: ARN of the CollectIAM function-specific IAM role.
    Value: !GetAtt CollectIAMRole.Arn
    Export:
      Name: DormantAccountDetection-CollectIAMRoleArn

  CollectConfigRoleArn:
    Description: ARN of the CollectConfig function-specific IAM role.
    Value: !GetAtt CollectConfigRole.Arn
    Export:
      Name: DormantAccountDetection-CollectConfigRoleArn

  CollectCostRoleArn:
    Description: ARN of the CollectCost function-specific IAM role.
    Value: !GetAtt CollectCostRole.Arn
    Export:
      Name: DormantAccountDetection-CollectCostRoleArn

  PublishMetricsRoleArn:
    Description: ARN of the PublishMetrics function-specific IAM role (dashboard account only - no cross-account AssumeRole).
    Value: !GetAtt PublishMetricsRole.Arn
    Export:
      Name: DormantAccountDetection-PublishMetricsRoleArn

  StateMachineArn:
    Description: ARN of the DormantAccountDetection Step Functions state machine.
    Value: !Ref StateMachine
    Export:
      Name: DormantAccountDetection-StateMachineArn

  EventRuleArn:
    Description: ARN of the EventBridge rule that triggers daily metric collection.
    Value: !GetAtt DailyTriggerRule.Arn
    Export:
      Name: DormantAccountDetection-EventRuleArn

  LogGroupKmsKeyArn:
    Condition: CreateLogGroupKmsKey
    Description: >
      ARN of the auto-created CMK used to encrypt all CloudWatch Log Groups.
      Only present when LogGroupKmsKeyType=CMK and LogGroupKmsKeyArn was left empty.
      Schedule this key for deletion manually via the KMS console if the stack is deleted.
    Value: !GetAtt LogGroupKmsKey.Arn
    Export:
      Name: DormantAccountDetection-LogGroupKmsKeyArn

  SnsKmsKeyArn:
    Condition: CreateSnsKmsKey
    Description: >
      ARN of the auto-created CMK used to encrypt the CRITICAL and HIGH dormancy SNS topics.
      Only present when SnsKmsKeyType=CMK, SnsKmsKeyArn was left empty, and alarms are enabled.
      Schedule this key for deletion manually via the KMS console if the stack is deleted.
    Value: !GetAtt SnsKmsKey.Arn
    Export:
      Name: DormantAccountDetection-SnsKmsKeyArn

  DashboardUrl:
    Description: URL to the Dormant Account Detection Dashboard.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DashboardName}"
    Export:
      Name: DormantAccountDetection-DashboardUrl

  DormantAccountsWidgetFunctionArn:
    Description: >
      ARN of the Lambda backing the "Dormant Accounts (CRITICAL & HIGH)" custom widget.
      CloudWatch invokes custom-widget Lambdas using the credentials of the IAM principal
      VIEWING the dashboard, so every dashboard viewer must have lambda:InvokeFunction on this
      ARN for the table to render. The first time the widget loads, viewers must also click
      "Allow always" (or "Allow once") to trust the function, per CloudWatch custom-widget security.
    Value: !GetAtt DormantAccountsWidgetFn.Arn
    Export:
      Name: DormantAccountDetection-DormantAccountsWidgetFunctionArn

  CriticalDormancyTopicArn:
    Condition: CreateAlarms
    Description: SNS Topic ARN for CRITICAL dormancy alerts.
    Value: !Ref CriticalDormancyTopic
    Export:
      Name: DormantAccountDetection-CriticalDormancyTopicArn

  HighDormancyTopicArn:
    Condition: CreateAlarms
    Description: SNS Topic ARN for HIGH dormancy alerts.
    Value: !Ref HighDormancyTopic
    Export:
      Name: DormantAccountDetection-HighDormancyTopicArn
