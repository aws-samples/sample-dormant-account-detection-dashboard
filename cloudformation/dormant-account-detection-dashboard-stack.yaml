# KICS checks disabled for this file (accepted risks, see SECURITY.md):
#   c2eae442-d3ba-4cb1-84ca-1db4f80eae3d Lambda Function Without Dead Letter Queue: every function is
#     invoked synchronously (Step Functions or the CloudWatch dashboard), and DLQs only capture
#     asynchronous invocation failures. Step Functions Retry and Catch handle pipeline failures.
#   9488c451-074e-4cd3-aee3-7db6104f542c Lambda Functions Without X-Ray Tracing: daily batch job;
#     health is monitored with CloudWatch Logs, Step Functions metrics, and alarms.
# Keep the directive below in a comment group of its own: KICS ignores it otherwise.

# kics-scan disable=c2eae442-d3ba-4cb1-84ca-1db4f80eae3d,9488c451-074e-4cd3-aee3-7db6104f542c

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Dormant Account Detection Dashboard: Collects API call counts (CloudWatch AWS/Usage),
  IAM activity, Config resource inventory, and Cost Explorer data across all AWS
  Organization accounts. Publishes metrics to CloudWatch with dormancy scoring
  and SNS alerts for dormant account detection.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "AWS Organization Accounts"
        Parameters:
          - ManagementAccountId
          - ConfigAggregatorAccountId
          - DashboardAccountId
          - OrganizationId
          - TargetOuIds
          - TargetAccountIds
          - ExcludedAccountIds
          - CrossAccountRoleName
          - ConfigAggregatorRoleName
          - ExternalId
      - Label:
          default: "Collection Configuration"
        Parameters:
          - ConfigAggregatorName
          - TargetRegions
          - ScheduleExpression
          - LogGroupRetentionDays
          - LambdaMemoryMB
          - LambdaReservedConcurrency
          - MapConcurrency
          - LogIamPrincipalNames
      - Label:
          default: "KMS Encryption"
        Parameters:
          - LogGroupKmsKeyType
          - LogGroupKmsKeyArn
          - SnsKmsKeyType
          - SnsKmsKeyArn
          - KmsKeyRotationPeriodDays
          - EnableStateMachineEncryption
          - StateMachineKmsDataKeyReusePeriodSeconds
      - Label:
          default: "Metrics & Dashboard"
        Parameters:
          - MetricsNamespace
          - SfnMetricsNamespace
          - SfnAlertNamespace
          - DashboardName
          - NotificationEmail
          - EnableDormancyAlarms
          - EnableCollectionFailureAlarm
          - EnableStateMachineFailureAlarm
          - EnableHeartbeatAlarm
          - HeartbeatWindowHours
          - AdminSSOPrefixes
          - DormantAccountsWidgetMetricWindowDays
          - PriorRatingWindowDays
      - Label:
          default: "Dormancy Score Weights (hybrid self-baselining, sum = max score, default = 100)"
        Parameters:
          - DormancyWeightSSOPresence
          - DormancyWeightIAMUserPresence
          - DormancyWeightApiCallTrend
          - DormancyWeightIAMRoleTrend
          - DormancyWeightCostTrend
          - DormancyWeightResourceCreatedTrend
      - Label:
          default: "Dormancy Trend & Lookback Window"
        Parameters:
          - LookbackDays
          - NewAccountGracePeriodDays
          - TrendWindowFraction
      - Label:
          default: "Dormancy Rating Band Boundaries (score upper bounds, 0-100)"
        Parameters:
          - CriticalDormancyMaxScore
          - HighDormancyMaxScore
          - MediumDormancyMaxScore
          - LowDormancyMaxScore

# ────────────────────────────────────────────────────────────────────────────
# Parameters
# ────────────────────────────────────────────────────────────────────────────
Parameters:

  # ── AWS Organization Accounts ─────────────────────────────────────────────
  ManagementAccountId:
    Type: String
    Description: AWS account ID of the management account of the organization (used for Cost Explorer and Organizations APIs).
    AllowedPattern: "^[0-9]{12}$"

  ConfigAggregatorAccountId:
    Type: String
    Description: AWS Account ID of the account hosting the AWS Config Aggregator (used for Config Aggregator queries).
    AllowedPattern: "^[0-9]{12}$"

  DashboardAccountId:
    Type: String
    Description: >
      (Optional) AWS account ID of the account where this CloudWatch dashboard stack is deployed.
      Leave empty to use the current account. If set, it must match the current account.
    AllowedPattern: "^([0-9]{12})?$"
    ConstraintDescription: Must be empty or a 12-digit AWS account ID.
    Default: ""

  TargetOuIds:
    Type: String
    Description: >
      JSON array of Organization Unit IDs or the Organization Root ID to monitor recursively.
      Use OU IDs (format: ou-xxxx-xxxxxxxx) to monitor a specific OU subtree, or the Root ID
      (format: r-xxxx) to monitor all accounts in the entire organization.
      Example (specific OUs): ["ou-xxxx-aaaaaaaa","ou-xxxx-bbbbbbbb"]
      Example (entire org): ["r-xxxx"]
      Find your Root ID: aws organizations list-roots --query 'Roots[0].Id' --output text
    Default: "[]"

  TargetAccountIds:
    Type: String
    Description: >
      JSON array of individual account IDs to include (in addition to OU members).
      Example: ["123456789012"]
    Default: "[]"

  ExcludedAccountIds:
    Type: String
    Description: >
      JSON array of account IDs to exclude from monitoring.
      Example: ["999999999999"]
    Default: "[]"

  CrossAccountRoleName:
    Type: String
    AllowedPattern: "^[\\w+=,.@-]{1,64}$"
    ConstraintDescription: Must be a valid IAM role name (1-64 characters, letters, numbers, and +=,.@_-).
    Description: >
      Name of the IAM role deployed in each target account and management account
      that the monitoring Lambda functions assume.
    Default: DormantAccountDetectionRole

  ConfigAggregatorRoleName:
    Type: String
    AllowedPattern: "^([\\w+=,.@-]{1,64})?$"
    ConstraintDescription: Must be empty or a valid IAM role name (1-64 characters, letters, numbers, and +=,.@_-).
    Description: >
      Name of the IAM role deployed in the Config Aggregator account (config-aggregator-monitoring-role.yaml).
      Must match the RoleName parameter used when deploying config-aggregator-monitoring-role.yaml.
      The default differs from CrossAccountRoleName, so the role doesn't clash with the management
      account or target account role when the Config Aggregator account is also one of those accounts.
      Empty = use CrossAccountRoleName.
    Default: DormantAccountDetection-ConfigAggregatorRole

  ExternalId:
    Type: String
    NoEcho: true
    AllowedPattern: "^([\\w+=,.@:/-]{2,1224})?$"
    ConstraintDescription: Must be empty or 2-1224 characters (letters, numbers, and +=,.@:/_-).
    Description: >
      (Optional) External ID for additional cross-account trust policy security (confused deputy protection).
      When provided, all Lambda functions pass this value as sts:ExternalId when assuming cross-account roles.
      Must match the ExternalId parameter used when deploying management-account-monitoring-role.yaml,
      config-aggregator-monitoring-role.yaml, and stackset-target-accounts-monitoring-role.yaml.
      Leave empty to disable ExternalId (no backward-compat impact on existing deployments).
    Default: ""

  # ── Collection Configuration ──────────────────────────────────────────────
  ConfigAggregatorName:
    Type: String
    Description: >
      Name of the AWS Config aggregator in the Config Aggregator account. The default is the
      aggregator that AWS Control Tower (landing zone before 4.0) creates in the Audit account.
    AllowedPattern: "^[\\w-]{1,256}$"
    ConstraintDescription: Must be 1-256 characters (letters, numbers, underscores, and hyphens).
    Default: aws-controltower-GuardrailsComplianceAggregator

  TargetRegions:
    Type: String
    Description: >
      JSON array of AWS Regions to collect activity from. Default "[]": every Region. ApiCallCount
      then sums AWS/Usage CallCount across all Regions enabled in the Dashboard account (Regions a
      member account can't use, for example because an SCP denies them, are skipped), and the
      AWS Config queries count resources in every Region plus global resources. When you list
      Regions, the home Region (where this stack is deployed) is always added, and the AWS Config
      queries also include global resources.
      Example: ["eu-central-1","us-east-1"]
      IAM, Cost Explorer, and Organizations metrics are not affected (they are global).
    Default: "[]"

  ScheduleExpression:
    Type: String
    Description: >
      EventBridge schedule expression for daily metric collection.
      Default: 2:00 AM UTC every day.
    Default: "cron(0 2 * * ? *)"

  LogGroupRetentionDays:
    Type: Number
    Description: >
      Retention period in days for all CloudWatch Log Groups (Lambda + Step Functions).
      Must be a value accepted by the CloudWatch Logs API.
    Default: 365
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653

  LambdaMemoryMB:
    Type: Number
    Description: Memory allocation in MB for all Lambda functions.
    Default: 512
    MinValue: 128
    MaxValue: 10240

  LambdaReservedConcurrency:
    Type: Number
    Description: >
      Reserved concurrency limit for each Lambda function. Prevents Lambda functions from
      consuming the entire account concurrency pool. Set to at least MapConcurrency to
      allow parallel per-account invocations in the IAM and API call Map states.
    Default: 10
    MinValue: 1
    MaxValue: 1000

  MapConcurrency:
    Type: Number
    Description: >
      Maximum concurrency for per-account Map states (IAM and API call collection).
      Both branches use CloudWatch/IAM APIs with high rate limits — 10 is safe.
    Default: 10
    MinValue: 1
    MaxValue: 40

  # ── Cross-Account Role Restriction ───────────────────────────────────────
  OrganizationId:
    Type: String
    Description: >
      (Optional) AWS Organizations ID (format: o-xxxxxxxxxx).
      When provided, the AssumeRole permissions for CollectApiCallMetrics and CollectIAM
      Lambda execution roles are restricted to accounts within this Organisation only
      (via aws:ResourceOrgID condition). This is the recommended security practice.
      Leave empty to fall back to ARN-scoped wildcard (arn:aws:iam::*:role/<name>).
    Default: ""

  # ── Metrics & Dashboard ───────────────────────────────────────────────────
  MetricsNamespace:
    Type: String
    Description: CloudWatch namespace for per-account activity metrics.
    Default: DormantAccountDetection

  SfnMetricsNamespace:
    Type: String
    Description: CloudWatch namespace for Step Functions execution health metrics.
    Default: DormantAccountDetectionSfn

  SfnAlertNamespace:
    Type: String
    Description: CloudWatch namespace for dimensionless dormancy alert metrics (watched by CloudWatch Alarms).
    Default: DormantAccountDetectionAlerts

  DashboardName:
    Type: String
    Description: Name of the CloudWatch Dashboard.
    Default: DormantAccountDetectionDashboard

  NotificationEmail:
    Type: String
    Description: >
      Email address to receive dormancy alert notifications via SNS.
      Leave empty to skip SNS topic and alarm creation (alarms are suppressed
      automatically when no email is provided, regardless of EnableDormancyAlarms).
    Default: ""

  EnableDormancyAlarms:
    Type: String
    Description: >
      Whether to create CloudWatch Alarms, SNS topics, and alert widgets for dormancy detection.
      Alarms require a valid NotificationEmail — if NotificationEmail is empty, alarms are
      suppressed automatically regardless of this setting.
      Set to "false" to deploy in metrics-only mode (dashboard without alerting infrastructure).
    AllowedValues:
      - "true"
      - "false"
    Default: "true"

  EnableCollectionFailureAlarm:
    Type: String
    Description: >
      Whether to create the partial-collection-failure CloudWatch Alarm. When enabled, an alarm
      fires immediately on any AccountsFailed >= 1 datapoint published by PublishMetrics. This is
      schedule-agnostic (Period: 60s, TreatMissingData: notBreaching) so it works correctly
      regardless of the ScheduleExpression cadence and notifies again on every run that has
      failed accounts.
      Requires EnableDormancyAlarms=true and a non-empty NotificationEmail. Has no effect otherwise.
    AllowedValues:
      - "true"
      - "false"
    Default: "true"

  EnableStateMachineFailureAlarm:
    Type: String
    Description: >
      Whether to create the State Machine failure CloudWatch Alarm. When enabled, an alarm fires
      on any AWS/States ExecutionsFailed + ExecutionsTimedOut + ExecutionsAborted datapoint for
      the DormantAccountDetection-MetricCollection state machine. This catches uncaught errors
      that prevent PublishMetrics from running (Lambda crash, KMS/IAM misconfiguration, malformed
      Map state, etc.). Schedule-agnostic and complements the partial-failure alarm.
      Requires EnableDormancyAlarms=true and a non-empty NotificationEmail. Has no effect otherwise.
    AllowedValues:
      - "true"
      - "false"
    Default: "true"

  EnableHeartbeatAlarm:
    Type: String
    Description: >
      Whether to create the collection heartbeat CloudWatch Alarm. When enabled, an alarm fires
      when no collection run has completed within HeartbeatWindowHours, for example because the
      EventBridge rule was disabled or every run failed before PublishMetrics. The alarm can
      go to ALARM shortly after the first deployment until the first run completes.
      Requires EnableDormancyAlarms=true and a non-empty NotificationEmail. Has no effect otherwise.
    AllowedValues:
      - "true"
      - "false"
    Default: "true"

  HeartbeatWindowHours:
    Type: Number
    Description: >
      Hours without a completed collection run before the heartbeat alarm fires. Keep this
      longer than the ScheduleExpression interval plus the run time; 26 suits the default
      daily schedule. The maximum is 168 hours (7 days), so disable the heartbeat alarm for
      schedules that run less often than about every 6 days. Default: 26.
    Default: 26
    MinValue: 2
    MaxValue: 168

  LogIamPrincipalNames:
    Type: String
    Description: >
      Whether CollectIAM writes the names of active IAM users, their active credential types,
      and active role names (including IAM Identity Center permission set roles) to its log
      group for each account. Default false: only counts are logged. Enable temporarily to
      troubleshoot a count; IAM user names are often personal data.
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  LogGroupKmsKeyType:
    Type: String
    Description: >
      AWS KMS key type for all CloudWatch Log Groups.
      CMK = customer managed key (the template creates one, or you provide an existing key ARN).
      AWSManaged = no AWS KMS key; CloudWatch Logs encrypts log data with its default
      server-side encryption (CloudWatch Logs has no AWS managed key).
      CMK is recommended for environments that require key policy control or key usage audit trails.
    AllowedValues:
      - CMK
      - AWSManaged
    Default: CMK

  LogGroupKmsKeyArn:
    Type: String
    Description: >
      (Optional, CMK mode only) ARN of an existing AWS KMS customer managed key to use for
      encrypting CloudWatch Log Groups. Leave empty to have the template create a customer managed key.
      Ignored when LogGroupKmsKeyType is AWSManaged.
    Default: ""

  EnableStateMachineEncryption:
    Type: String
    Description: >
      Encrypt the Step Functions state machine's execution history at rest with an
      AWS KMS customer managed key. When true (default), the state machine reuses the
      CloudWatch Log Group key (LogGroupKmsKey or the provided LogGroupKmsKeyArn),
      so execution input and output in execution history are encrypted with that key. Set to
      false to fall back to the AWS owned key (transparent server-side encryption). If
      LogGroupKmsKeyType is AWSManaged there is no customer managed key to reuse, so
      the state machine uses the AWS owned key regardless of this toggle.
    AllowedValues:
      - "true"
      - "false"
    Default: "true"

  StateMachineKmsDataKeyReusePeriodSeconds:
    Type: Number
    Description: >
      (CMK mode only) Maximum seconds Step Functions reuses a data key before
      calling AWS KMS GenerateDataKey again. Lower = more AWS KMS calls, smaller blast
      radius; higher = fewer AWS KMS calls. AWS allows 60-900.
    MinValue: 60
    MaxValue: 900
    Default: 300

  SnsKmsKeyType:
    Type: String
    Description: >
      AWS KMS key type for Amazon SNS topics (CriticalDormancyAlert and HighDormancyAlert).
      CMK = customer managed key (the template creates one, or you provide an existing key ARN).
      AWSManaged = use the AWS managed key for Amazon SNS (alias/aws/sns).
      CMK is recommended for environments that require key policy control or key usage audit trails.
    AllowedValues:
      - CMK
      - AWSManaged
    Default: CMK

  SnsKmsKeyArn:
    Type: String
    Description: >
      (Optional, CMK mode only) ARN of an existing AWS KMS customer managed key to use for
      encrypting Amazon SNS topics. Leave empty to have the template create a customer managed key.
      Ignored when SnsKmsKeyType is AWSManaged.
    Default: ""

  KmsKeyRotationPeriodDays:
    Type: Number
    Description: >
      Rotation period in days for all customer managed keys that the template creates.
      Applies only when the key type is CMK and no existing key ARN is provided.
      AWS requires a value between 90 and 2560 days. Default: 365 (annual rotation).
    Default: 365
    MinValue: 90
    MaxValue: 2560

  # ── Dormancy Score Weights (hybrid self-baselining model) ─────────────────
  # The score has two halves (weights must sum to 100):
  #   ABSOLUTE human-presence signals (baseline-free) — awarded all-or-nothing:
  #     DormancyWeightSSOPresence + DormancyWeightIAMUserPresence   (default 35+15 = 50)
  #   SELF-RELATIVE activity trend signals — awarded proportionally to the account's own
  #   trend ratio (mean of last trend-window days / mean of first trend-window days, capped
  #   at 1.0). Stable or growing activity earns full points; declining activity earns
  #   proportionally fewer. No absolute thresholds — each account is its own baseline:
  #     DormancyWeightApiCallTrend + DormancyWeightIAMRoleTrend
  #     + DormancyWeightCostTrend + DormancyWeightResourceCreatedTrend (default 20+10+10+10 = 50)
  # TotalResourceCount is intentionally NOT scored: standing inventory is not an activity
  # signal (an idle account can hold hundreds of resources indefinitely). It remains a
  # published metric for dashboard visibility only.
  DormancyWeightSSOPresence:
    Type: Number
    Description: Score points awarded when ActiveSSOUserCount > 0 (any non-admin human SSO login in the lookback window - strongest activity signal, absolute/baseline-free).
    Default: 35
    MinValue: 0

  DormancyWeightIAMUserPresence:
    Type: Number
    Description: Score points awarded when ActiveIAMUserCount > 0 (any IAM user credential activity in the lookback window - absolute/baseline-free).
    Default: 15
    MinValue: 0

  DormancyWeightApiCallTrend:
    Type: Number
    Description: >
      Maximum score points for the ApiCallCount self-relative trend. Points awarded =
      weight * trend ratio (mean of last trend-window days / mean of first trend-window
      days of the account's own ApiCallCount history, capped at 1.0). Stable or growing
      API activity earns the full weight; declining activity earns proportionally fewer points.
    Default: 20
    MinValue: 0

  DormancyWeightIAMRoleTrend:
    Type: Number
    Description: >
      Maximum score points for the ActiveIAMRoleCount self-relative trend. Points awarded =
      weight * trend ratio computed over the account's own role-count history (capped at 1.0).
    Default: 10
    MinValue: 0

  DormancyWeightCostTrend:
    Type: Number
    Description: >
      Maximum score points for the MonthlyCostUSD self-relative trend. Points awarded =
      weight * trend ratio computed over the account's own cost history (capped at 1.0).
      Replaces the previous flat CostChangeThresholdUSD rule, which triggered for 100% of
      accounts and had no discriminating power.
    Default: 10
    MinValue: 0

  DormancyWeightResourceCreatedTrend:
    Type: Number
    Description: >
      Maximum score points for the ResourceCreatedCount self-relative trend. Points awarded =
      weight * trend ratio computed over the account's own resource-creation history (capped at 1.0).
    Default: 10
    MinValue: 0

  # ── Dormancy Score Thresholds & Lookback Window ───────────────────────────
  LookbackDays:
    Type: Number
    Description: >
      Number of days to look back when evaluating activity signals (API calls, IAM activity,
      resource creation, and cost trend). All collection Lambda functions use this value.
      Changing this parameter affects the activity window for every collected signal.
      Default: 90 days.
    Default: 90
    MinValue: 1
    MaxValue: 365

  NewAccountGracePeriodDays:
    Type: Number
    Description: >
      Number of days after an account joins the AWS Organization during which it is EXCLUDED
      from dormancy scoring, to avoid false dormancy alerts on freshly-onboarded accounts that
      have not yet had time to accumulate activity. The account age is measured from the AWS
      Organizations JoinedTimestamp (the date the account became part of the organization).
      The grace period applies to all newly-joined accounts regardless of JoinedMethod
      (CREATED or INVITED). While an account is inside the grace window, raw activity signals
      (ApiCallCount, ActiveIAMUserCount, etc.) are STILL collected and published so the
      dashboard stays populated, but the DormancyScore and DormancyRating metrics are NOT
      published and the account does NOT count toward the CRITICAL/HIGH dormancy alert totals.
      Accounts whose JoinedTimestamp is unknown are evaluated normally (not skipped).
      Set to 0 to disable the grace period entirely (all accounts are scored — original behaviour).
      Default: 30 days.
    Default: 30
    MinValue: 0
    MaxValue: 365

  TrendWindowFraction:
    Type: Number
    Description: >
      Fraction of the LookbackDays window used for each of the leading and trailing comparison
      windows in the self-relative trend calculation. Trend ratio = mean(last N days) /
      mean(first N days) where N = max(1, round(TrendWindowFraction * LookbackDays)). Default 0.25
      (a quarter of a 90-day window = 22 days) smooths weekly activity cycles while still
      reacting to a genuine wind-down within one quarter of the window. Cold-start rule:
      an account needs at least 2*N daily datapoints before a trend is computed - below that
      the ratio is 1.0 (full points), so a fresh deployment or a newly onboarded account
      isn't flagged because of missing history. Accounts with a zero leading-window mean
      also receive 1.0 (no baseline to decline from); a neutral ratio contributes full weight, so
      the absolute human-presence signals add or withhold their 50 points and nothing pulls a
      non-declining account below 50 - this model detects decline, not sustained flat dormancy.

      FAULT-TOLERANCE WARNING - avoid values near the 0.5 maximum. A trend needs 2*N daily
      datapoints, and 2*N equals LookbackDays exactly at fraction 0.5 (2 * round(0.5 * 90) = 90
      for the default 90-day window), so the trend half needs essentially a full window's worth of
      daily datapoints - leaving NO usable margin. A healthy window supplies only about that many
      in practice (the current day's value is fetched before it is published, and CloudWatch aligns
      the daily buckets to UTC midnight), so even under perfect collection the trend half sits right
      at 2*N - the strict < 2*N guard leaves it just scored, with zero margin - and the leading-edge
      alignment may drop it one below. Either way, the first missed or failed daily collection then
      forces ALL FOUR trend ratios to the neutral 1.0 at once. Every
      account then earns the full 50 trend points and scoring collapses to presence-only: 50 for
      an account with no human presence, up to 100 for a fully attended one. With the default
      weights that 50-point floor lands in MEDIUM, so nothing can reach HIGH or CRITICAL (this is
      weight-dependent - a deployment that weights human presence more heavily than the four trends
      could lower that floor into CRITICAL/HIGH). A gap from a missed collection is bounded, not
      permanent: the window is "now minus LookbackDays", so that gap scrolls out on its own
      within up to LookbackDays (~90 days), but the zero-margin edge at exactly 0.5 recurs on every
      run - a mature account sits at 2*N on every run, one miss from neutral. Fault tolerance
      shrinks as the fraction rises - the 0.25 default needs 44 of ~90 datapoints and
      tolerates ~46 missing days; 0.4 needs 72 and tolerates ~18; above ~0.45 little margin
      remains. Prefer <= 0.4 unless daily collection is highly reliable. (Trend windows slice by
      datapoint COUNT, not calendar days, so a gap also shifts which calendar days each window
      covers; a hard per-account collection failure publishes only CollectionFailed=1 and skips
      that day's raw signals, opening exactly this gap for that account alone.)
    Default: 0.25
    MinValue: 0.05
    MaxValue: 0.5

  # ── Dormancy Rating Band Boundaries ───────────────────────────────────────
  # The 0-100 DormancyScore is bucketed into a 1-5 DormancyRating using four
  # upper-bound score thresholds. Higher score = more active. The bands are a
  # single contiguous scale and MUST be strictly increasing:
  #   CriticalDormancyMaxScore < HighDormancyMaxScore < MediumDormancyMaxScore < LowDormancyMaxScore
  # (CloudFormation Rules cannot perform numeric comparisons, so this ordering
  #  is not validated at deploy time. If the values aren't increasing, the cascading rating
  #  logic leaves some bands empty.)
  #
  #   score <= CriticalDormancyMaxScore               -> 1 CRITICAL
  #   CriticalDormancyMaxScore < score <= High...     -> 2 HIGH
  #   High... < score <= Medium...                    -> 3 MEDIUM
  #   Medium... < score <= Low...                     -> 4 LOW
  #   score > LowDormancyMaxScore                      -> 5 ACTIVE
  CriticalDormancyMaxScore:
    Type: Number
    Description: >
      Upper bound (inclusive) of the CRITICAL rating band. Accounts with a DormancyScore
      less than or equal to this value are rated CRITICAL (1) — strongest dormancy candidates.
      Must be less than HighDormancyMaxScore. Default: 20.
    Default: 20
    MinValue: 0
    MaxValue: 99

  HighDormancyMaxScore:
    Type: Number
    Description: >
      Upper bound (inclusive) of the HIGH rating band. Accounts with a DormancyScore greater
      than CriticalDormancyMaxScore and less than or equal to this value are rated HIGH (2).
      Must be greater than CriticalDormancyMaxScore and less than MediumDormancyMaxScore. Default: 40.
    Default: 40
    MinValue: 1
    MaxValue: 99

  MediumDormancyMaxScore:
    Type: Number
    Description: >
      Upper bound (inclusive) of the MEDIUM rating band. Accounts with a DormancyScore greater
      than HighDormancyMaxScore and less than or equal to this value are rated MEDIUM (3).
      Must be greater than HighDormancyMaxScore and less than LowDormancyMaxScore. Default: 60.
    Default: 60
    MinValue: 2
    MaxValue: 99

  LowDormancyMaxScore:
    Type: Number
    Description: >
      Upper bound (inclusive) of the LOW rating band. Accounts with a DormancyScore greater
      than MediumDormancyMaxScore and less than or equal to this value are rated LOW (4).
      Accounts scoring above this value are rated ACTIVE (5). Must be greater than
      MediumDormancyMaxScore and less than 100 (so an ACTIVE band exists). Default: 80.
    Default: 80
    MinValue: 3
    MaxValue: 99

  AdminSSOPrefixes:
    Type: String
    Description: >
      Comma-separated list of SSO role name prefixes to treat as administrative or maintenance roles.
      Roles whose names start with any of these prefixes are EXCLUDED from ActiveSSOUserCount
      (and therefore from dormancy scoring) and are counted separately in a new
      ActiveAdminSSOUserCount metric. A dedicated dashboard widget shows admin/maintenance SSO
      role usage when this parameter is non-empty, providing clarity on whether only specific
      admins are logging in for routine maintenance versus actual user activity.
      Example: AWSReservedSSO_AWSAdministratorAccess,AWSReservedSSO_PlatformAdmin
      Leave empty (default) to disable this feature — all AWSReservedSSO_* roles are counted in
      ActiveSSOUserCount and no ActiveAdminSSOUserCount metric is published.
    Default: ""

  DormantAccountsWidgetMetricWindowDays:
    Type: Number
    Description: >
      Number of days the "Dormant Accounts (CRITICAL & HIGH)" custom-widget Lambda looks back
      when reading each account's per-account DormancyScore to build the table. Within this window
      the widget takes each account's most recent DAY that has DormancyScore data and uses that
      day's most dormant (lowest) score - the same resolution the dormancy notification uses, so the
      table and the email agree about an account. The widget lists every account whose resolved
      score is at or below the HIGH dormancy threshold (score <= HighDormancyMaxScore), classifying
      each as CRITICAL (score <= CriticalDormancyMaxScore) or HIGH. Increase this value if the
      metric collection schedule (ScheduleExpression) runs less frequently than every few days,
      otherwise the widget may not find a recent datapoint for some accounts and will omit them
      from the table. Default: 14.
    Default: 14
    MinValue: 1
    MaxValue: 90

  PriorRatingWindowDays:
    Type: Number
    Description: >
      Number of days the PublishMetrics Lambda looks back for each account's PREVIOUS
      DormancyRating when deciding which accounts have newly crossed into CRITICAL or HIGH this
      run. Only accounts whose rating got WORSE than that previous value are named as newly
      flagged, so a steady set of dormant accounts stops re-notifying. An account with NO rating
      anywhere in this window is treated as having no prior and is NOT reported as new - this is
      what stops the first run after a deployment from emailing every already-dormant account.
      Keep this comfortably longer than your collection interval (ScheduleExpression) so a single
      skipped or failed run does not look like a fresh crossing: 3 days suits the default daily
      schedule, and a weekly schedule wants at least 14. Default: 3.
    Default: 3
    MinValue: 1
    MaxValue: 90

# ────────────────────────────────────────────────────────────────────────────
# Rules
# ────────────────────────────────────────────────────────────────────────────
Rules:
  # Ensure the stack is deployed in the account it is intended to monitor.
  # Deploying in a different account breaks all IAM role ARN references.
  DashboardAccountMatchesCurrentAccount:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref DashboardAccountId, ""]
          - !Equals [!Ref DashboardAccountId, !Ref AWS::AccountId]
        AssertDescription: >
          DashboardAccountId must be empty or match the AWS account where this stack is deployed.
          Deploying in a different account will break all cross-account IAM trust relationships.

  # At least one of TargetOuIds or TargetAccountIds must be non-empty.
  # If both are empty ("[]"), GetAccounts returns zero accounts and the execution
  # succeeds silently without collecting any metrics.
  AtLeastOneTargetRequired:
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref TargetOuIds, "[]"]]
          - !Not [!Equals [!Ref TargetAccountIds, "[]"]]
        AssertDescription: >
          At least one of TargetOuIds or TargetAccountIds must be provided.
          Both cannot be empty arrays simultaneously.

# ────────────────────────────────────────────────────────────────────────────
# Conditions
# ────────────────────────────────────────────────────────────────────────────
Conditions:
  # Alarm enablement: alarms are created only when explicitly enabled AND email is provided
  CreateAlarms: !And
    - !Equals [!Ref EnableDormancyAlarms, "true"]
    - !Not [!Equals [!Ref NotificationEmail, ""]]
  # Per-alarm toggles. Both gated on CreateAlarms so a missing NotificationEmail still suppresses them.
  CreateCollectionFailureAlarm: !And
    - !Condition CreateAlarms
    - !Equals [!Ref EnableCollectionFailureAlarm, "true"]
  CreateStateMachineFailureAlarm: !And
    - !Condition CreateAlarms
    - !Equals [!Ref EnableStateMachineFailureAlarm, "true"]
  CreateHeartbeatAlarm: !And
    - !Condition CreateAlarms
    - !Equals [!Ref EnableHeartbeatAlarm, "true"]
  # LogGroup KMS conditions
  LogGroupUseCmk: !Equals [!Ref LogGroupKmsKeyType, "CMK"]
  CreateLogGroupKmsKey: !And
    - !Equals [!Ref LogGroupKmsKeyType, "CMK"]
    - !Equals [!Ref LogGroupKmsKeyArn, ""]
  # State Machine encryption conditions. CMK encryption requires BOTH the toggle on
  # AND a LogGroup CMK to reuse (we do not create a second key). If logs use the AWS
  # managed key there is no CMK to point the state machine at, so it falls back to the
  # AWS-owned key even when the toggle is true.
  SfnUseCmk: !And
    - !Equals [!Ref EnableStateMachineEncryption, "true"]
    - !Equals [!Ref LogGroupKmsKeyType, "CMK"]
  # OrganizationId condition — restricts AssumeRole to within-org accounts when provided
  HasOrganizationId: !Not [!Equals [!Ref OrganizationId, ""]]
  # ExternalId condition — passes sts:ExternalId in assume_role calls when provided
  HasExternalId: !Not [!Equals [!Ref ExternalId, ""]]
  # Empty ConfigAggregatorRoleName falls back to CrossAccountRoleName (same rule as the CollectConfig code)
  HasConfigAggregatorRoleName: !Not [!Equals [!Ref ConfigAggregatorRoleName, ""]]
  # SNS KMS conditions — only needed when alarms (and therefore SNS topics) are created
  SnsUseCmk: !Equals [!Ref SnsKmsKeyType, "CMK"]
  CreateSnsKmsKey: !And
    - !Equals [!Ref SnsKmsKeyType, "CMK"]
    - !Equals [!Ref SnsKmsKeyArn, ""]
    - !Equals [!Ref EnableDormancyAlarms, "true"]
    - !Not [!Equals [!Ref NotificationEmail, ""]]
  # Alarms enabled AND SNS encrypted with a CMK. Needed by the PublishMetricsManagedPolicy, which
  # is NOT itself gated on CreateAlarms (the PublishMetrics Lambda always exists, alarms or not):
  # with alarms off there is no SNS CMK to name, because CreateSnsKmsKey also requires alarms to
  # be enabled, so the KMS statement has to be gated on this combined condition instead.
  AlarmsUseSnsCmk: !And
    - !Condition CreateAlarms
    - !Condition SnsUseCmk
  # AdminSSOPrefixes condition — separates admin/maintenance SSO roles from regular SSO users
  # when one or more prefixes are provided. Enables the AdminSSOUserCount metric and dashboard widget.
  HasAdminSSOPrefixes: !Not [!Equals [!Ref AdminSSOPrefixes, ""]]

# ────────────────────────────────────────────────────────────────────────────
# Resources
# ────────────────────────────────────────────────────────────────────────────
Resources:

  # ── KMS Key for CloudWatch Log Group Encryption ────────────────────────────
  LogGroupKmsKey:
    Type: AWS::KMS::Key
    Condition: CreateLogGroupKmsKey
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: "AwsSolutions-KMS5"
            reason: >
              FALSE POSITIVE: EnableKeyRotation is explicitly set to true and
              RotationPeriodInDays is configured via the KmsKeyRotationPeriodDays parameter.
              cdk-nag cannot resolve nested !And CloudFormation conditions (CreateLogGroupKmsKey)
              when scanning raw YAML outside a CDK app context, so it evaluates the resource
              as if rotation is disabled. Key rotation IS enabled.
    Properties:
      Description: >
        AWS KMS customer managed key for encrypting DormantAccountDetection CloudWatch Log Groups.
        Grants CloudWatch Logs service principal and the Lambda execution role access.
      EnableKeyRotation: true
      RotationPeriodInDays: !Ref KmsKeyRotationPeriodDays
      MultiRegion: false
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Key administrators statement (MF-6). Delegates key management to IAM in this
          # account, so only principals whose IAM policies allow these actions can manage
          # the key. Management only: no cryptographic operations. kms:Put* (PutKeyPolicy)
          # is kept so the policy stays updatable and passes the AWS KMS lockout safety check.
          # Action list follows the AWS KMS default key administrators statement:
          # https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
          - Sid: AllowKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:RotateKeyOnDemand
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
          # Key users statement (MF-6). Delegates cryptographic use to IAM in this account,
          # limited to callers from this account. The solution's roles get use rights only
          # through their customer managed IAM policies, each scoped to this key's ARN.
          - Sid: AllowKeyUsage
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
          # Allow CloudWatch Logs to use the key for log group encryption
          # The aws:SourceAccount condition prevents cross-account abuse (confused deputy)
          - Sid: AllowCloudWatchLogsEncryption
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn:
                  !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
          # Allow Step Functions to use the key for state-machine execution-history
          # encryption (T5). Scoped by kms:ViaService to the states service in this
          # region and by the state-machine ARN encryption context, so the grant cannot
          # be used to decrypt anything other than this solution's execution data.
          - Sid: AllowStepFunctionsExecutionEncryption
            Effect: Allow
            Principal:
              Service: !Sub "states.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "states.${AWS::Region}.amazonaws.com"
                aws:SourceAccount: !Ref "AWS::AccountId"
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  LogGroupKmsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateLogGroupKmsKey
    Properties:
      AliasName: alias/DormantAccountDetection-LogGroupKey
      TargetKeyId: !Ref LogGroupKmsKey

  # ── CloudWatch Log Groups (Lambda) ─────────────────────────────────────────
  LogGroupGetAccounts:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/DormantAccountDetection-GetAccounts
      RetentionInDays: !Ref LogGroupRetentionDays
      KmsKeyId: !If
        - LogGroupUseCmk
        - !If
          - CreateLogGroupKmsKey
          - !GetAtt LogGroupKmsKey.Arn
          - !Ref LogGroupKmsKeyArn
        - !Ref AWS::NoValue
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  LogGroupCollectApiCallMetrics:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/DormantAccountDetection-CollectApiCallMetrics
      RetentionInDays: !Ref LogGroupRetentionDays
      KmsKeyId: !If
        - LogGroupUseCmk
        - !If
          - CreateLogGroupKmsKey
          - !GetAtt LogGroupKmsKey.Arn
          - !Ref LogGroupKmsKeyArn
        - !Ref AWS::NoValue
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  LogGroupCollectIAM:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/DormantAccountDetection-CollectIAM
      RetentionInDays: !Ref LogGroupRetentionDays
      KmsKeyId: !If
        - LogGroupUseCmk
        - !If
          - CreateLogGroupKmsKey
          - !GetAtt LogGroupKmsKey.Arn
          - !Ref LogGroupKmsKeyArn
        - !Ref AWS::NoValue
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  LogGroupCollectConfig:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/DormantAccountDetection-CollectConfig
      RetentionInDays: !Ref LogGroupRetentionDays
      KmsKeyId: !If
        - LogGroupUseCmk
        - !If
          - CreateLogGroupKmsKey
          - !GetAtt LogGroupKmsKey.Arn
          - !Ref LogGroupKmsKeyArn
        - !Ref AWS::NoValue
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  LogGroupCollectCost:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/DormantAccountDetection-CollectCost
      RetentionInDays: !Ref LogGroupRetentionDays
      KmsKeyId: !If
        - LogGroupUseCmk
        - !If
          - CreateLogGroupKmsKey
          - !GetAtt LogGroupKmsKey.Arn
          - !Ref LogGroupKmsKeyArn
        - !Ref AWS::NoValue
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  LogGroupPublishMetrics:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/DormantAccountDetection-PublishMetrics
      RetentionInDays: !Ref LogGroupRetentionDays
      KmsKeyId: !If
        - LogGroupUseCmk
        - !If
          - CreateLogGroupKmsKey
          - !GetAtt LogGroupKmsKey.Arn
          - !Ref LogGroupKmsKeyArn
        - !Ref AWS::NoValue
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  LogGroupStepFunctions:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/states/DormantAccountDetection
      RetentionInDays: !Ref LogGroupRetentionDays
      KmsKeyId: !If
        - LogGroupUseCmk
        - !If
          - CreateLogGroupKmsKey
          - !GetAtt LogGroupKmsKey.Arn
          - !Ref LogGroupKmsKeyArn
        - !Ref AWS::NoValue
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }


  # ── Function-Specific Customer Managed Policies (Least Privilege) ──────────
  # Each Lambda function has its own managed policy scoped to only the permissions
  # it needs. Customer managed policies (not inline) allow independent versioning,
  # reuse auditing, and compliance scanning outside the role context.

  GetAccountsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: >
              cloudwatch:PutMetricData requires Resource:* — no resource-level permission
              support per AWS Service Authorization Reference. sts:AssumeRole is scoped to
              a specific management account role ARN and is not a wildcard.
    Properties:
      ManagedPolicyName: DormantAccountDetection-GetAccounts-Policy
      Description: Allows GetAccounts Lambda to assume the cross-account role in the Management account and write CloudWatch Logs. Scoped to the Management account role ARN only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeManagementAccountRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Sub "arn:aws:iam::${ManagementAccountId}:role/${CrossAccountRoleName}"
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-GetAccounts"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-GetAccounts:*"

  CollectApiCallMetricsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: >
              sts:AssumeRole uses arn:aws:iam::*:role/<name> — wildcard account ID is
              intentional for cross-account monitoring across all Organisation member
              accounts, scoped to a specific role name. When OrganizationId is provided,
              the aws:ResourceOrgID condition further restricts the scope to within-org
              accounts only. ec2:DescribeRegions does not support resource-level
              permissions, so Resource: "*" is the only valid value.
    Properties:
      ManagedPolicyName: DormantAccountDetection-CollectApiCallMetrics-Policy
      Description: Allows CollectApiCallMetrics Lambda to assume the cross-account role in target member accounts and write CloudWatch Logs.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeRoleInMemberAccounts
            Effect: Allow
            Action: sts:AssumeRole
            # When OrganizationId is provided, restrict AssumeRole to accounts within
            # the Organisation only (aws:ResourceOrgID condition). Otherwise fall back to
            # ARN-scoped wildcard scoped to the specific role name.
            Resource: !Sub "arn:aws:iam::*:role/${CrossAccountRoleName}"
            Condition: !If
              - HasOrganizationId
              - StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
              - !Ref AWS::NoValue
          # With TargetRegions empty (the default) the function collects from every Region
          # enabled in this account. ec2:DescribeRegions has no resource-level permissions.
          - Sid: ListEnabledRegions
            Effect: Allow
            Action: ec2:DescribeRegions
            Resource: "*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-CollectApiCallMetrics"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-CollectApiCallMetrics:*"

  CollectIAMManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: >
              sts:AssumeRole uses arn:aws:iam::*:role/<name> — wildcard account ID is
              intentional for cross-account monitoring across all Organisation member
              accounts, scoped to a specific role name. When OrganizationId is provided,
              the aws:ResourceOrgID condition further restricts the scope to within-org
              accounts only.
    Properties:
      ManagedPolicyName: DormantAccountDetection-CollectIAM-Policy
      Description: Allows CollectIAM Lambda to assume the cross-account role in target member accounts and write CloudWatch Logs.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeRoleInMemberAccounts
            Effect: Allow
            Action: sts:AssumeRole
            # When OrganizationId is provided, restrict AssumeRole to accounts within
            # the Organisation only (aws:ResourceOrgID condition). Otherwise fall back to
            # ARN-scoped wildcard scoped to the specific role name.
            Resource: !Sub "arn:aws:iam::*:role/${CrossAccountRoleName}"
            Condition: !If
              - HasOrganizationId
              - StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
              - !Ref AWS::NoValue
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-CollectIAM"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-CollectIAM:*"

  CollectConfigManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: DormantAccountDetection-CollectConfig-Policy
      Description: Allows CollectConfig Lambda to assume the cross-account role in the Config Aggregator account and write CloudWatch Logs. Scoped to the specific Config Aggregator account role ARN.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeConfigAggregatorAccountRole
            Effect: Allow
            Action: sts:AssumeRole
            # Uses ConfigAggregatorRoleName (not CrossAccountRoleName) to support cases where
            # the Config Aggregator account is the same as the Management account or a target account,
            # which would cause a naming conflict if both roles shared the same name.
            Resource: !Sub
              - "arn:aws:iam::${ConfigAggregatorAccountId}:role/${RoleName}"
              - RoleName: !If [HasConfigAggregatorRoleName, !Ref ConfigAggregatorRoleName, !Ref CrossAccountRoleName]
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-CollectConfig"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-CollectConfig:*"

  CollectCostManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: DormantAccountDetection-CollectCost-Policy
      Description: Allows CollectCost Lambda to assume the cross-account role in the Management account and write CloudWatch Logs. Scoped to the Management account role ARN only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeManagementAccountRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Sub "arn:aws:iam::${ManagementAccountId}:role/${CrossAccountRoleName}"
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-CollectCost"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-CollectCost:*"

  PublishMetricsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: >
              cloudwatch:PutMetricData, GetMetricData, GetMetricStatistics, and ListMetrics
              require Resource:* — no resource-level permission support per the AWS Service
              Authorization Reference. PutMetricData is further restricted via the
              cloudwatch:namespace condition key to the three solution-specific namespaces.
              sns:Publish is scoped to the two specific dormancy topic ARNs, and KMS actions
              (only present when SNS CMK encryption is used) are scoped to the specific SNS
              CMK ARN.
    Properties:
      ManagedPolicyName: DormantAccountDetection-PublishMetrics-Policy
      # DO NOT EDIT this Description on an already-deployed stack. AWS::IAM::ManagedPolicy
      # Description is CREATE-ONLY (IAM has no API to update a policy description), so changing
      # it forces CloudFormation to REPLACE the policy. Because ManagedPolicyName is set
      # explicitly, the replacement tries to create the new policy before deleting the old one
      # and fails with "A policy called DormantAccountDetection-PublishMetrics-Policy already
      # exists. Duplicate names are not allowed." (409 AlreadyExists), taking the stack into
      # UPDATE_FAILED. The dormancy-notification grant below was added WITHOUT touching this
      # line for exactly that reason: PolicyDocument updates in place via CreatePolicyVersion.
      # What the policy allows is documented in the cfn_nag reason above and at each statement.
      Description: Allows PublishMetrics Lambda to write and read CloudWatch metrics within the dashboard account and write CloudWatch Logs. No cross-account AssumeRole required.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishCloudWatchMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace:
                  - !Ref MetricsNamespace
                  - !Ref SfnMetricsNamespace
                  - !Ref SfnAlertNamespace
          - Sid: ReadCloudWatchMetrics
            Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
            Resource: "*"
          # Dormancy notification grant. PublishMetrics is the sole publisher of the dormancy
          # notification: it holds the flagged set in memory and emails the accounts that newly
          # crossed into a band, so nothing re-derives that list from CloudWatch.
          #
          # Both topic policies allow sns:Publish for the account root, and the SnsKmsKey key
          # policy below delegates key use to IAM in this account (AllowKeyUsage statement);
          # that delegation is what makes these
          # IAM statements alone sufficient - no SNS topic-policy and no KMS key-policy edit is
          # required in the template-created-CMK path. An operator-supplied SnsKmsKeyArn must
          # delegate to IAM the same way, or SNS publish fails with KMSAccessDenied. The topics'
          # DenyNonSslPublish statement only denies when aws:SecureTransport=false, and boto3
          # uses HTTPS.
          #
          # This policy is NOT gated on CreateAlarms (the PublishMetrics Lambda always exists),
          # so each statement below is gated individually and drops out via AWS::NoValue when the
          # topics and CMK are absent.
          - !If
            - CreateAlarms
            - Sid: PublishDormancyNotifications
              Effect: Allow
              Action: sns:Publish
              Resource:
                - !Ref CriticalDormancyTopic
                - !Ref HighDormancyTopic
            - !Ref AWS::NoValue
          # KICS "IAM policy allows for data exfiltration" flags ssm:GetParametersByPath whatever
          # the Resource. The grant is limited to this solution's account-name registry path, the
          # parameters are String values holding account names (already published as the
          # AccountName metric dimension), and the role has no kms:Decrypt for SSM. See SECURITY.md.
          # Keep the blank line: KICS only honors the directive as a comment group of its own.

          # kics-scan ignore-block
          - Sid: AccountNameRegistry
            Effect: Allow
            Action:
              - ssm:GetParametersByPath
              - ssm:PutParameter
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/DormantAccountDetection/AccountNames"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/DormantAccountDetection/AccountNames/*"
          - !If
            - AlarmsUseSnsCmk
            - Sid: UseSnsCmkForPublish
              Effect: Allow
              Action:
                - kms:GenerateDataKey*
                - kms:Decrypt
              Resource: !If [CreateSnsKmsKey, !GetAtt SnsKmsKey.Arn, !Ref SnsKmsKeyArn]
            - !Ref AWS::NoValue
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-PublishMetrics"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/DormantAccountDetection-PublishMetrics:*"

  StepFunctionsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W13
            reason: >
              CloudWatch Logs delivery actions (logs:CreateLogDelivery, GetLogDelivery,
              UpdateLogDelivery, DeleteLogDelivery, ListLogDeliveries, PutResourcePolicy,
              DescribeResourcePolicies, DescribeLogGroups) required for Step Functions
              execution logging do not support resource-level permissions per AWS Service
              Authorization Reference — Resource:* is the only valid value. Lambda function
              ARNs are explicitly listed for InvokeFunction with :* versions for qualified ARNs.
    Properties:
      ManagedPolicyName: DormantAccountDetection-StepFunctions-Policy
      Description: Allows the Step Functions state machine to invoke all 6 Lambda functions and deliver execution logs to CloudWatch Logs.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Invoke all 6 Lambda functions (direct ARN and qualified :* versions)
          - Sid: InvokeLambdaFunctions
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
              - !GetAtt GetAccountsFn.Arn
              - !GetAtt CollectApiCallMetricsFn.Arn
              - !GetAtt CollectIAMFn.Arn
              - !GetAtt CollectConfigFn.Arn
              - !GetAtt CollectCostFn.Arn
              - !GetAtt PublishMetricsFn.Arn
              - !Sub "${GetAccountsFn.Arn}:*"
              - !Sub "${CollectApiCallMetricsFn.Arn}:*"
              - !Sub "${CollectIAMFn.Arn}:*"
              - !Sub "${CollectConfigFn.Arn}:*"
              - !Sub "${CollectCostFn.Arn}:*"
              - !Sub "${PublishMetricsFn.Arn}:*"
          # CloudWatch Logs delivery for Step Functions execution logs
          - Sid: CloudWatchLogsDelivery
            Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: "*"
          # KMS access for state-machine execution-history encryption (T5). Only present
          # when the state machine uses a CMK (SfnUseCmk). The Step Functions role calls
          # kms:GenerateDataKey/Decrypt DIRECTLY (not via the states service) when starting
          # and reading encrypted executions, so this identity-based statement must NOT carry
          # a kms:ViaService condition — that condition belongs on the key-policy service grant.
          # Scoped to the single reused LogGroup CMK ARN.
          - !If
            - SfnUseCmk
            - Sid: StateMachineKmsEncryption
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
                - kms:DescribeKey
              Resource: !If
                - CreateLogGroupKmsKey
                - !GetAtt LogGroupKmsKey.Arn
                - !Ref LogGroupKmsKeyArn
            - !Ref "AWS::NoValue"

  EventBridgeManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: DormantAccountDetection-EventBridge-Policy
      Description: Allows EventBridge to start the DormantAccountDetection Step Functions state machine. Scoped to the specific state machine ARN.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartStateMachineExecution
            Effect: Allow
            Action: states:StartExecution
            # Scoped to the specific state machine ARN via !Ref StateMachine.
            # cdk-nag cannot resolve !Ref in raw CloudFormation YAML outside a CDK context,
            # causing a false positive wildcard finding — suppressed via AwsSolutions-IAM5.
            Resource: !Ref StateMachine

  # ── Function-Specific IAM Roles (Least Privilege) ─────────────────────────
  # Each Lambda function has its own role scoped to only the permissions it needs.
  # This reduces blast radius: a compromised function cannot access resources
  # or accounts that other functions use.

  # Role 1: GetAccounts — needs Organizations API in Management account only
  GetAccountsRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >
              Explicit role name is required for cross-account trust chain integrity.
              The management-account-monitoring-role.yaml trust policy references this role
              by a fixed ARN (arn:aws:iam::<DashboardAccountId>:role/DormantAccountDetection-GetAccounts-Role).
              Auto-generated names would break the trust relationship.
      cdk_nag:
        rules_to_suppress:
          - id: "AwsSolutions-IAM4"
            reason: >
              All permissions are fully custom customer managed policies. No AWS managed
              policies are attached. cdk-nag IAM4 fires incorrectly on raw CloudFormation
              YAML without CDK constructs.
          - id: "AwsSolutions-IAM5"
            reason: >
              sts:AssumeRole is scoped to the specific Management account role ARN —
              no wildcard. Logs actions are scoped to the specific log group ARN pattern.
              See GetAccountsManagedPolicy cfn_nag W13 for detailed justification.
    Properties:
      RoleName: DormantAccountDetection-GetAccounts-Role
      Description: Execution role for GetAccounts Lambda. Assumes cross-account role in the Management account only to call AWS Organizations API.
