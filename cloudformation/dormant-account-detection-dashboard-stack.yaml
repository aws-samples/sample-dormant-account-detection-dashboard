  # ── Common Lambda Environment Variables (referenced in each function) ──────
  # NOTE: CloudFormation does not support shared env blocks — each function
  # specifies its environment variables individually using !Ref/!Sub.

  # ── Lambda Functions ───────────────────────────────────────────────────────
  GetAccountsFn:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_117"
            comment: >
              Lambda functions call only public AWS API endpoints (Organizations, Config,
              CloudWatch, IAM, STS, Cost Explorer). VPC placement would require NAT Gateways
              or multiple VPC Interface Endpoints adding significant cost with no security
              benefit. Cross-account access is controlled exclusively by IAM role trust policies.
          - id: "CKV_AWS_116"
            comment: >
              All Lambda functions are invoked SYNCHRONOUSLY by Step Functions using the
              arn:aws:states:::lambda:invoke integration. DLQs only capture asynchronous
              Lambda failures. Synchronous failures are returned directly to Step Functions
              and handled by the state machine Retry/Catch configuration. A DLQ here would
              never receive any events.
          - id: "CKV_AWS_173"
            comment: >
              Environment variables hold only the operational configuration this function reads
              (account IDs, role names, namespaces, scoring settings) plus EXTERNAL_ID, the
              sts:AssumeRole external ID used for confused-deputy protection. AWS IAM does not
              treat the external ID as a secret
              (https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html):
              it is visible in the role trust policy and in AWS CloudTrail, and its value comes
              from the account boundary, not from confidentiality. Values are encrypted at rest
              with the AWS managed key for AWS Lambda; read access is limited to principals with
              lambda:GetFunctionConfiguration. A customer managed key would add a second access
              check, which is not needed for values that are not secrets. No passwords, API keys,
              access keys, or email addresses are stored in environment variables.
          - id: "CKV_AWS_50"
            comment: >
              X-Ray tracing is intentionally disabled. This is a scheduled batch monitoring
              solution (daily 2:00 AM UTC) with Step Functions Retry/Catch error handling.
              X-Ray adds cost with no operational benefit for non-latency-sensitive background
              jobs. Health is monitored via CloudWatch Logs and custom Step Functions metrics
              (ExecutionDurationSeconds, MetricCollectionSuccess/Failure).
      cdk_nag:
        rules_to_suppress:
          - id: "AwsSolutions-L2"
            reason: >
              X-Ray tracing is intentionally disabled (TracingConfig: Mode: PassThrough).
              This is a scheduled batch monitoring solution (daily 2:00 AM UTC) with Step
              Functions Retry/Catch error handling. X-Ray adds cost with no operational
              benefit for non-latency-sensitive background jobs. Execution health is monitored
              via CloudWatch Logs and custom Step Functions metrics.
    DependsOn: [LogGroupGetAccounts]
    Properties:
      FunctionName: DormantAccountDetection-GetAccounts
      Description: Resolves target accounts from OU IDs and individual account IDs via AWS Organizations.
      Runtime: python3.14
      Handler: index.handler
      MemorySize: !Ref LambdaMemoryMB
      Timeout: 180
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      Role: !GetAtt GetAccountsRole.Arn
      TracingConfig:
        Mode: PassThrough  # X-Ray intentionally disabled: scheduled batch job with SFN Retry/Catch error handling. Suppressed: CKV_AWS_50/AwsSolutions-L2
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: /aws/lambda/DormantAccountDetection-GetAccounts
      Code:
        ZipFile: |
          ########################################################################################################
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0
          ########################################################################################################
          """
          GetAccounts Lambda (Python)

          Resolves target accounts from AWS Organizations:
          1. Recursively fetch all accounts under specified OU IDs
          2. Merge individually specified account IDs
          3. Remove duplicates, apply exclusion list
          4. Filter to ACTIVE accounts only

          Config is loaded from Lambda environment variables.
          All log output is structured JSON for CloudWatch Logs Insights queries.
          """
          import json
          import logging
          import os
          import sys
          import boto3
          from datetime import datetime, timezone

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)


          def log(level, event, message, **fields):
              """Emit a structured JSON log line via the logging module."""
              record = {
                  "event": event,
                  "message": message,
              }
              record.update(fields)
              getattr(logger, level.lower(), logger.info)(json.dumps(record))


          def load_config():
              return {
                  "targetOuIds": json.loads(os.environ.get("TARGET_OU_IDS", "[]")),
                  "targetAccountIds": json.loads(os.environ.get("TARGET_ACCOUNT_IDS", "[]")),
                  "excludedAccountIds": json.loads(os.environ.get("EXCLUDED_ACCOUNT_IDS", "[]")),
                  "managementAccountId": os.environ["MANAGEMENT_ACCOUNT_ID"],
                  "configAggregatorAccountId": os.environ["CONFIG_AGGREGATOR_ACCOUNT_ID"],
                  "dashboardAccountId": os.environ["DASHBOARD_ACCOUNT_ID"],
                  "configAggregatorName": os.environ["CONFIG_AGGREGATOR_NAME"],
                  "crossAccountRoleName": os.environ["CROSS_ACCOUNT_ROLE_NAME"],
                  "metricsNamespace": os.environ["METRICS_NAMESPACE"],
                  "sfnMetricsNamespace": os.environ["SFN_METRICS_NAMESPACE"],
                  "sfnAlertNamespace": os.environ.get("SFN_ALERT_NAMESPACE", "DormantAccountDetectionAlerts"),
                  "dashboardName": os.environ.get("DASHBOARD_NAME", "DormantAccountDetectionDashboard"),
                  "scheduleExpression": os.environ.get("SCHEDULE_EXPRESSION", "cron(0 2 * * ? *)"),
                  "lambdaMemoryMB": int(os.environ.get("LAMBDA_MEMORY_MB", "512")),
                  "mapConcurrency": int(os.environ.get("MAP_CONCURRENCY", "10")),
                  "iamMapConcurrency": int(os.environ.get("IAM_MAP_CONCURRENCY", "10")),
                  # notificationEmail and externalId are intentionally NOT part of config: config is
                  # the Step Functions payload and lands in execution history. Functions read both
                  # from their own environment variables instead.
                  # Hybrid self-baselining dormancy score weights (sum = 100 by default):
                  #   ssoPresence / iamUserPresence — ABSOLUTE human-presence signals, awarded
                  #     all-or-nothing when the latest collected count is > 0.
                  #   apiCallTrend / iamRoleTrend / costTrend / resourceCreatedTrend — SELF-RELATIVE
                  #     trend signals, awarded proportionally to the account's own trend ratio
                  #     (mean of last N days / mean of first N days of its own metric history,
                  #     capped at 1.0). No absolute thresholds — each account is its own baseline.
                  # TotalResourceCount is intentionally NOT scored (standing inventory, not activity).
                  "dormancyScoreWeights": {
                      "ssoPresence": int(os.environ.get("DORMANCY_WEIGHT_SSO_PRESENCE", "35")),
                      "iamUserPresence": int(os.environ.get("DORMANCY_WEIGHT_IAM_USER_PRESENCE", "15")),
                      "apiCallTrend": int(os.environ.get("DORMANCY_WEIGHT_API_CALL_TREND", "20")),
                      "iamRoleTrend": int(os.environ.get("DORMANCY_WEIGHT_IAM_ROLE_TREND", "10")),
                      "costTrend": int(os.environ.get("DORMANCY_WEIGHT_COST_TREND", "10")),
                      "resourceCreatedTrend": int(os.environ.get("DORMANCY_WEIGHT_RESOURCE_CREATED_TREND", "10")),
                  },
                  # Lookback window and trend configuration are serialized here so all downstream
                  # Lambdas (CollectApiCallMetrics, CollectIAM, CollectConfig, PublishMetrics)
                  # read them from the config dict — env vars serve as fallback only.
                  "lookbackDays": int(os.environ.get("LOOKBACK_DAYS", "90")),
                  # New-account grace period (days). Accounts whose AWS Organizations JoinedTimestamp
                  # is within this many days are excluded from dormancy scoring by PublishMetrics
                  # (raw signals are still collected). 0 disables the grace period.
                  "newAccountGracePeriodDays": int(os.environ.get("NEW_ACCOUNT_GRACE_PERIOD_DAYS", "30")),
                  # Fraction of LookbackDays used for each leading/trailing trend comparison window.
                  # N = max(1, round(trendWindowFraction * lookbackDays)). Trends need >= 2*N datapoints
                  # (cold-start rule: below that the ratio is 1.0 — never penalise missing history).
                  "trendWindowFraction": float(os.environ.get("TREND_WINDOW_FRACTION", "0.25")),
                  # Dormancy rating band upper bounds (inclusive). The 0-100 DormancyScore is
                  # bucketed into a 1-5 rating using these four thresholds. Serialized here so
                  # PublishMetrics reads them from the config dict — env vars are fallback only.
                  "dormancyRatingBands": {
                      "critical": int(os.environ.get("CRITICAL_DORMANCY_MAX_SCORE", "20")),
                      "high": int(os.environ.get("HIGH_DORMANCY_MAX_SCORE", "40")),
                      "medium": int(os.environ.get("MEDIUM_DORMANCY_MAX_SCORE", "60")),
                      "low": int(os.environ.get("LOW_DORMANCY_MAX_SCORE", "80")),
                  },
                  # Admin SSO prefixes — comma-separated list of AWSReservedSSO_* role name prefixes
                  # to treat as admin/maintenance roles, excluded from ActiveSSOUserCount and dormancy
                  # scoring. Counted separately in ActiveAdminSSOUserCount metric when non-empty.
                  "adminSSOPrefixes": os.environ.get("ADMIN_SSO_PREFIXES", ""),
              }


          def assume_role(role_arn, session_name, external_id=""):
              sts = boto3.client("sts")
              kwargs = {"RoleArn": role_arn, "RoleSessionName": session_name[:64]}
              if external_id:
                  kwargs["ExternalId"] = external_id
              resp = sts.assume_role(**kwargs)
              creds = resp["Credentials"]
              return {
                  "aws_access_key_id": creds["AccessKeyId"],
                  "aws_secret_access_key": creds["SecretAccessKey"],
                  "aws_session_token": creds["SessionToken"],
              }


          def map_org_account(account):
              return {
                  "accountId": account.get("Id", ""),
                  "accountName": account.get("Name", account.get("Id", "")),
                  # email intentionally omitted — account email is PII (AWS Organizations) and is
                  # not used by any downstream function. Excluding it keeps PII out of the Step
                  # Functions payload, execution history, and CloudWatch Logs (threat model T14).
                  # Prefer the newer Organizations "State" field; fall back to the legacy "Status"
                  # field, which AWS is retiring on 2026-09-09. The `or` chain is safe because both
                  # are non-empty enums when present, and it stays correct across the transition and
                  # regardless of whether the Lambda runtime's bundled boto3 yet populates "State".
                  "state": account.get("State") or account.get("Status") or "UNKNOWN",
                  "joinedTimestamp": account["JoinedTimestamp"].isoformat() if account.get("JoinedTimestamp") else None,
              }


          def collect_accounts_under_ou(org_client, parent_id, account_map):
              """Recursively collect all accounts under an OU."""
              paginator = org_client.get_paginator("list_accounts_for_parent")
              for page in paginator.paginate(ParentId=parent_id):
                  for account in page.get("Accounts", []):
                      acct_id = account.get("Id")
                      if acct_id and acct_id not in account_map:
                          account_map[acct_id] = map_org_account(account)

              ou_paginator = org_client.get_paginator("list_children")
              for page in ou_paginator.paginate(ParentId=parent_id, ChildType="ORGANIZATIONAL_UNIT"):
                  for child in page.get("Children", []):
                      if child.get("Id"):
                          collect_accounts_under_ou(org_client, child["Id"], account_map)


          def handler(event, context):
              config = load_config()
              collection_timestamp = datetime.now(timezone.utc).isoformat()

              log("INFO", "resolve_start", "Resolving accounts from AWS Organizations",
                  targetOuIds=config["targetOuIds"],
                  targetAccountIds=config["targetAccountIds"],
                  excludedAccountIds=config["excludedAccountIds"])

              role_arn = f"arn:aws:iam::{config['managementAccountId']}:role/{config['crossAccountRoleName']}"
              creds = assume_role(role_arn, "GetAccounts-OrgLookup", os.environ.get("EXTERNAL_ID", ""))
              org_client = boto3.client("organizations", **creds)

              account_map = {}
              excluded_set = set(config["excludedAccountIds"])

              for ou_id in config["targetOuIds"]:
                  log("INFO", "resolve_ou", "Resolving accounts under OU", ouId=ou_id)
                  collect_accounts_under_ou(org_client, ou_id, account_map)

              for account_id in config["targetAccountIds"]:
                  if account_id not in account_map:
                      try:
                          resp = org_client.describe_account(AccountId=account_id)
                          account_map[account_id] = map_org_account(resp["Account"])
                      except Exception as e:
                          log("ERROR", "describe_account_failed",
                              "Could not describe individually specified account",
                              accountId=account_id, error=str(e))
                          account_map[account_id] = {
                              "accountId": account_id,
                              "accountName": account_id,
                              "state": "UNKNOWN",
                          }

              for excluded_id in excluded_set:
                  account_map.pop(excluded_id, None)

              # The management account can't be collected: service-managed StackSets never deploy
              # the member role there, and the role named CrossAccountRoleName in that account
              # trusts only GetAccounts and CollectCost. Targeting the root (or an explicit
              # TargetAccountIds entry) would otherwise make CollectIAM and CollectApiCallMetrics
              # fail for it on every run.
              management_account_id = config["managementAccountId"]
              if account_map.pop(management_account_id, None) is not None:
                  log("INFO", "management_account_excluded",
                      "Management account removed from the target list (no member role)",
                      accountId=management_account_id)

              # Keep only ACTIVE accounts. Using the Organizations "State" field (see map_org_account)
              # this also drops PENDING_ACTIVATION (still provisioning) and CLOSED accounts in addition
              # to the SUSPENDED / PENDING_CLOSURE states the legacy "Status" field already excluded.
              accounts = [a for a in account_map.values() if a["state"] == "ACTIVE"]
              filtered_non_active = len(account_map) - len(accounts)

              log("INFO", "resolve_complete", "Account resolution complete",
                  resolvedCount=len(accounts),
                  excludedCount=len(excluded_set),
                  filteredNonActiveCount=filtered_non_active,
                  totalDiscovered=len(account_map) + len(excluded_set))

              return {
                  "accounts": accounts,
                  "config": config,
                  "collectionTimestamp": collection_timestamp,
              }
      Environment:
        Variables:
          TARGET_OU_IDS: !Ref TargetOuIds
          TARGET_ACCOUNT_IDS: !Ref TargetAccountIds
          EXCLUDED_ACCOUNT_IDS: !Ref ExcludedAccountIds
          MANAGEMENT_ACCOUNT_ID: !Ref ManagementAccountId
          CONFIG_AGGREGATOR_ACCOUNT_ID: !Ref ConfigAggregatorAccountId
          DASHBOARD_ACCOUNT_ID: !Ref AWS::AccountId
          CONFIG_AGGREGATOR_NAME: !Ref ConfigAggregatorName
          CROSS_ACCOUNT_ROLE_NAME: !Ref CrossAccountRoleName
          METRICS_NAMESPACE: !Ref MetricsNamespace
          SFN_METRICS_NAMESPACE: !Ref SfnMetricsNamespace
          SFN_ALERT_NAMESPACE: !Ref SfnAlertNamespace
          DASHBOARD_NAME: !Ref DashboardName
          SCHEDULE_EXPRESSION: !Ref ScheduleExpression
          LAMBDA_MEMORY_MB: !Sub "${LambdaMemoryMB}"
          MAP_CONCURRENCY: !Sub "${MapConcurrency}"
          IAM_MAP_CONCURRENCY: !Sub "${MapConcurrency}"
          # Hybrid self-baselining score weights — serialized into config dict for PublishMetrics.
          DORMANCY_WEIGHT_SSO_PRESENCE: !Sub "${DormancyWeightSSOPresence}"
          DORMANCY_WEIGHT_IAM_USER_PRESENCE: !Sub "${DormancyWeightIAMUserPresence}"
          DORMANCY_WEIGHT_API_CALL_TREND: !Sub "${DormancyWeightApiCallTrend}"
          DORMANCY_WEIGHT_IAM_ROLE_TREND: !Sub "${DormancyWeightIAMRoleTrend}"
          DORMANCY_WEIGHT_COST_TREND: !Sub "${DormancyWeightCostTrend}"
          DORMANCY_WEIGHT_RESOURCE_CREATED_TREND: !Sub "${DormancyWeightResourceCreatedTrend}"
          # Lookback & trend parameters — serialized into config dict for downstream Lambdas
          LOOKBACK_DAYS: !Sub "${LookbackDays}"
          # New-account grace period (days) — serialized into config dict; PublishMetrics uses it
          # to skip dormancy scoring for accounts within the grace window. 0 disables.
          NEW_ACCOUNT_GRACE_PERIOD_DAYS: !Sub "${NewAccountGracePeriodDays}"
          # Self-relative trend comparison window fraction (leading/trailing window
          # N = max(1, round(fraction * LookbackDays)); trends need >= 2*N daily datapoints).
          TREND_WINDOW_FRACTION: !Sub "${TrendWindowFraction}"
          # Dormancy rating band upper bounds — serialized into config dict for PublishMetrics.
          CRITICAL_DORMANCY_MAX_SCORE: !Sub "${CriticalDormancyMaxScore}"
          HIGH_DORMANCY_MAX_SCORE: !Sub "${HighDormancyMaxScore}"
          MEDIUM_DORMANCY_MAX_SCORE: !Sub "${MediumDormancyMaxScore}"
          LOW_DORMANCY_MAX_SCORE: !Sub "${LowDormancyMaxScore}"
          EXTERNAL_ID: !Ref ExternalId
          # ADMIN_SSO_PREFIXES: comma-separated prefixes for admin/maintenance SSO roles.
          # Propagated into config dict so all downstream Lambdas can read it consistently.
          ADMIN_SSO_PREFIXES: !Ref AdminSSOPrefixes
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

