      Code:
        ZipFile: |
          ########################################################################################################
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0
          ########################################################################################################
          """
          CollectIAMMetrics Lambda (Python)

          Collects per-account IAM activity metrics (90-day lookback):
            - ActiveIAMUserCount: IAM users with password/key activity in 90 days
              Source: IAM Credential Report (single CSV, all users)
            - ActiveIAMRoleCount: Non-SSO IAM roles with RoleLastUsed.LastUsedDate in 90 days
              Source: GetAccountAuthorizationDetails (returns LastUsedDate inline)
            - ActiveSSOUserCount: AWSReservedSSO_* roles used in 90 days
              Source: Same GetAccountAuthorizationDetails call (zero extra API calls)

          WHY GetAccountAuthorizationDetails instead of ListRoles:
            ListRoles does NOT return RoleLastUsed.LastUsedDate (always null).
            Only GetAccountAuthorizationDetails returns correct RoleLastUsed data.

          All log output is structured JSON for CloudWatch Logs Insights queries.
          Per-entity details are collated into a single JSON log entry per account
          (iam_users_detail / iam_roles_detail) to keep log volume constant regardless
          of how many roles or users exist in the account.
          """
          import csv
          import io
          import json
          import logging
          import os
          import re
          import time
          import boto3
          from botocore.exceptions import ClientError
          from datetime import datetime, timezone, timedelta
          from botocore.config import Config as BotoConfig

          # Adaptive client-side rate limiting with more attempts, so API throttling is retried
          # instead of being recorded as a partial collection failure.
          RETRY_CONFIG = BotoConfig(retries={"max_attempts": 10, "mode": "adaptive"})

          LOOKBACK_DAYS = 90
          # Number of times to poll GetCredentialReport while the report is still being
          # built, and the delay between polls. Total max wait = retries * delay seconds.
          # 30 * 3s = 90s, well within the 300s Lambda timeout. The report is generated
          # fresh on nearly every run (once-daily job, IAM caches the report ~4h), so the
          # budget must cover a cold generation for large accounts, not just a cached fetch.
          MAX_CREDENTIAL_REPORT_RETRIES = 30
          CREDENTIAL_REPORT_POLL_DELAY_S = 3
          SSO_ROLE_PREFIX = "AWSReservedSSO_"
          # Per-principal detail logs (IAM user names, credential types, role names) are opt-in.
          # Counts are always logged and returned.
          LOG_IAM_PRINCIPAL_NAMES = os.environ.get("LOG_IAM_PRINCIPAL_NAMES", "false").lower() == "true"

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)


          def log(level, event, message, **fields):
              """Emit a structured JSON log line via the logging module."""
              record = {
                  "event": event,
                  "message": message,
              }
              record.update(fields)
              getattr(logger, level.lower(), logger.info)(json.dumps(record))


          def assume_role(role_arn, session_name, external_id=""):
              sts = boto3.client("sts")
              kwargs = {"RoleArn": role_arn, "RoleSessionName": session_name[:64]}
              if external_id:
                  kwargs["ExternalId"] = external_id
              resp = sts.assume_role(**kwargs)
              creds = resp["Credentials"]
              return {
                  "aws_access_key_id": creds["AccessKeyId"],
                  "aws_secret_access_key": creds["SecretAccessKey"],
                  "aws_session_token": creds["SessionToken"],
              }


          # GetCredentialReport error codes that mean "not ready yet — keep polling".
          # These are the actual Error.Code wire values returned by the IAM
          # GetCredentialReport API, NOT boto3 exception class names:
          #   ReportInProgress  (HTTP 404) — report is still being generated
          #   ReportNotPresent  (HTTP 410) — report does not exist yet; because we just
          #                                  called GenerateCredentialReport, treat this as
          #                                  pending and keep polling for generation to finish.
          _REPORT_PENDING_CODES = (
              "ReportInProgress",
              "ReportNotPresent",
          )
          # GenerateCredentialReport error codes that are safe to ignore: they mean a
          # generation task is already queued or the account's report-generation task
          # capacity is saturated. The account-wide report is regenerated at most every
          # 4 hours, so an existing (cached) report can still be fetched via
          # GetCredentialReport — we must NOT treat these as fatal.
          _GENERATE_TOLERATED_CODES = (
              "LimitExceeded",
              "LimitExceededException",
              "Throttling",
              "ThrottlingException",
          )


          def get_credential_report_content(iam_client, account_id, account_name):
              """
              Ensure a credential report exists and return its decoded CSV content.

              Correct AWS polling pattern (see GenerateCredentialReport / GetCredentialReport
              API references):
                1. Request generation ONCE via GenerateCredentialReport. GenerateCredentialReport
                   is the LAUNCH API — calling it repeatedly in a loop consumes the account's
                   limited report-generation task slots and triggers
                   "LimitExceeded: No more capacity to launch new report generation tasks".
                   We therefore call it once and TOLERATE LimitExceeded/Throttling: the report
                   is regenerated at most every 4 hours, so a usable cached report almost always
                   already exists.
                2. Poll GetCredentialReport (NOT GenerateCredentialReport). It raises
                   ReportInProgress (report still building) or ReportNotPresent (report not
                   yet created) while the report is being built, and returns the CSV once the
                   report is COMPLETE.
                3. If the cached report is expired (ReportExpired), regenerate ONCE (again
                   tolerating limits) and keep polling.

              Raises RuntimeError if the report never becomes available within the poll budget.
              """
              # Step 1: kick off generation once; never fail on capacity/throttle here.
              try:
                  iam_client.generate_credential_report()
              except ClientError as e:
                  code = e.response.get("Error", {}).get("Code", "")
                  if code in _GENERATE_TOLERATED_CODES:
                      log("WARNING", "credential_report_generate_throttled",
                          "GenerateCredentialReport limited/throttled — polling for the "
                          "existing cached report instead of launching a new task",
                          accountId=account_id, accountName=account_name, errorCode=code)
                  else:
                      raise

              # Step 2: poll GetCredentialReport until the report is available.
              regenerated_on_expiry = False
              last_pending_code = None
              for _ in range(MAX_CREDENTIAL_REPORT_RETRIES):
                  try:
                      resp = iam_client.get_credential_report()
                      content = resp["Content"]
                      if isinstance(content, (bytes, bytearray)):
                          content = content.decode("utf-8")
                      return content
                  except ClientError as e:
                      code = e.response.get("Error", {}).get("Code", "")
                      if code in _REPORT_PENDING_CODES:
                          # Report not generated yet or still building — wait and retry.
                          last_pending_code = code
                          time.sleep(CREDENTIAL_REPORT_POLL_DELAY_S)
                          continue
                      if code == "ReportExpired" and not regenerated_on_expiry:
                          # Cached report is too old. Regenerate ONCE (tolerating limits) and
                          # continue polling for the fresh report.
                          regenerated_on_expiry = True
                          try:
                              iam_client.generate_credential_report()
                          except ClientError as gen_err:
                              gen_code = gen_err.response.get("Error", {}).get("Code", "")
                              if gen_code not in _GENERATE_TOLERATED_CODES:
                                  raise
                          time.sleep(CREDENTIAL_REPORT_POLL_DELAY_S)
                          continue
                      raise

              raise RuntimeError(
                  "Credential report did not become available after %d polls (last state: %s)"
                  % (MAX_CREDENTIAL_REPORT_RETRIES, last_pending_code or "unknown"))


          def get_latest_activity_date(*date_strings):
              """Return the most recent datetime from a list of ISO date strings, ignoring N/A values."""
              latest = None
              for ds in date_strings:
                  if not ds or ds in ("N/A", "no_information", ""):
                      continue
                  try:
                      d = datetime.fromisoformat(ds.replace("Z", "+00:00"))
                      if d.tzinfo is None:
                          d = d.replace(tzinfo=timezone.utc)
                      if latest is None or d > latest:
                          latest = d
                  except (ValueError, TypeError):
                      pass
              return latest


          def collect_active_iam_users(iam_client, active_after, account_id, account_name):
              """
              Generate and parse credential report.
              Returns active user count.
              Emits a single iam_users_detail log containing all active user details
              as a JSON array — one log entry per account regardless of user count.
              """
              content = get_credential_report_content(iam_client, account_id, account_name)

              reader = csv.DictReader(io.StringIO(content))
              active_count = 0
              active_users = []
              for row in reader:
                  user_name = row.get("user", "")
                  if user_name == "<root_account>":
                      continue

                  # Determine which credential(s) were used most recently
                  password_last_used = row.get("password_last_used") or ""
                  key1_last_used = row.get("access_key_1_last_used_date") or ""
                  key2_last_used = row.get("access_key_2_last_used_date") or ""

                  last_used = get_latest_activity_date(password_last_used, key1_last_used, key2_last_used)
                  if last_used and last_used >= active_after:
                      active_count += 1
                      # Determine which credentials contributed to the active signal
                      active_credentials = []
                      if password_last_used and password_last_used not in ("N/A", "no_information", ""):
                          pd = get_latest_activity_date(password_last_used)
                          if pd and pd >= active_after:
                              active_credentials.append("password")
                      if key1_last_used and key1_last_used not in ("N/A", "no_information", ""):
                          kd1 = get_latest_activity_date(key1_last_used)
                          if kd1 and kd1 >= active_after:
                              active_credentials.append("access_key_1")
                      if key2_last_used and key2_last_used not in ("N/A", "no_information", ""):
                          kd2 = get_latest_activity_date(key2_last_used)
                          if kd2 and kd2 >= active_after:
                              active_credentials.append("access_key_2")
                      active_users.append({
                          "userName": user_name,
                          "lastActiveDate": last_used.isoformat(),
                          "activeCredentials": active_credentials,
                      })

              # Single collated log entry for all active users in this account, written only when
              # LogIamPrincipalNames=true because it contains IAM user names.
              if LOG_IAM_PRINCIPAL_NAMES:
                  log("INFO", "iam_users_detail",
                      "Active IAM users collated",
                      accountId=account_id,
                      accountName=account_name,
                      activeIAMUserCount=active_count,
                      activeUsers=active_users)

              return active_count


          def collect_active_iam_and_sso_roles(iam_client, active_after, account_id, account_name,
                                               admin_sso_prefixes):
              """
              Count active IAM roles, SSO roles, and admin SSO roles via a single
              GetAccountAuthorizationDetails call.
              Returns (activeIAMRoleCount, activeSSOUserCount, activeAdminSSOUserCount).

              SSO roles (AWSReservedSSO_*) are split into two buckets based on admin_sso_prefixes:
                - Roles matching any admin prefix → activeAdminSSOUserCount (excluded from scoring)
                - All other AWSReservedSSO_* roles → activeSSOUserCount (used for scoring)
              When admin_sso_prefixes is empty all AWSReservedSSO_* roles go to activeSSOUserCount
              and activeAdminSSOUserCount is always 0 (backward-compatible default behaviour).
              Non-SSO roles are counted exclusively in activeIAMRoleCount.

              All role details are collated into a single iam_roles_detail log entry per account
              instead of one log entry per role, keeping log volume O(1) per account.
              """
              active_iam_role_count = 0
              active_sso_user_count = 0
              active_admin_sso_count = 0
              active_iam_roles = []
              active_sso_user_roles = []
              active_admin_sso_roles = []
              paginator = iam_client.get_paginator("get_account_authorization_details")

              for page in paginator.paginate(Filter=["Role"]):
                  for role in page.get("RoleDetailList", []):
                      role_last_used = role.get("RoleLastUsed") or {}
                      last_used_date = role_last_used.get("LastUsedDate")
                      if last_used_date is None:
                          continue
                      if last_used_date.tzinfo is None:
                          last_used_date = last_used_date.replace(tzinfo=timezone.utc)
                      if last_used_date >= active_after:
                          role_name = role.get("RoleName") or ""
                          last_used_region = role_last_used.get("Region", "unknown")
                          last_used_iso = last_used_date.isoformat()
                          role_entry = {
                              "roleName": role_name,
                              "lastUsedDate": last_used_iso,
                              "lastUsedRegion": last_used_region,
                          }

                          if role_name.startswith(SSO_ROLE_PREFIX):
                              # Check if this SSO role matches any admin prefix.
                              # Wrapped in try/except so a malformed prefix or unexpected
                              # error never breaks role counting — safe fallback is to treat
                              # the role as a regular SSO role (counted in activeSSOUserCount).
                              try:
                                  is_admin = admin_sso_prefixes and any(
                                      role_name.startswith(p) for p in admin_sso_prefixes
                                  )
                              except Exception as prefix_err:
                                  log("WARNING", "admin_prefix_match_failed",
                                      "Admin prefix matching failed for role — treating as regular SSO role",
                                      accountId=account_id,
                                      accountName=account_name,
                                      roleName=role_name,
                                      error=str(prefix_err))
                                  is_admin = False
                              if is_admin:
                                  active_admin_sso_count += 1
                                  active_admin_sso_roles.append(role_entry)
                              else:
                                  active_sso_user_count += 1
                                  active_sso_user_roles.append(role_entry)
                          else:
                              active_iam_role_count += 1
                              active_iam_roles.append(role_entry)

              # Single collated log entry for all active roles in this account, written only when
              # LogIamPrincipalNames=true because it contains role and permission set names.
              if LOG_IAM_PRINCIPAL_NAMES:
                  log("INFO", "iam_roles_detail",
                      "Active IAM roles and SSO roles collated",
                      accountId=account_id,
                      accountName=account_name,
                      activeIAMRoleCount=active_iam_role_count,
                      activeSSOUserCount=active_sso_user_count,
                      activeAdminSSOUserCount=active_admin_sso_count,
                      activeIAMRoles=active_iam_roles,
                      activeSSOUserRoles=active_sso_user_roles,
                      activeAdminSSORoles=active_admin_sso_roles)

              return active_iam_role_count, active_sso_user_count, active_admin_sso_count


          # Input validation (threat T8, mitigation M16). accountId arrives in the invocation payload,
          # so its format is checked before it is used in a role ARN or session name. The role name and
          # ExternalId come only from this function's environment (set by CloudFormation), never from the
          # payload, so a direct invocation can't point AssumeRole at a different role.
          ACCOUNT_ID_PATTERN = re.compile(r"[0-9]{12}")


          def require_account_id(value):
              if not isinstance(value, str) or not ACCOUNT_ID_PATTERN.fullmatch(value):
                  raise ValueError("Invalid accountId in input: expected a 12-digit AWS account ID")
              return value


          def handler(event, context):
              config = event.get("config", {})
              account = event["account"]
              account_id = require_account_id(account.get("accountId"))
              account_name = account["accountName"]
              errors = []
              failed_signals = []

              # Read lookback from config dict (set by GetAccounts) or fall back to env var / default.
              lookback_days = int(config.get("lookbackDays") or os.environ.get("LOOKBACK_DAYS", "90"))
              cross_account_role_name = os.environ["CROSS_ACCOUNT_ROLE_NAME"]
              active_after = datetime.now(timezone.utc) - timedelta(days=lookback_days)

              # Parse admin SSO prefixes from config dict (propagated by GetAccounts) or env var fallback.
              # Empty string → no admin prefix filtering (backward-compatible default behaviour).
              # Wrapped in try/except so a malformed value never prevents IAM collection from starting.
              try:
                  admin_sso_prefixes_raw = config.get("adminSSOPrefixes") or os.environ.get("ADMIN_SSO_PREFIXES", "")
                  admin_sso_prefixes = [p.strip() for p in admin_sso_prefixes_raw.split(",") if p.strip()]
              except Exception as parse_err:
                  log("WARNING", "admin_sso_prefixes_parse_failed",
                      "Failed to parse AdminSSOPrefixes — admin prefix filtering disabled for this account",
                      accountId=account_id, accountName=account_name, error=str(parse_err))
                  admin_sso_prefixes = []

              log("INFO", "collection_start", "Starting IAM metrics collection",
                  accountId=account_id, accountName=account_name, lookbackDays=lookback_days,
                  adminSSOPrefixCount=len(admin_sso_prefixes))

              role_arn = f"arn:aws:iam::{account_id}:role/{cross_account_role_name}"
              external_id = os.environ.get("EXTERNAL_ID", "")
              creds = assume_role(role_arn, f"IAM-{account_id}", external_id)
              iam_client = boto3.client("iam", config=RETRY_CONFIG, **creds)

              active_iam_user_count = 0
              try:
                  active_iam_user_count = collect_active_iam_users(
                      iam_client, active_after, account_id, account_name)
                  log("INFO", "iam_users_summary",
                      "Active IAM user collection complete",
                      accountId=account_id, accountName=account_name,
                      activeIAMUserCount=active_iam_user_count)
              except Exception as e:
                  failed_signals.append("iamUsers")
                  msg = f"IAM user collection failed for {account_id}: {e}"
                  log("ERROR", "iam_users_failed",
                      "IAM user collection failed",
                      accountId=account_id, accountName=account_name, error=str(e))
                  errors.append(msg)

              active_iam_role_count = 0
              active_sso_user_count = 0
              active_admin_sso_count = 0
              try:
                  active_iam_role_count, active_sso_user_count, active_admin_sso_count = \
                      collect_active_iam_and_sso_roles(
                          iam_client, active_after, account_id, account_name, admin_sso_prefixes)
                  log("INFO", "iam_roles_summary",
                      "Active IAM role collection complete",
                      accountId=account_id, accountName=account_name,
                      activeIAMRoleCount=active_iam_role_count,
                      activeSSOUserCount=active_sso_user_count,
                      activeAdminSSOUserCount=active_admin_sso_count)
                  # Emit an informational log when admin prefixes are configured but no matching
                  # roles exist in this account. This is normal — not all accounts have every
                  # admin permission set assigned — but the log helps detect prefix typos.
                  if admin_sso_prefixes and active_admin_sso_count == 0:
                      log("INFO", "no_admin_sso_roles_matched",
                          "AdminSSOPrefixes configured but no matching active SSO roles found "
                          "in this account — all active SSO roles counted in ActiveSSOUserCount",
                          accountId=account_id, accountName=account_name,
                          configuredPrefixes=admin_sso_prefixes)
              except Exception as e:
                  # SSO sign-ins come from the same role listing, so both signals are missing.
                  failed_signals.extend(["iamRoles", "sso"])
                  msg = f"IAM role collection failed for {account_id}: {e}"
                  log("ERROR", "iam_roles_failed",
                      "IAM role collection failed",
                      accountId=account_id, accountName=account_name, error=str(e))
                  errors.append(msg)

              log("INFO", "collection_complete", "IAM metrics collection complete",
                  accountId=account_id, accountName=account_name,
                  activeIAMUserCount=active_iam_user_count,
                  activeIAMRoleCount=active_iam_role_count,
                  activeSSOUserCount=active_sso_user_count,
                  activeAdminSSOUserCount=active_admin_sso_count,
                  errorCount=len(errors))

              return {
                  "accountId": account_id,
                  "accountName": account_name,
                  "activeIAMUserCount": active_iam_user_count,
                  "activeIAMRoleCount": active_iam_role_count,
                  "activeSSOUserCount": active_sso_user_count,
                  "activeAdminSSOUserCount": active_admin_sso_count,
                  "collectionTimestamp": event.get("collectionTimestamp"),
                  "errors": errors,
                  "failedSignals": failed_signals,
              }
      Environment:
        Variables:
          CROSS_ACCOUNT_ROLE_NAME: !Ref CrossAccountRoleName
          # LOOKBACK_DAYS: passed so the handler can read it from config or env var fallback
          LOOKBACK_DAYS: !Sub "${LookbackDays}"
          EXTERNAL_ID: !Ref ExternalId
          # ADMIN_SSO_PREFIXES: comma-separated prefixes for admin/maintenance SSO roles
          # read from config dict (propagated by GetAccounts) with env var as fallback.
          ADMIN_SSO_PREFIXES: !Ref AdminSSOPrefixes
          LOG_IAM_PRINCIPAL_NAMES: !Ref LogIamPrincipalNames
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

  CollectConfigFn:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_117"
            comment: >
              Lambda functions call only public AWS API endpoints (Organizations, Config,
              CloudWatch, IAM, STS, Cost Explorer). VPC placement would require NAT Gateways
              or multiple VPC Interface Endpoints adding significant cost with no security
              benefit. Cross-account access is controlled exclusively by IAM role trust policies.
          - id: "CKV_AWS_116"
            comment: >
              All Lambda functions are invoked SYNCHRONOUSLY by Step Functions using the
              arn:aws:states:::lambda:invoke integration. DLQs only capture asynchronous
              Lambda failures. Synchronous failures are returned directly to Step Functions
              and handled by the state machine Retry/Catch configuration. A DLQ here would
              never receive any events.
          - id: "CKV_AWS_173"
            comment: >
              Environment variables hold only the operational configuration this function reads
              (account IDs, role names, namespaces, scoring settings) plus EXTERNAL_ID, the
              sts:AssumeRole external ID used for confused-deputy protection. AWS IAM does not
              treat the external ID as a secret
              (https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_third-party.html):
              it is visible in the role trust policy and in AWS CloudTrail, and its value comes
              from the account boundary, not from confidentiality. Values are encrypted at rest
              with the AWS managed key for AWS Lambda; read access is limited to principals with
              lambda:GetFunctionConfiguration. A customer managed key would add a second access
              check, which is not needed for values that are not secrets. No passwords, API keys,
              access keys, or email addresses are stored in environment variables.
          - id: "CKV_AWS_50"
            comment: >
              X-Ray tracing is intentionally disabled. This is a scheduled batch monitoring
              solution (daily 2:00 AM UTC) with Step Functions Retry/Catch error handling.
              X-Ray adds cost with no operational benefit for non-latency-sensitive background
              jobs. Health is monitored via CloudWatch Logs and custom Step Functions metrics
              (ExecutionDurationSeconds, MetricCollectionSuccess/Failure).
