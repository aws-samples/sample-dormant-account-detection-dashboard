      FunctionName: DormantAccountDetection-CollectIAM
      Description: >
        Counts active IAM users, roles, and SSO permission sets per account (90-day lookback)
        via IAM Credential Report and GetAccountAuthorizationDetails.
      Runtime: python3.14
      Handler: index.handler
      MemorySize: !Ref LambdaMemoryMB
      Timeout: 300
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      Role: !GetAtt CollectIAMRole.Arn
      TracingConfig:
