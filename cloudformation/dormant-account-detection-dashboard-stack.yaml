    DependsOn: [LogGroupCollectCost]
    Properties:
      FunctionName: DormantAccountDetection-CollectCost
      Description: Fetches monthly cost data for all accounts via a single Cost Explorer API call.
      Runtime: python3.14
      Handler: index.handler
      MemorySize: !Ref LambdaMemoryMB
      Timeout: 180
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      Role: !GetAtt CollectCostRole.Arn
      TracingConfig:
        Mode: PassThrough  # X-Ray intentionally disabled: scheduled batch job with SFN Retry/Catch error handling. Suppressed: CKV_AWS_50/AwsSolutions-L2
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: /aws/lambda/DormantAccountDetection-CollectCost
      Code:
        ZipFile: |
          ########################################################################################################
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0
          ########################################################################################################
          """
          CollectCostMetrics Lambda (Python)

          Retrieves monthly cost data for ALL target accounts in a single Cost Explorer API call.
          Groups by LINKED_ACCOUNT to get per-account breakdown simultaneously.

          Metric collected:
            - MonthlyCostUSD: Total blended cost for the previous full calendar month (USD)

          NOTE: Cost Explorer API is only available in us-east-1.

          All log output is structured JSON for CloudWatch Logs Insights queries.
          """
          import json
          import logging
          import os
          import re
          import boto3
          from datetime import datetime, timezone, date
          from botocore.config import Config as BotoConfig

          # Adaptive client-side rate limiting with more attempts, so API throttling is retried
          # instead of being recorded as a partial collection failure.
          RETRY_CONFIG = BotoConfig(retries={"max_attempts": 10, "mode": "adaptive"})

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)


          def log(level, event, message, **fields):
              """Emit a structured JSON log line via the logging module."""
              record = {
                  "event": event,
                  "message": message,
              }
              record.update(fields)
              getattr(logger, level.lower(), logger.info)(json.dumps(record))


          def assume_role(role_arn, session_name, external_id=""):
              sts = boto3.client("sts")
              kwargs = {"RoleArn": role_arn, "RoleSessionName": session_name[:64]}
              if external_id:
                  kwargs["ExternalId"] = external_id
              resp = sts.assume_role(**kwargs)
              creds = resp["Credentials"]
              return {
                  "aws_access_key_id": creds["AccessKeyId"],
                  "aws_secret_access_key": creds["SecretAccessKey"],
                  "aws_session_token": creds["SessionToken"],
              }


          def previous_month_start():
              today = date.today()
              first_of_this_month = today.replace(day=1)
              last_month = first_of_this_month.replace(month=first_of_this_month.month - 1) \
                  if first_of_this_month.month > 1 \
                  else first_of_this_month.replace(year=first_of_this_month.year - 1, month=12)
              return last_month.strftime("%Y-%m-%d")


          def previous_month_end():
              today = date.today()
              return today.replace(day=1).strftime("%Y-%m-%d")


          def previous_month_label():
              start = previous_month_start()
              return start[:7]  # YYYY-MM


          # Input validation (threat T8, mitigation M16). Account IDs arrive in the invocation payload,
          # so entries without a 12-digit accountId are dropped before use. Account IDs, role names,
          # ExternalId, and the aggregator name used for AssumeRole come only from this function's
          # environment (set by CloudFormation), never from the payload.
          ACCOUNT_ID_PATTERN = re.compile(r"[0-9]{12}")


          def valid_accounts(accounts):
              valid = [a for a in (accounts or [])
                       if isinstance(a, dict) and isinstance(a.get("accountId"), str)
                       and ACCOUNT_ID_PATTERN.fullmatch(a["accountId"])]
              if len(valid) != len(accounts or []):
                  log("WARNING", "invalid_account_ids_dropped",
                      "Dropped input entries without a valid 12-digit accountId",
                      droppedCount=len(accounts or []) - len(valid))
              return valid


          def handler(event, context):
              accounts = valid_accounts(event.get("accounts", []))
              errors = []

              management_account_id = os.environ["MANAGEMENT_ACCOUNT_ID"]
              cross_account_role_name = os.environ["CROSS_ACCOUNT_ROLE_NAME"]
              billing_period = previous_month_label()
              start_date = previous_month_start()
              end_date = previous_month_end()

              log("INFO", "collection_start", "Starting Cost Explorer metrics collection",
                  accountCount=len(accounts), billingPeriod=billing_period,
                  startDate=start_date, endDate=end_date)

              role_arn = f"arn:aws:iam::{management_account_id}:role/{cross_account_role_name}"
              external_id = os.environ.get("EXTERNAL_ID", "")
              creds = assume_role(role_arn, "DormantAccountDetection-CollectCost", external_id)

              # Cost Explorer is only available in us-east-1
              ce_client = boto3.client("ce", region_name="us-east-1", config=RETRY_CONFIG, **creds)

              target_account_ids = {a["accountId"] for a in accounts}
              metrics_map = {a["accountId"]: {"accountId": a["accountId"], "monthlyCostUSD": 0.0, "billingPeriod": billing_period}
                             for a in accounts}

              try:
                  next_page_token = None
                  while True:
                      kwargs = {
                          "TimePeriod": {"Start": start_date, "End": end_date},
                          "Granularity": "MONTHLY",
                          "Metrics": ["BlendedCost"],
                          "GroupBy": [{"Type": "DIMENSION", "Key": "LINKED_ACCOUNT"}],
                      }
                      if next_page_token:
                          kwargs["NextPageToken"] = next_page_token  # pragma: allowlist secret

                      resp = ce_client.get_cost_and_usage(**kwargs)

                      for result_by_time in resp.get("ResultsByTime", []):
                          for group in result_by_time.get("Groups", []):
                              account_id = (group.get("Keys") or [None])[0]
                              if not account_id or account_id not in target_account_ids:
                                  continue
                              amount_str = (group.get("Metrics", {}).get("BlendedCost", {}).get("Amount") or "0")
                              try:
                                  monthly_cost = float(amount_str)
                              except ValueError:
                                  monthly_cost = 0.0
                              metrics_map[account_id] = {
                                  "accountId": account_id,
                                  "monthlyCostUSD": monthly_cost,
                                  "billingPeriod": billing_period,
                              }

                      next_page_token = resp.get("NextPageToken")  # pragma: allowlist secret
                      if not next_page_token:
                          break

                  log("INFO", "collection_complete", "Cost Explorer metrics collection complete",
                      accountCount=len(metrics_map), billingPeriod=billing_period)
              except Exception as e:
                  msg = f"Cost Explorer query failed: {e}"
                  log("ERROR", "collection_failed",
                      "Cost Explorer query failed", error=str(e))
                  errors.append(msg)

              return {
                  "metrics": list(metrics_map.values()),
                  "collectionTimestamp": event.get("collectionTimestamp"),
                  "errors": errors,
                  "failedSignals": ["cost"] if errors else [],
              }
      Environment:
        Variables:
          MANAGEMENT_ACCOUNT_ID: !Ref ManagementAccountId
          CROSS_ACCOUNT_ROLE_NAME: !Ref CrossAccountRoleName
          EXTERNAL_ID: !Ref ExternalId
      Tags:
        - { Key: Solution, Value: DormantAccountDetection }
        - { Key: ManagedBy, Value: CloudFormation }

