{HighDormancyMaxScore} | **HIGH (2)** | Minimal activity — likely dormant |\n| ≤ ${CriticalDormancyMaxScore} | **CRITICAL (1)** | No measurable activity — strong dormancy candidate |\n\n**Score formula (hybrid self-baselining, configurable via `CloudFormation`):** Human presence (absolute, all-or-nothing): +${DormancyWeightSSOPresence} ActiveSSOUserCount>0, +${DormancyWeightIAMUserPresence} ActiveIAMUserCount>0. Activity trends (self-relative, points = weight × trend ratio): +${DormancyWeightApiCallTrend}×ApiCallCount trend, +${DormancyWeightIAMRoleTrend}×ActiveIAMRoleCount trend, +${DormancyWeightCostTrend}×MonthlyCostUSD trend, +${DormancyWeightResourceCreatedTrend}×ResourceCreatedCount trend. Trend ratio = mean(last N days) / mean(first N days) of the account's **own** metric history, capped at 1.0, with N = ${TrendWindowFraction}×${LookbackDays} days — stable or growing activity earns full points, declining activity earns proportionally fewer; accounts with under 2×N days of history get full trend points (cold-start safe). TotalResourceCount is not scored (standing inventory, not activity). Lookback: ${LookbackDays} days"}},{"type":"metric","width":12,"height":8,"x":0,"y":3,"properties":{"view":"timeSeries","title":"Dormancy Score per Account (0=fully dormant, 100=fully active)","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"DormancyScore\"', 'Maximum', 86400)","period":86400}]],"yAxis":{"left":{"min":0,"max":100,"label":"Score","showUnits":false}}}},{"type":"metric","width":12,"height":8,"x":12,"y":3,"properties":{"view":"timeSeries","title":"Dormancy Rating per Account (1=CRITICAL, 5=ACTIVE)","region":"${AWS::Region}","metrics":[[{"label":"${!PROP('Dim.AccountName')} ${!PROP('Dim.AccountId')}","expression":"SEARCH('{${MetricsNamespace},AccountId,AccountName} __ACCTFILTER__ MetricName=\"DormancyRating\"', 'Maximum