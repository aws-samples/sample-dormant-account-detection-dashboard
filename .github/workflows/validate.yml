# Static validation only. This workflow never uses AWS credentials.

name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install cfn-lint
        run: pip install "cfn-lint==1.51.4"
      - name: Lint CloudFormation templates
        # Fail on errors only. W1030 flags optional KMS ARN parameters whose empty default is guarded by a Condition.
        run: cfn-lint --non-zero-exit-code error cloudformation/*.yaml
      - name: Compile inline Lambda code
        run: python3 scripts/check_inline_lambda_code.py cloudformation/*.yaml
